<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>《解放战争》· 师级指挥模拟器 v1.1 · 情报与对手</title>
<style>
:root{
  --bg:#0c1210; --panel:#131c18; --panel2:#18241f; --line:#2a3a33;
  --tx:#dbe6df; --mut:#8ba79a; --dim:#638074;
  --ours:#57c9a0; --ours2:#89e6c0; --enemy:#dc6d60; --gold:#e4b969; --blue:#6fa8c8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-size:13px;line-height:1.6}
body{background-image:radial-gradient(circle at 20% 0%,#14221c 0%,transparent 55%),radial-gradient(circle at 90% 100%,#1a1c16 0%,transparent 50%)}
button,select{font-family:inherit;font-size:12px;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--ours);color:var(--ours2)}
button:disabled{opacity:.4;cursor:not-allowed}
select{width:100%}
.app{max-width:1560px;margin:0 auto;padding:12px;display:grid;grid-template-columns:274px minmax(520px,1fr) 318px;grid-template-rows:auto 1fr auto;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.brand small{display:block;font-size:10px;letter-spacing:1px;color:var(--mut);font-weight:400}
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--tx);font-weight:600}
.chip.gold b{color:var(--gold)}
.left,.right{overflow:auto;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
.center{display:flex;flex-direction:column;gap:9px}
.bottom{grid-column:1/-1}
h3{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px;font-weight:600}
h3 span{color:var(--dim);font-weight:400;letter-spacing:0}
.sub{font-size:11px;color:var(--mut);margin:0 0 8px}
/* map */
.mapwrap{background:#111a16;border:1px solid var(--line);border-radius:7px;padding:9px;overflow:auto}
.map{position:relative;width:100%;aspect-ratio:800/480;min-height:380px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#0e1713}
.geosvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tile{fill:transparent;pointer-events:all;cursor:crosshair}
.tile:hover{fill:rgba(228,185,105,.10);stroke:#e4b969;stroke-width:1.6}
.btnlink{display:inline-block;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;color:var(--tx);font-size:12px}
.btnlink:hover{border-color:var(--ours);color:var(--ours2)}
.geonote{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.6}
.placeitem{font-size:10px;color:#9fb8aa;padding:4px 6px;border-bottom:1px dotted #223129;line-height:1.5}
.placeitem b{color:var(--gold);font-weight:500}
.placeitem em{font-style:normal;color:var(--dim)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* v0.5 多级比例尺地图：工具栏、图层、比例尺、情报卡、分组图例 */
.maptools{margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.zoomrow,.layerrow,.taskrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
/* v1.2 分级兵要地志图例行 */
.cartrow .csw{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#b9cdc2;white-space:nowrap}
.cartrow .csw i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.cartrow .crule{font-size:11px;color:#8fa79c;line-height:1.45}
/* v1.2 分级兵要地志清单（可折叠） */
.cartod{margin:5px 0;border:1px solid #2b4034;border-radius:4px;padding:4px 6px;background:#0e1b16}
.cartod summary{cursor:pointer;font-size:11px;color:var(--gold);font-weight:600;line-height:1.5}
.cartod .placeitem{font-size:10.5px}
.cartoitem{cursor:pointer;border-left:2px solid transparent;transition:background .15s}
.cartoitem:hover{background:#16281f;border-left-color:var(--gold)}
.zl{font-size:10px;color:var(--dim);letter-spacing:1px;margin-right:3px;white-space:nowrap}
.zbtn{font-size:11px;padding:4px 8px}
.zbtn.on{background:#245c48;border-color:#3d9673;color:#eafff3;font-weight:700}
.zsep{width:1px;height:16px;background:var(--line);margin:0 3px}
.crumb{font-size:10px;color:var(--mut);margin-left:auto;line-height:1.5}
.crumb b{color:var(--gold)}
.lchip{font-size:10px;padding:3px 7px;display:inline-flex;align-items:center;gap:4px;opacity:.55}
.lchip.on{opacity:1;border-color:var(--ours);color:var(--tx)}
.lchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.lchip.reset{color:var(--gold);opacity:1}
.taskrow select{width:auto;min-width:118px;padding:3px 6px;font-size:11px}
.taskhint{font-size:10px;color:var(--dim);line-height:1.4}
.depbar{background:#20362a;border-left:3px solid var(--ours);padding:6px 9px;font-size:11px;color:#c8e9d7;margin-top:4px}
.depbar b{color:var(--gold)}
.depbar button{margin-left:8px;font-size:10px;padding:2px 7px}
.mapfoot{display:flex;align-items:center;gap:14px;margin-top:7px;flex-wrap:wrap}
.sbar{display:flex;align-items:flex-end;gap:5px;font-size:10px;color:var(--mut)}
.sbar i{display:block;height:7px;border:1px solid #9fb8aa;border-top:0;background:linear-gradient(90deg,#9fb8aa 50%,transparent 50%);background-size:12px 100%}
.sbar b{color:var(--tx);font-weight:500}
.north{font-size:11px;color:var(--gold);font-weight:700}
.north span{display:inline-block;color:var(--enemy);font-size:13px}
.sbnote{font-size:10px;color:var(--dim)}
.mapinfo{background:#0f1a14;border:1px solid #24382c;border-radius:5px;padding:8px 10px;margin-top:8px;font-size:11px;color:#a9c0b3;line-height:1.65;min-height:58px}
.mapinfo b{color:var(--gold)}
.mapinfo em{color:var(--dim);font-style:normal;font-size:10px}
.mihead{font-size:12px;margin-bottom:5px}
.mihead span{color:var(--mut);font-size:10px;margin-left:6px}
.migrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;margin:5px 0}
.migrid div{background:#182820;border-radius:3px;padding:2px 6px;font-size:10px;color:var(--mut)}
.migrid b{float:right;color:var(--tx)}
.misrc{color:var(--dim);font-size:10px;margin:4px 0}
.midep{color:var(--ours2);margin-top:4px}
.midep button{font-size:10px;padding:2px 7px;margin-left:6px}
.lg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:3px 0;border-bottom:1px dotted #223129;width:100%}
.lg>b{color:var(--gold);font-size:10px;min-width:52px;font-weight:500}
.lg span{display:inline-flex;align-items:center;white-space:nowrap}
.ls{width:22px;height:14px;vertical-align:-3px;margin-right:3px;flex:none}
/* v0.6 下级指挥 UI */
.cmdgroup{margin:5px 0}
.cmdgroup>span{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:2px}
.tn.b.sel,.tn.c.sel,.tn.s.sel{background:#1d3a2d;color:var(--ours2)}
.focusrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.focusrow b{font-size:11px;color:var(--gold);font-weight:500}
.focusrow .sub{flex:1;min-width:180px;margin:0}
/* tree */
.tn{padding:3px 5px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.tn:hover{background:#1e2e26}
.tn.root{color:var(--gold);font-weight:700;font-size:12px;cursor:default}
.tn.root:hover{background:none}
.tn span{color:var(--dim);font-size:10px}
.tn.p{color:var(--ours2);border-left:2px solid #2f6c56;padding-left:6px;margin-top:3px}
.tn.p.sel{background:#1d3a2d}
.tn.b{color:#a9c6b8;padding-left:14px}
.tn.c{color:#8fae9f;padding-left:26px}
.tn.s{color:#7d9c8e;padding-left:38px;font-size:10px}
.tn.dep{color:var(--gold)}
.tn.sup{color:#8fc4d8;padding-left:6px}
.tn.dead{opacity:.4;text-decoration:line-through}
.arrow{display:inline-block;width:13px;color:var(--dim)}
/* detail */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;margin-bottom:8px}
.kv div{background:var(--panel2);border-radius:3px;padding:3px 6px;color:var(--mut)}
.kv b{color:var(--tx);float:right}
.bar{height:5px;background:#223129;border-radius:3px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--ours);border-radius:3px}
.bar i.low{background:var(--enemy)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0}
.cmd{text-align:left;padding:5px 7px;font-size:11px;line-height:1.3}
.cmd.active{border-color:var(--gold);color:var(--gold)}
.hint{background:#1c2a22;border-left:2px solid var(--gold);padding:6px 8px;font-size:11px;color:#b8d0c2;margin:7px 0}
.warnbox{background:#2a1f1b;border-left:2px solid var(--enemy);padding:6px 8px;font-size:11px;color:#e2b9b1;margin:7px 0}
.queue{font-size:10px;color:var(--mut);max-height:120px;overflow:auto}
.queue div{border-bottom:1px dotted #25362e;padding:3px 0}
.enemyrow{display:flex;justify-content:space-between;font-size:10px;color:#d8afa8;padding:2px 4px;background:#261a18;border-radius:3px;margin-bottom:3px}
details{border-top:1px solid var(--line);padding:5px 0;font-size:11px}
summary{cursor:pointer;color:var(--mut);font-size:11px}
details p{color:#9fb8aa;margin:5px 0 0;font-size:10.5px;line-height:1.55}
details em{color:var(--dim);font-style:normal;font-size:10px}
/* log */
.logbox{height:132px;overflow:auto;font-size:11px;line-height:1.65;background:#0f1713;border-radius:4px;padding:7px 9px;border:1px solid #213028}
.logbox div{border-bottom:1px dotted #1e2c25;padding:1px 0;color:#a9c0b3}
.logbox .t{color:var(--dim);margin-right:5px}
.logbox .order{color:#a9d6e8}.logbox .combat{color:#e6b9a5}.logbox .good{color:var(--ours2)}
.logbox .warn{color:#e8a99c}.logbox .supply{color:#c9d69a}.logbox .wire{color:var(--gold)}
.actions{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.big{background:#245c48;border-color:#3d9673;color:#eafff3;font-weight:700;padding:8px 18px;font-size:13px;letter-spacing:1px}
.big:hover{background:#2d7459;color:#fff}
.stats{display:flex;gap:14px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.stats b{color:var(--tx)}
/* overlay */
/* v1.4 · 右键上下文命令环（现代 RTS 交互） */
.ctxmenu{display:none;position:absolute;z-index:40;min-width:186px;max-width:260px;
  background:#101b15;border:1px solid #5a4a28;border-radius:4px;
  box-shadow:0 12px 34px #000a;padding:4px}
.ctxmenu.on{display:block}
.ctxmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  background:transparent;border:0;border-radius:3px;color:#dbe7df;font-size:12px;
  padding:8px 10px;cursor:pointer;text-align:left;min-height:36px}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:#243424;color:#f0d89a;outline:none}
.ctxmenu button[disabled]{opacity:.42;cursor:not-allowed}
.ctxmenu .k{font:10px var(--mono);color:#8a7338;flex:none}
.ctxmenu .sep{border-top:1px solid #2b4034;margin:3px 2px}
.ctxmenu .mhead{padding:5px 10px 6px;font:10px var(--mono);color:#8ba79a;border-bottom:1px solid #2b4034}
@media(max-width:900px){.ctxmenu button{min-height:44px;font-size:13px}}
/* v1.4 小地图 / 悬停预览均为地图内 SVG 图元，无额外 DOM */
/* v1.4.1 地图选点不再误触发整片文本选中：SVG 内文字与 numeral 一律不可选，
   桌面 / 移动 / 平板统一约束（旧规则只在 ≤900px 生效，是「全选」的根因） */
.map{cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.geosvg,.geosvg text,.geosvg title,.map .tile{user-select:none;-webkit-user-select:none}
.map::selection,.map *::selection{background:transparent;color:inherit}
.map.cmdmode{cursor:cell}
.map.deploymode{cursor:move}
/* v1.4 覆盖层：align-items:flex-start + margin:auto 让超高内容始终可从顶部滚动，
   不再出现「顶部被裁且滚不到」；overscroll 防止滚动穿透到主界面。 */
.ov{position:fixed;inset:0;background:rgba(5,10,8,.88);z-index:50;display:flex;align-items:flex-start;
  justify-content:center;padding:clamp(10px,3vh,28px) clamp(10px,3vw,28px);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ovcard{background:#131c18;border:1px solid #3a5547;border-radius:9px;max-width:min(820px,100%);
  width:100%;margin:auto;padding:24px 28px;box-shadow:0 20px 70px #000}
/* 开场命令夹：标题与按钮常驻，只有中间长介绍滚动；100dvh 兼容移动端地址栏 */
.startcard{max-height:calc(100vh - clamp(20px,6vh,56px));max-height:calc(100dvh - clamp(20px,6vh,56px));
  display:flex;flex-direction:column;overflow:hidden}
.startcard .ovhead,.startcard .ovfoot{flex:none}
.startcard .ovbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:8px}
.ovfoot{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ovfoot button{min-height:44px}
.startmore{margin:10px 0;border:1px solid #33483a;border-left:3px solid var(--brass);border-radius:3px;background:#101c16}
.startmore summary{cursor:pointer;padding:8px 11px;font-size:11.5px;color:var(--brass);font-weight:600}
.startmore .facts{margin:0 10px 10px;border-left:none}
.ovcard h1{margin:0 0 4px;font-size:24px;color:var(--gold);letter-spacing:3px}
.ovcard h2{margin:0 0 14px;font-size:12px;color:var(--mut);font-weight:400;letter-spacing:1px}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:14px 0}
.sc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px;cursor:pointer}
.sc:hover,.sc.on{border-color:var(--gold);background:#202a1e}
.sc b{color:var(--gold);font-size:13px;display:block;margin-bottom:4px}
.sc p{margin:0;font-size:10.5px;color:var(--mut);line-height:1.55}
.wire{background:#1d2a20;border-left:3px solid var(--gold);padding:10px 13px;font-size:12px;color:#d8e5d6;margin:12px 0;line-height:1.8}
.facts{font-size:11px;color:#9db6a8;background:#16211b;padding:10px 13px;border-radius:5px;line-height:1.75}
.facts b{color:var(--ours2)}
.evlist{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0}
.ev{font-size:11px;padding:5px 8px;border-radius:4px;background:#1a261f}
.ev.y{color:var(--ours2)}.ev.n{color:#e0a99e}
/* ============================================================
   v0.8 · 移动设备友好（手机 / 平板）
   桌面三栏保持不变；≤1180px 两栏；≤900px 单栏 + 底部操作栏 + 抽屉。
   触控目标 ≥44px，地图视口按容器比例自适应，安全区适配。
   ============================================================ */
.mstatus,.mbar,.mscrim,.mapframe #mapfs{display:none}
.mapframe{position:relative}

@media(max-width:1180px) and (min-width:901px){
  .app{grid-template-columns:minmax(0,1fr) 300px;gap:8px}
  .top{grid-column:1/-1;gap:10px}
  .center{grid-column:1;grid-row:2}
  .right{grid-column:2;grid-row:2;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}
  .left{grid-column:1/-1;grid-row:3;max-height:250px;overflow:auto}
  .bottom{grid-column:1/-1;grid-row:4}
  .chips{order:2}
}

@media(max-width:900px){
  html,body{font-size:14px;-webkit-text-size-adjust:100%}
  body{background-image:none}
  .app{display:block;padding:8px;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
  .top,.left,.right,.bottom{display:none}
  .center{display:block}
  .center>.panel:last-child{display:none}
  .mapwrap{padding:8px;overflow:visible}
  .map{aspect-ratio:800/480;height:auto;min-height:240px;touch-action:none;-webkit-user-select:none;user-select:none}
  .maptools{margin-bottom:6px}
  .maptools .layerrow,.maptools .taskrow,.maptools .focusrow,.maptools .crumb,.maptools .zsep{display:none}
  .maptools .zoomrow,.maptools .fxrow{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .maptools .fxrow button{flex:none;white-space:nowrap;min-height:40px}
  .fxsummary .fxnote{display:none}
  .maptools .zoomrow button{min-height:44px;white-space:nowrap;flex:none}
  .maptools .zl{display:none}
  .geonote,.legend{display:none}
  .mapinfo{font-size:12.5px;min-height:0;max-height:150px;overflow:auto}
  button,select,.btnlink{min-height:44px;font-size:14px;padding:9px 13px}
  .cmd{min-height:48px;font-size:13px;line-height:1.35}
  .lchip,.zbtn{min-height:40px}
  .tn{padding:9px 6px;font-size:13px;min-height:40px}
  .kv,.placeitem,.queue div,.enemyrow,.sub,.hint,.warnbox,.misrc{font-size:12.5px}
  .logbox{height:190px;font-size:12.5px}
  .ovcard{padding:18px 16px}
  .startcard{padding:14px 14px}
  .startcard .ovbody{padding-right:4px}
  .startmore summary{min-height:44px;display:flex;align-items:center}
  .scs{grid-template-columns:1fr}
  .evlist{grid-template-columns:1fr}
  .facts,.wire{font-size:12.5px}
  .mstatus{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin:0 8px 8px;font-size:12px;line-height:1.8}
  .mstatus span{display:inline-block;margin-right:9px;white-space:normal}
  .mstatus b{color:var(--gold)}
  .mstatus span{color:var(--mut)}
  .mbar{display:flex;flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;z-index:64;gap:5px;
    padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    background:rgba(10,16,13,.98);border-top:1px solid var(--line)}
  .mbar button[data-sheet]{flex:1 1 0}
  .mbar button{flex:1 1 0;min-width:0;min-height:46px;font-size:13px;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar button.on{border-color:var(--gold);color:var(--gold)}
  .mbar .mprimary{flex:1 1 100%;order:-1;min-height:46px;background:#245c48;border-color:#3d9673;color:#eafff3;font-weight:700;font-size:14px}
  .mscrim{position:fixed;inset:0;background:rgba(3,8,6,.68);z-index:60}
  body[data-sheet] .mscrim{display:block}
  .msheet-open::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:#5c7a69;margin:0 auto 10px}
  .msheet-open{position:fixed!important;display:block!important;left:0;right:0;bottom:0;top:auto!important;
    z-index:62;max-height:min(78vh,680px);max-height:min(78dvh,680px);overflow:auto;border-radius:18px 18px 0 0;border-bottom:0;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom))!important;
    box-shadow:0 -14px 44px rgba(0,0,0,.66);-webkit-overflow-scrolling:touch}
  .mapframe #mapfs{display:flex;flex-direction:column;position:absolute;right:10px;bottom:10px;z-index:12;gap:5px}
  .mapframe #mapfs button{min-height:44px;min-width:44px;padding:5px 10px;font-size:15px;
    font-weight:700;color:#eafff3;background:rgba(14,42,32,.97);border:1px solid #63d2a8;
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  body.map-full{overflow:hidden}
  body.map-full .app{display:block;padding:0}
  body.map-full .app>.top,body.map-full .app>.left,body.map-full .app>.right,
  body.map-full .app>.bottom,body.map-full .center>.panel:last-child{display:none}
  body.map-full .center{display:block}
  body.map-full .mapwrap{display:flex;flex-direction:column;position:fixed;inset:0;z-index:70;
    border-radius:0;padding:8px;margin:0;overflow:hidden;background:#0c1210}
  body.map-full .mapframe{flex:1;min-height:0}
  body.map-full .map{height:100%;min-height:0;aspect-ratio:auto}
  body.map-full .mapinfo,body.map-full .legend,body.map-full .geonote,body.map-full .mapfoot{display:none}
  body.map-full .mapframe #mapfs{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));
    top:auto;left:auto;flex-direction:column;z-index:80}
  body.map-full .mapframe #mapfs button:last-child{background:#245c48;color:#fff;font-size:13px}
  body.map-full .mstatus,body.map-full .mbar{display:none}
  body.map-full .maptools .layerrow,body.map-full .maptools .taskrow,
  body.map-full .maptools .focusrow{display:flex}
  body.map-full .maptools{flex:none}
  body.map-full .legend,body.map-full .geonote,body.map-full .mapinfo,body.map-full .mapfoot{display:none!important}
}

/* v1.4 窄屏：剧目卡片单列 + 按钮整行，避免文字截断与误触 */
@media(max-width:620px){
  .scs{grid-template-columns:1fr}
  .ovfoot button{flex:1 1 100%}
}
@media(max-width:420px){
  .mstatus{font-size:11px;margin:0 6px 6px}
  .app{padding:6px;padding-bottom:calc(128px + env(safe-area-inset-bottom))}
  .mbar button{font-size:12px;padding:5px 2px}
  .mbar .mprimary{font-size:12.5px}
  .cmds{grid-template-columns:1fr 1fr;gap:6px}
  .migrid{grid-template-columns:1fr 1fr}
  .map{min-height:220px}
}

@media(max-width:900px) and (orientation:landscape){
  .map{min-height:220px}
  .msheet-open{max-height:86vh;max-height:86dvh}
}

/* ============================================================
   v0.9 · 态势表现：摘要卡、时间轴、克制动画
   动画只表达方向 / 瞬时事件，不改变信息本身；reduced-motion 与移动端静态降级。
   ============================================================ */
.fxsummary{background:#101c17;border:1px solid #2a3a33;border-radius:6px;padding:8px 10px;margin:8px 0}
.fxhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;margin-bottom:6px}
.fxhead b{color:var(--gold);font-weight:600}
.fxhead span{color:var(--mut)}
.fxhead button{margin-left:auto;padding:3px 8px;font-size:11px}
.fxchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.fxchip{background:#16241d;border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.fxchip b{color:var(--tx);font-weight:600}
.fxchip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:0}
.fxchip.muted{color:var(--dim)}
.fxchip em{font-style:normal;color:var(--dim);margin-left:5px;font-size:10px}
.fxbars{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 12px}
.fxbar{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut)}
.fxbar>span{width:62px;flex:none}
.fxbar>i{flex:1;height:6px;background:#1b2a22;border-radius:3px;overflow:hidden;display:block}
.fxbar>i>b{display:block;height:100%;border-radius:3px}
.fxbar>em{width:26px;text-align:right;font-style:normal;color:var(--dim)}
.fxnote{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.5}
.fxrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:5px 0}
.fxrow .zl{font-size:10px;color:var(--dim);letter-spacing:1px;margin-right:2px}
.fxrow button{padding:3px 8px;font-size:11px}
.fxrow button.on{background:#245c48;border-color:#3d9673;color:#eafff3}
.fxtag{font-size:11px;color:var(--gold);padding:2px 7px;background:#1a2a20;border:1px solid var(--line);border-radius:3px}
.fxhint{font-size:10px;color:var(--dim)}

@keyframes fxflow{to{stroke-dashoffset:-24}}
@keyframes fxpop{0%{opacity:0;transform:scale(.55)}65%{opacity:1;transform:scale(1.06)}100%{opacity:.94;transform:scale(1)}}
@keyframes fxfloat{0%{opacity:0;transform:translateY(5px)}18%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
@keyframes fxpulse{0%,100%{opacity:.42}50%{opacity:.92}}
.fx-anim .fx-flow{animation:fxflow 1.7s linear infinite}
.fx-anim .fx-pop{animation:fxpop .42s ease-out both;transform-box:fill-box;transform-origin:center}
.fx-anim .fx-float{animation:fxfloat 2.6s ease-out both;transform-box:fill-box;transform-origin:center}
.fx-anim .fx-pulse{animation:fxpulse 2.4s ease-in-out infinite}
.fx-static .fx-flow,.fx-static .fx-pop,.fx-static .fx-float,.fx-static .fx-pulse{animation:none}
@media(prefers-reduced-motion:reduce){
  .fx-anim .fx-flow,.fx-anim .fx-pop,.fx-anim .fx-float,.fx-anim .fx-pulse{animation:none}
}
@media(max-width:900px){
  .fxsummary{padding:7px 8px}
  .fxbars{grid-template-columns:repeat(2,1fr)}
  .fxrow .fxhint{display:none}
  .fxrow button{min-height:36px}
  .fx-anim .fx-flow,.fx-anim .fx-pop,.fx-anim .fx-float,.fx-anim .fx-pulse{animation:none}
  body.map-full .fxsummary{display:none}
}

/* ============================================================
   v1.0 · 指挥所作战台（HUD 化）
   ------------------------------------------------------------
   把"标题 + 列表 + 表单"改为"编号模块 + 仪表 + 指令卡 + 通信台 +
   电报回执 + 纸带战报"。所有 id、onclick 与 innerHTML 文案不变，
   仅改变信息的载体；桌面三栏与移动端抽屉规则保持。
   ============================================================ */
:root{
  --brass:#c8a55e; --brass2:#8a7338; --plate:#101a15; --plate2:#16231c;
  --slot:#0b1410; --lampOn:#7ee0b0; --lampOff:#3d5a4a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
.app{counter-reset:mod}
body{background-image:
  linear-gradient(rgba(120,170,140,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(120,170,140,.025) 1px,transparent 1px),
  radial-gradient(circle at 18% 0%,#14241c 0%,transparent 58%);
  background-size:32px 32px,32px 32px,auto}

/* --- 编号模块铭牌：每个面板像一块仪表模块 --- */
.panel{position:relative;border-radius:3px;border:1px solid #31473a;
  background:linear-gradient(#141f19,#101a15);padding:12px}
.panel::before,.panel::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none}
.panel::before{left:-1px;top:-1px;border-left:2px solid var(--brass);border-top:2px solid var(--brass)}
.panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--brass2);border-bottom:2px solid var(--brass2)}
.top{padding:9px 13px;gap:12px;background:linear-gradient(#18261e,#121d17)}
.left,.right{background:linear-gradient(#131e18,#0f1914)}
h3{display:flex;align-items:center;gap:8px;counter-increment:mod;
  margin:0 0 9px;padding:0 0 7px;border-bottom:1px solid #2b4034;
  font-size:11.5px;letter-spacing:1.5px;color:var(--brass);font-weight:500}
h3::before{content:counter(mod,decimal-leading-zero);flex:none;
  font:10px var(--mono);color:#0d1611;background:var(--brass);
  padding:2px 4px;border-radius:1px;letter-spacing:0}
h3 span{margin-left:auto;text-align:right;max-width:64%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:10px;letter-spacing:0}
h3 b{color:var(--gold)}
.mapwrap{background:linear-gradient(#101b16,#0d1612);border:1px solid #31473a;border-radius:3px}

/* --- 按钮：切角指令键 + 按压反馈 --- */
button{position:relative;border-radius:2px;border:1px solid #37503f;
  background:#18271f;color:var(--tx);transition:border-color .12s,background .12s,transform .08s}
button:hover{border-color:var(--brass);color:#f0e2bd;background:#20342a}
button:active{transform:translateY(1px);background:#0f1c15}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
.topbtns{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.topbtns button,.topbtns .btnlink{font-size:11px;padding:5px 9px;letter-spacing:.5px}
.topbtns .btnlink{background:#18271f;border:1px solid #37503f;border-radius:2px;color:var(--tx)}
.big{font:500 14px var(--mono);letter-spacing:2px;padding:10px 22px;
  background:#234f3e;border:1px solid #6cc79b;color:#eafff3;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13);border-radius:2px}
.big:hover{background:#2e6b52;border-color:#9ae8c0;color:#fff}
.big::before{content:'▸ ';color:#a9f0cd}
.big:disabled{opacity:.35;box-shadow:none}

/* --- 顶栏：指挥所铭牌 + 仪表胶囊 --- */
.brand{position:relative;padding-left:13px;font-size:19px;color:#f0d89a;
  text-shadow:none;letter-spacing:3px;font-weight:700;white-space:nowrap}
.brand::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:4px;
  background:var(--brass);box-shadow:3px 0 0 #5a4a24}
.brand small{font:9px var(--mono);letter-spacing:1px;color:#8ba79a;font-weight:400}
.chips{gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#101c16;
  border:1px solid #2c4034;border-radius:2px;padding:3px 8px;
  font-size:10px;color:var(--mut);white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--lampOff);box-shadow:0 0 0 1px #243a2e}
.chip b{font:500 12px var(--mono);color:var(--tx);letter-spacing:.3px}
.chip.gold{border-color:#6a572c}
.chip.gold::before{background:var(--brass);box-shadow:0 0 5px rgba(228,185,105,.55)}
.chip.gold b{color:#f0d89a}
.chip.turnbar{min-width:104px;background:#0d1813}
.chip.turnbar::after{content:'';flex:1;height:4px;min-width:34px;border-radius:2px;
  background:linear-gradient(90deg,var(--ours) var(--fill,20%),#1d2c23 var(--fill,20%))}

/* --- 编制树：单位卡（军标块 + 兵力条 + 状态灯） --- */
.tn{display:flex;align-items:center;gap:5px;min-height:23px;padding:3px 6px;
  border:1px solid transparent;border-left:2px solid #2c4c3c;border-radius:2px;
  background:#111c16;margin-bottom:2px;font-size:11px;white-space:nowrap}
.tn:hover{background:#1a2c22;border-color:#3d5f4b}
.tn.root{background:#1a2a1e;border-left-color:var(--brass);color:#f0d89a;
  font:500 11px var(--mono);letter-spacing:1px}
.tn.root::before{content:'◈';color:var(--brass);margin-right:4px}
.tn.root span{margin-left:auto;font-size:9px;color:var(--dim)}
.tn.p{font-weight:500;color:#c8e6d5}
.tn.b{border-left-color:#4c7f65}.tn.c{border-left-color:#3d6666}
.tn.s{border-left-color:#56704a;font-size:10px}
.tn.sel{background:#24422f;border-color:var(--ours)!important;
  box-shadow:inset 3px 0 0 var(--ours2)}
.tn .arrow{flex:none;width:12px;color:var(--dim);font-family:var(--mono)}
.tn .mini{width:20px;height:14px;flex:none;display:grid;place-items:center;
  background:#1c3327;border:1px solid #41634f;border-radius:1px;
  font:9px var(--mono);color:var(--gold)}
.tn .lamp{width:6px;height:6px;border-radius:50%;flex:none;background:var(--lampOn);
  box-shadow:0 0 4px rgba(126,224,176,.6)}
.tn .lamp.off{background:var(--lampOff);box-shadow:none}
.tn .lamp.foe{background:#e08072;box-shadow:0 0 4px rgba(224,128,114,.6)}
.tn span{font:9.5px var(--mono);color:var(--dim);margin-left:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .mbar{display:inline-block;width:26px;height:4px;flex:none;border-radius:2px;
  background:#223129;overflow:hidden;margin-left:auto}
.tn .mbar i{display:block;height:100%;background:var(--ours)}
.tn.dead{opacity:.38;text-decoration:line-through}
.tn.dep{border-left-color:var(--brass)}

/* --- 单位详情：数据格 + 槽形状态条 --- */
.kv{gap:4px;margin-bottom:9px}
.kv div{background:#101c16;border:1px solid #293c31;border-radius:2px;
  padding:4px 6px;font-size:10px;color:var(--dim);position:relative}
.kv b{font:500 12px var(--mono);color:var(--tx)}
.bar{height:8px;background:var(--slot);border:1px solid #2b4134;border-radius:2px;
  padding:1px;overflow:hidden;margin:3px 0 8px;
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px)}
.bar i{display:block;height:100%;border-radius:1px;background:var(--ours)}
.bar i.low{background:var(--enemy)}
.stats{gap:6px}
.stats span{display:inline-flex;flex-direction:column;gap:1px;background:#101c16;
  border:1px solid #293c31;border-radius:2px;padding:4px 8px;font-size:9px;color:var(--dim)}
.stats b{font:500 14px var(--mono);color:var(--ours2);line-height:1.1}

/* --- 命令面板：指令卡（图标 / 名称 / 代价角标 / 分类色条） --- */
.cmds{gap:5px;margin:7px 0}
.cmd{display:flex;align-items:center;gap:7px;min-height:42px;padding:5px 7px;
  text-align:left;overflow:hidden;border:1px solid #2f4638;border-radius:2px;
  background:#14221b;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.cmd::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:2px;
  background:var(--fam,#4c7f65);opacity:.75}
.cmd-ico{flex:none;width:24px;height:24px;display:grid;place-items:center;
  background:#1a3024;border:1px solid #3d6149;border-radius:2px;
  font:500 13px var(--mono);color:var(--brass)}
.cmd-txt{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.cmd-txt b{font-size:11.5px;font-weight:500;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-txt em{font-style:normal;font-size:9px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-cost{position:absolute;top:2px;right:3px;font:9px var(--mono);color:var(--dim)}
.cmd.active{border-color:var(--brass);background:#332f1c}
.cmd.active .cmd-ico{background:#4a3d1e;border-color:var(--brass);color:#ffe6ad}
.cmd.active .cmd-txt b{color:#ffe6ad}
.cmdgroup{margin:7px 0}
.cmdgroup>span{display:flex;align-items:center;gap:6px;font:9.5px var(--mono);
  letter-spacing:1.5px;color:var(--brass2);margin-bottom:3px;text-transform:none}
.cmdgroup>span::after{content:'';flex:1;height:1px;background:#2b4034}
.hint,.warnbox{border-radius:2px;border-left:3px solid var(--brass);
  background:#18251d;font-size:10.5px;line-height:1.6}
.warnbox{border-left-color:var(--enemy);background:#261a18}
.hint button{font-size:10px;padding:2px 7px;margin-left:5px}

/* --- 通信台：实体按键替代下拉框 --- */
.comm-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.commpad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:2px 0 6px}
.commkey{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;min-height:52px;padding:4px 2px;border:1px solid #334b3b;border-radius:2px;
  background:#111e17;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.commkey .ck-ico{font:500 15px var(--mono);color:#7fa78f;line-height:1.1}
.commkey .ck-n{font-size:10px;color:var(--mut);white-space:nowrap}
.commkey .ck-d{font:9px var(--mono);color:var(--dim)}
.commkey.on{border-color:var(--brass);background:#2b2a1a;
  box-shadow:inset 0 0 0 1px rgba(228,185,105,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.commkey.on .ck-ico{color:#ffe0a0;text-shadow:0 0 6px rgba(228,185,105,.5)}
.commkey.on .ck-n{color:#f0d89a}
.commkey:last-child{grid-column:span 3;min-height:38px;flex-direction:row;gap:8px}
.commkey:last-child .ck-d{margin-left:auto;margin-right:8px}
#commdesc{background:#101c16;border-left:2px solid #3f5b49;border-radius:2px;
  padding:5px 8px;font-size:10px;color:var(--mut);margin-top:2px}

/* --- 传达队列：电报回执 --- */
.queue{max-height:132px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.queue div{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:#111e17;border:1px solid #2b4134;border-left:3px solid var(--brass);
  border-radius:2px;padding:4px 7px;font-size:10px;color:var(--mut)}
.queue div::after{content:'';position:absolute;right:5px;top:5px;width:5px;height:5px;
  border-radius:50%;background:var(--brass);box-shadow:0 0 5px rgba(228,185,105,.5)}
.queue div b{color:var(--tx);font-weight:500}
.queue .rc-t{font:500 10px var(--mono);color:var(--gold)}
.queue .rc-lv{font:9px var(--mono);background:#20362a;padding:1px 4px;border-radius:1px;color:var(--ours2)}
.queue .rc-cmd{font:10px var(--mono);color:#c8d8ce}

/* --- 敌情通报：态势卡（血条 / 装备标签 / 威胁灯） --- */
.foecard{background:#1d1614;border:1px solid #4a302b;border-left:3px solid #a8564a;
  border-radius:2px;padding:5px 7px;margin-bottom:4px}
.foecard.dim{opacity:.5;filter:saturate(.5)}
.fc-head{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#eac6bd}
.fc-head::before{content:'';width:6px;height:6px;border-radius:50%;background:#e08072;flex:none}
.fc-head b{font-weight:500}
.fc-head .tag{margin-left:auto;font:9px var(--mono);background:#3a2420;
  border:1px solid #6a3c34;border-radius:1px;padding:1px 4px;color:#e0a99e}
.fc-bar{height:5px;background:#2a1b18;border-radius:2px;overflow:hidden;margin:4px 0 3px}
.fc-bar i{display:block;height:100%;background:#c26a5c}
.fc-foot{display:flex;gap:8px;font:9px var(--mono);color:#a98b83}
.foeint{display:flex;align-items:center;gap:5px;margin-bottom:6px;
  font:10px var(--mono);color:var(--mut)}
.foeint i{flex:1;height:5px;background:#1d2c23;border-radius:2px;overflow:hidden}
.foeint i b{display:block;height:100%;background:var(--brass)}

/* --- 战报：电报纸带 --- */
.logbox{height:138px;background:#0b1410;border:1px solid #2a3d31;border-radius:2px;
  padding:6px 8px;font:10.5px/1.7 var(--mono);
  background-image:repeating-linear-gradient(0deg,transparent 0 21px,rgba(255,255,255,.018) 21px 22px)}
.logbox div{position:relative;border:0;border-bottom:1px dotted #1d2c23;
  padding:2px 0 2px 9px;color:#a9c0b3}
.logbox div::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;
  background:#3f5b49;border-radius:1px}
.logbox .t{display:inline-block;min-width:70px;color:#5f7a6d;font:9.5px var(--mono);margin-right:6px}
.logbox .order::before{background:#6fa8c8}.logbox .combat::before{background:#e08072}
.logbox .good::before{background:#7ee0b0}.logbox .warn::before{background:#e8a99c}
.logbox .wire::before{background:var(--brass)}.logbox .supply::before{background:#c9d69a}

/* --- 任务简报卡（当前指示） --- */
.briefcard{display:flex;flex-direction:column;gap:6px}
.bc-row{display:flex;gap:8px;align-items:flex-start;background:#101c16;
  border:1px solid #293c31;border-left:2px solid var(--brass);border-radius:2px;padding:5px 8px}
.bc-k{flex:none;font:9px var(--mono);letter-spacing:1px;color:var(--brass);
  background:#22301f;padding:2px 5px;border-radius:1px}
.bc-row p{margin:0;font-size:10.5px;line-height:1.55;color:#b8cdbf}
.bc-gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bcg{display:flex;flex-direction:column;gap:2px;background:#101c16;
  border:1px solid #293c31;border-radius:2px;padding:5px 7px}
.bcg span{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcg b{font:500 15px var(--mono);color:var(--gold);line-height:1.1}
.bcg small{font:9px var(--mono);color:var(--dim)}
.bc-note{font-size:10px;color:var(--mut);background:#16231c;
  border:1px dashed #35503e;border-radius:2px;padding:5px 8px;line-height:1.55}
.bc-quote{font:10px var(--mono);color:#7d9c8e;border-left:2px solid #3f5b49;padding-left:8px}
.actions{gap:10px;margin-top:9px;align-items:center}

/* --- 态势摘要卡：仪表化 --- */
.fxsummary{background:#0f1a14;border:1px solid #33483a;border-radius:2px;
  border-left:3px solid var(--brass);padding:8px 10px}
.fxhead{font:10px var(--mono);letter-spacing:.5px}
.fxhead b{font-size:11.5px;color:#f0d89a}
.fxchip{background:#14221b;border:1px solid #33483a;border-radius:2px}
.fxbar>i{background:var(--slot);border:1px solid #293c31;height:8px;padding:1px;border-radius:2px}
.fxbar>i>b{border-radius:1px}
.fxtag{border:1px solid #6a572c;background:#2a271a;color:#f0d89a;font:10px var(--mono)}
.fxrow button,.zoomrow button,.layerrow button,.taskrow button{
  font:10.5px var(--mono);border-radius:2px}
.zbtn.on,.fxrow button.on{background:#2f4c30;border-color:var(--brass);color:#ffe6ad}
.lchip.on{border-color:var(--brass);color:#f0d89a}
.lchip i{border-radius:1px}
.maptools{background:#0e1a14;border:1px solid #2a3d31;border-radius:2px;padding:7px 8px}
.zl{font:9px var(--mono);letter-spacing:1.5px;color:var(--brass2)}
.mapinfo{background:#0d1913;border:1px solid #2a3d31;border-left:3px solid #4c7f65;border-radius:2px}
.migrid div{background:#14231b;border:1px solid #293c31}
.legend .lg{border-bottom:1px dotted #2a3d31}
.lg>b{color:var(--brass);font:10px var(--mono)}
details{background:#101c16;border:1px solid #293c31;border-radius:2px;
  padding:4px 7px;margin-bottom:4px}
summary{font:10.5px var(--mono);color:#b6cdbf;list-style:none}
summary::before{content:'▸ ';color:var(--brass)}
details[open] summary::before{content:'▾ '}
details p{font-size:10.5px}
.placeitem{background:#101c16;border:1px solid #25382c;border-left:2px solid #3f5b49;
  border-radius:2px;padding:4px 7px;margin-bottom:3px}
.wire{background:#1a2519;border-left:3px solid var(--brass);border-radius:2px;
  font:11px var(--mono);letter-spacing:.2px}

/* --- 开场 / 命令夹 --- */
.ovcard{position:relative;background:#121d17;border:1px solid #5a4a28;
  border-radius:3px;padding:26px 30px;box-shadow:0 26px 80px #000}
.ovcard::before{content:'作 战 命 令 · 绝 密';position:absolute;right:24px;top:20px;
  font:9px var(--mono);letter-spacing:2px;color:#7a6634;border:1px solid #5a4a28;
  padding:3px 7px;transform:rotate(-2deg);opacity:.75}
.ovcard h1{font-size:26px;color:#f0d89a;letter-spacing:5px}
.ovcard h2{font:10px var(--mono);letter-spacing:1px;color:#8ba79a}
.facts{background:#101c16;border:1px solid #2f4638;border-left:3px solid #4c7f65;
  border-radius:2px;font-size:11px;line-height:1.85}
.scs{gap:8px}
.sc{position:relative;background:#14221b;border:1px solid #33483a;border-radius:2px;
  padding:12px;transition:border-color .12s,background .12s}
.sc::before{content:'◆';position:absolute;right:9px;top:7px;color:#3f5b49;font-size:11px}
.sc:hover,.sc.on{border-color:var(--brass);background:#24291b}
.sc.on::before{content:'✔';color:var(--brass)}
.sc.on::after{content:'已 选 定';position:absolute;right:8px;bottom:8px;
  font:9px var(--mono);color:#8a7338;border:1px solid #6a572c;padding:1px 4px;
  transform:rotate(-8deg)}
.sc b{color:#f0d89a;font-size:13px}
.evlist{gap:6px}
.ev{background:#14221b;border:1px solid #33483a;border-left:3px solid #3f5b49;border-radius:2px}
.ev.y{border-left-color:var(--ours)}
.ev.n{border-left-color:var(--enemy)}

/* --- 移动端：保持抽屉与大触控目标，仅降级装饰 --- */
@media(max-width:900px){
  .panel{padding:8px}
  .panel::before,.panel::after{display:none}
  h3::before{display:none}
  .commpad{grid-template-columns:repeat(2,1fr)}
  .commkey{grid-column:auto;min-height:48px;flex-direction:column}
  .commkey:last-child{grid-column:span 2;flex-direction:row;min-height:44px}
  .cmd{min-height:48px}
  .bc-gauges{grid-template-columns:repeat(2,1fr)}
  .ovcard::before,.sc.on::after{display:none}
  .logbox{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  button,.sc{transition:none}
}

.tn .mini,.tn .lamp{margin-left:0}

.tn .tn-n{font-weight:500;color:inherit;white-space:nowrap;overflow:hidden;

.tn .tn-txt{margin-left:0;max-width:84px;flex:none}
.sc-no{display:block;font:9px var(--mono);letter-spacing:1.5px;

.cmd{min-width:0}
.bc-gauges,.fxbars,.evlist,.migrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.fxbars{grid-template-columns:repeat(3,minmax(0,1fr))}
.bc-gauges{grid-template-columns:repeat(4,minmax(0,1fr))}
.evlist{grid-template-columns:repeat(2,minmax(0,1fr))}
.migrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.commpad{grid-template-columns:repeat(6,minmax(0,1fr))}
.commkey{grid-column:span 2;min-width:0;flex-direction:column;min-height:52px;gap:1px}
.commkey:nth-child(4),.commkey:nth-child(5){grid-column:span 3}
.commkey:last-child{flex-direction:column;min-height:52px;gap:1px}
.commkey:last-child .ck-d{margin:0}
.legendfold,.geonotefold{margin-top:7px}
.legendfold summary,.geonotefold summary{font-size:10.5px;color:var(--brass)}
.legendfold[open] .legend{margin-top:6px}
.geonotefold[open] .geonote{margin-top:6px}
@media(max-width:900px){
  .commpad{grid-template-columns:repeat(2,minmax(0,1fr))}
  .commkey,.commkey:nth-child(4),.commkey:nth-child(5){grid-column:span 1;min-height:48px;flex-direction:column}
  .commkey:last-child{grid-column:span 2;flex-direction:row;min-height:44px;gap:8px}
  .commkey:last-child .ck-d{margin-left:auto;margin-right:8px;margin-top:0}
  .cmds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmd{min-width:0}
  .bc-gauges,.fxbars,.evlist,.migrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legendfold,.geonotefold{display:none}
}

/* v1.0 移动端兜底：抽屉容器锁定视口宽，彻底消除桌面 grid 列宽残留 */
@media(max-width:900px){
  body{overflow-x:hidden}
  .app{width:100%;max-width:100%;overflow-x:hidden}
  .msheet-open{width:100vw!important;min-width:0!important;max-width:100vw!important;
    left:0!important;right:auto!important;box-sizing:border-box!important;overflow-x:hidden!important}
  .msheet-open .cmds,.msheet-open .commpad,.msheet-open .queue,
  .msheet-open .bc-gauges,.msheet-open .fxbars{max-width:100%}
}

/* v1.0 通信台终版：5 键等宽一行，消除 3+2 网格的空档 */
.commpad{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.commkey,.commkey:nth-child(4),.commkey:nth-child(5),.commkey:last-child{
  grid-column:auto!important;min-width:0;flex-direction:column;
  min-height:58px;gap:2px;padding:4px 2px}
.commkey:last-child .ck-d{margin:0!important}
.commkey .ck-d{font-size:8.5px;white-space:nowrap}
.commkey .ck-n{white-space:nowrap}
@media(max-width:900px){
  .commpad{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .commkey,.commkey:nth-child(4),.commkey:nth-child(5),.commkey:last-child{
    grid-column:auto!important;min-width:0;flex-direction:column;min-height:52px;gap:2px}
  .commkey .ck-n{font-size:9.5px}
  .commkey .ck-d{font-size:8px}
}
@media(max-width:420px){
  .commkey .ck-n{font-size:9px}
  .commkey .ck-d{font-size:7.5px}
}

  {id:'d1', date:'1946-09-16', title:'集中优势兵力，各个歼灭敌人', by:'中共中央军委指示（毛泽东起草）',
   src:'求是网《毛泽东选集》第四卷；央视网；中国共产党新闻网《大事记·1946年》',
   q:'集中优势兵力、各个歼灭敌人的作战方法，不但必须应用于战役的部署方面，而且必须应用于战术的部署方面。……这个旅（或团），应当是敌军诸旅中较弱的，或者是较少援助的，或者是其驻地的地形和民情对我最为有利而对敌不利的。我军以少数兵力牵制敌军的其余各旅（或团）……在战役部署上，必须反对那种轻视敌人、因而平分兵力对付诸路之敌、以致一路也不能歼灭、使自己陷于被动地位的错误的作战方法。',
   hint:'集中 3–6 倍兵力；牵制与突击分工；选择较弱的一点（不是两点）；可以允许放弃某些地方。'},
  {id:'d2', date:'1947-05-04 / 06 / 12', title:'孟良崮战役期间中央军委来电', by:'中央军委致华东野战军',
   src:'人民网党史《"意义极大"的孟良崮战役》；央视网《粟裕三获重要战役"专断权"》',
   q:'敌军密集不好打，忍耐待机，处置甚妥。只要有耐心，总有歼敌机会。／第一不要性急，第二不要分兵，只要主力在手，总有歼敌机会。／你们须聚精会神选择比较好打之一路，不失时机发起歼击。究打何路最好，由你们当机决策，立付施行，我们不遥制。',
   hint:'"我们不遥制"是本作开放式指挥的史实依据：上级给方针与意图，主攻方向、时机与打法由前线指挥员当机决断。'},
  {id:'d3', date:'1947-12-25 ~ 28', title:'目前形势和我们的任务 · 十大军事原则', by:'中共中央会议（陕北米脂杨家沟）',
   src:'国防部《唯创新者胜》；央视网《十大军事原则》；求是网《毛泽东选集》第四卷',
   q:'先打分散和孤立之敌，后打集中和强大之敌。……以歼灭敌人有生力量为主要目标，不以保守或夺取城市和地方为主要目标。每战集中绝对优势兵力（两倍、三倍、四倍，有时甚至是五倍或六倍于敌之兵力），四面包围敌人，力求全歼，不使漏网。……不打无准备之仗，不打无把握之仗。……力求在运动中歼灭敌人。……以俘获敌人的全部武器和大部人员，补充自己。……善于利用两个战役之间的间隙，休息和整训部队。',
   hint:'本作终局评分卡的八项指标即由此演化。'},
  {id:'d4', date:'1948-09-07 / 10-10', title:'关于辽沈战役的作战方针', by:'中央军委致林彪、罗荣桓、刘亚楼',
   src:'求是网《毛泽东选集》第四卷；央视网；人民网《"关门打狗"》',
   q:'不如置长、沈两敌于不顾，专顾锦、榆、唐一头为适宜。……（一）确立攻占锦、榆、唐三点并全部控制该线的决心。（二）确立打你们前所未有的大歼灭战的决心，即在卫立煌全军来援的时候敢于同他作战。（三）为适应上述两项决心，重新考虑作战计划并筹办全军军需（粮食、弹药、新兵等）和处理俘虏事宜。',
   hint:'中间突破、攻锦打援、控制北宁线；战役部署与后勤同时筹划。'},
  {id:'d5', date:'1948-10-04', title:'东北野战军塔山地区阻击电令', by:'东北野战军总部（转引自中国军网）',
   src:'中国军网《扼住咽喉：东北野战军攻占锦州之决策》；葫芦岛市人民政府《塔山阻击战》',
   q:'锦西以北大、小东山，锦州以南松山街皆为敌阵地，两锦仅距30公里，我军绝对不能采取运动防御的方法，必须采取在塔山、高桥及其以西以北部署，进行英勇顽强的防御战。必须死打硬拼、死守不退，抵抗敌之飞机大炮和步兵的猛烈冲击，利用工事沉着地准确地大量杀伤敌人。',
   hint:'明确"绝对不能采取运动防御"——这是本作阻援剧本的硬性约束，但把具体部署留给前线。'},
  {id:'d6', date:'1948-10-11', title:'关于淮海战役的作战方针', by:'中央军委致华东野战军并告华东局、中原局',
   src:'求是网《毛泽东选集》第四卷；人民网党史《淮海战役中毛泽东的全局指导》',
   q:'本战役第一阶段的重心，是集中兵力歼灭黄百韬兵团，完成中间突破，占领新安镇、运河车站、曹八集、峄县、枣庄、临城、韩庄、沭阳、邳县、郯城、台儿庄、临沂等地。……应以两个纵队担任歼灭敌一个师的办法，共以六个至七个纵队，分割歼灭敌二十五师、六十三师、六十四师。以五个至六个纵队，担任阻援和打援。……以上部署，即是说要用一半以上兵力，牵制、阻击和歼敌一部，以对付邱李两兵团，才能达到歼灭黄兵团三个师的目的。',
   hint:'电文中列出的新安镇、运河车站、曹八集、枣庄、临城、韩庄、邳县、台儿庄、临沂等，均为本作战场地图的真实地名。'},
  {id:'d7', date:'1948-11-09 ~ 11', title:'中央军委关于攻取宿县的电报', by:'中央军委致陈毅、邓小平等（史料转引）',
   src:'中国军网《淮海战役指挥通信》；人民网党史；二手战史转引（非电文全文）',
   q:'直出宿县，截断宿蚌路。／务须不顾一切，全力攻取宿县，切断徐蚌路。／以宿县为中心控制整个徐蚌线，构筑几道防线阻止徐敌南逃。',
   hint:'切断交通线比夺取城池更重要：津浦铁路徐蚌段是徐州集团唯一陆上通道。'},
  {id:'d8', date:'1948-11-16', title:'关于成立淮海前线总前委的指示电', by:'中共中央军委（毛泽东起草）',
   src:'中国共产党新闻网《中国共产党大事记·1948年》；人民网党史《刘伯承决战淮海》；中国工信新闻网《红色通信故事》',
   q:'中原、华东两军，必须准备在现地区作战三个月至五个月（包括休整时间在内），吃饭的人数连同俘虏在内将达八十万人左右……此战胜利，不但长江以北局面大定，即全国局面亦可基本上解决。望从这个观点出发统筹一切。统筹的领导，由刘、陈、邓、粟、谭五同志组成一个总前委……经常由刘陈邓三人为常委临机处置一切，小平同志为总前委书记。／在此方针下，由你们机断专行，不要事事请示……但将战况及意见每日或每两日或每三日报告一次。',
   hint:'"机断专行"＋定期报告：本作把"上报战况"做成机制，玩家自由指挥但须定期向师党委/上级报告。'},
  {id:'d9', date:'1948-12-11', title:'关于平津战役的作战方针', by:'中央军委致东北野战军',
   src:'民政部《党史百年·天天读》；中国共产党新闻网《平津战役》；人民网党史《论平津战役的指挥艺术》',
   q:'从本日起的两星期内，基本原则是围而不打（例如对张家口、新保安），有些则是隔而不围（即只作战略包围，隔断诸敌联系，而不作战役包围，例如对平、津、通州），以待部署完成之后各个歼敌。……我们的真正目的不是首先包围北平，而是首先包围津、塘、芦、唐诸点。……攻击次序大约是：第一塘芦区，第二新保安，第三唐山区，第四天津、张家口两区，最后北平区。',
   hint:'"围而不打"是本作一种可用命令：保持合围、暂不总攻，先断退路、待部署完成。'},
  {id:'d10', date:'1948-12-17', title:'敦促杜聿明等投降书', by:'中原、华东两人民解放军司令部（毛泽东撰稿）',
   src:'央视网《毛泽东选集》第四卷；人民网党史《不战而屈人之兵》',
   q:'你们现在已经到了山穷水尽的地步。……立即下令全军放下武器，停止抵抗，本军可以保证你们高级将领和全体官兵的生命安全。……如果你们还想打一下，那就再打一下，总归你们是要被解决的。',
   hint:'政治攻势不是装饰：淮海战役歼敌 55.5 万余人中，俘虏、起义、投诚 38 万余人，约占 69%。'},
  {id:'d11', date:'1949-04-21', title:'向全国进军的命令', by:'中国人民革命军事委员会主席毛泽东、中国人民解放军总司令朱德',
   src:'求是网《毛泽东选集》第四卷；央视网；人民网',
   q:'奋勇前进，坚决、彻底、干净、全部地歼灭中国境内一切敢于抵抗的国民党反动派，解放全国人民，保卫中国领土主权的独立和完整。……向任何国民党地方政府和地方军事集团宣布国内和平协定的最后修正案。',
   hint:'1949-04-23 占领南京；战略追击阶段的方针。'}
];

function proj(g, lon, lat){
  const b=g.bbox;
  return {x:clamp(Math.round((lon-b.lon0)/(b.lon1-b.lon0)*(W-1)),0,W-1),
          y:clamp(Math.round((b.lat1-lat)/(b.lat1-b.lat0)*(H-1)),0,H-1)};
}
function lineCells(g, pts){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=proj(g,pts[i][0],pts[i][1]), b=proj(g,pts[i+1][0],pts[i+1][1]);
    const steps=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y),1);
    for(let s=0;s<=steps;s++) out.push({x:clamp(Math.round(a.x+(b.x-a.x)*s/steps),0,W-1),y:clamp(Math.round(a.y+(b.y-a.y)*s/steps),0,H-1)});
  }
  return out;
}

function terrainFromElevation(h, gkey){
  if(gkey==='menglianggu') return h>=330?'m':h>=210?'h':h>=130?'f':'.';
  if(gkey==='tashan')      return h>=150?'m':h>=75?'h':h>=30?'f':'.';
  return h>=90?'h':h>=45?'f':'.';
}
function buildTerrain(gkey){
  const g=GEO[gkey], m=[];
  // 地形由真实 ASTER GDEM 高程场派生，不再程序生成
  for(let y=0;y<H;y++){
    const row=[];
    for(let x=0;x<W;x++) row.push(terrainFromElevation(sampleElevation(gkey,x,y),gkey));
    m.push(row);
  }
  const paint=(cells,ch)=>cells.forEach(c=>{ if(m[c.y][c.x]==='s') return; m[c.y][c.x]=ch; });
  g.rivers.forEach(r=>paint(lineCells(g,r.pts),'~'));
  g.roads.forEach(r=>paint(lineCells(g,r.pts),'='));
  g.rails.forEach(r=>paint(lineCells(g,r.pts),'r'));
  g.places.forEach(p=>{ if(p.t==='河流'||p.t==='海岛 / 滩涂'||p.t.indexOf('图外')>=0)return;
    const c=proj(g,p.lon,p.lat); if(m[c.y][c.x]!=='s') m[c.y][c.x]='v'; });
  if(gkey==='tashan') for(let y=0;y<H;y++) for(let x=0;x<W;x++)
    if((x>=15&&y>=6)||(y>=10&&x>=11)) m[y][x]='s';
  return m.map(r=>r.join(''));
}

const LEADERS = ['赵大柱','孙立成','周铁山','李满仓','王二河','陈根生','刘振海','杨石头','高青山','马长顺','何小顺','吴德胜','郑保全','徐来福','田有仓','石锁子'];
let lc = 0;
function nextLeader(){ return LEADERS[(lc++) % LEADERS.length]; }
function makeRegiment(i, name, x, y, men){
  const subs=[], bm=splitMen(men,3);
  for(let b=1;b<=3;b++){
    const comps=[], cm=splitMen(bm[b-1],3);
    for(let c=1;c<=3;c++){
      const squads=[], sm=splitMen(cm[c-1],3);
      for(let q=1;q<=3;q++) squads.push({
        id:'r'+i+'-'+b+'-'+c+'-'+q, name:c+'连'+q+'班', level:'squad',
        parent:'r'+i+'-'+b+'-'+c, reg:'r'+i,
        men:sm[q-1], men0:sm[q-1], leader:nextLeader(), political:ri(2,7),
        morale:78, fatigue:12, ammo:88, role:'recon', lastAct:'hold',
        order:{type:'hold'}, alive:true, detached:false, placed:null, home:null, repositioned:false
      });
      comps.push({id:'r'+i+'-'+b+'-'+c, name:b+'营'+c+'连', level:'company',
        parent:'r'+i+'-'+b, reg:'r'+i, men:cm[c-1], men0:cm[c-1],
        morale:78, fatigue:12, ammo:88, task:'support', lastAct:'hold',
        order:{type:'hold'}, alive:true, detached:false, placed:null, home:null, repositioned:false, squads});
    }
    subs.push({id:'r'+i+'-'+b, name:b+'营', level:'battalion', parent:'r'+i, reg:'r'+i,
      men:bm[b-1], men0:bm[b-1], morale:78, fatigue:12, ammo:88,
      task:BTASK_DEFAULT[b-1], order:{type:'hold'}, entrench:0, trench:0,
      fireReady:0, assault:false, ambush:false,
      alive:true, placed:null, home:null, repositioned:false, comps});
  }
  return {id:'r'+i, name, kind:'regiment', level:'regiment', x, y, men, men0:men,
    morale:78, fatigue:12, ammo:88, training:1.0, entrench:0, trench:0,
    order:{type:'hold'}, subs, alive:true, detached:false, subAnchor:{x,y}};
}
function support(id,name,kind,men,x,y,training){
  return {id,name,kind,level:'support',x,y,men,men0:men,morale:80,fatigue:8,ammo:90,
    training,entrench:0,trench:0,order:{type:'hold'},subs:[],alive:true,detached:false};
}
function makePieces(sc){
  lc = 0;
  const p = [];
  for(let i=1;i<=3;i++) p.push(makeRegiment(i, '第 '+i+' 团', sc.start[i-1].x, sc.start[i-1].y, sc.regMen));
  const base = sc.start[3];
  p.push(support('arty','师炮兵营','arty',sc.artyMen,base.x,base.y,1.05));
  p.push(support('recon','师侦察连','recon',170,base.x,clamp(base.y+1,0,H-1),1.05));
  p.push(support('comm','师通信班','comm',30,base.x,base.y,1.0));
  p.push(support('guard','师警卫连','guard',200,base.x,base.y,1.0));
  p.push(support('stretcher','担架队','stretcher',120,base.x,base.y,0.6));
  p.push(support('supply','支前民工队','supply',sc.labor,base.x,base.y,0.35));
  p.push(support('pol','师政治工作队','political',90,base.x,base.y,0.7));
  return p;
}

const VW = 800, VH = 480, SUB = 3;           // 世界坐标与每格 3×3 子格
const SUB_DIRS = ['西北','北','东北','西','中','东','西南','南','东南'];

/* 连续投影：真实经纬度 → 世界像素坐标（与格网、单位位置同一坐标基准） */
function geoXY(g, lon, lat){
  const b=g.bbox;
  const gx=clamp((lon-b.lon0)/(b.lon1-b.lon0)*(W-1),0,W-1);
  const gy=clamp((b.lat1-lat)/(b.lat1-b.lat0)*(H-1),0,H-1);
  return {x:(gx+0.5)*CW, y:(gy+0.5)*CH, gx, gy};
}
/* 定位到整数格与 3×3 子格；整数格沿用 proj，保证与地形/地名列表一致 */
function locateGeo(g, lon, lat){
  const c=proj(g,lon,lat), q=geoXY(g,lon,lat);
  const sx=clamp(Math.round((q.x-(c.x+0.5)*CW)/(CW/SUB)+1),0,SUB-1);
  const sy=clamp(Math.round((q.y-(c.y+0.5)*CH)/(CH/SUB)+1),0,SUB-1);
  return {x:c.x,y:c.y,sx,sy,wx:q.x,wy:q.y};
}
function planePath2(g, pts){

/* v1.4 命令热键：需目标的进入待指定模式，原地命令直接下达 */
function cmdHotkey(k){
  if(!S||S.over) return;
  const c=CMDS[k]; if(!c) return;
  if(c.night&&!S.night){ log('夜袭只能在夜间下达。','warn'); renderAll(); return; }
  if(!c.need){ issueOrder(k,curComm(),null); return; }
  S.pending={type:k}; renderAll();
}
function setupKeys(){
  if(typeof document==='undefined') return;
  document.onkeydown=(ev)=>{
    if(!S) return;
    /* v1.4.1 系统快捷键（Ctrl+A / Ctrl+C / Cmd+A 等）一律交还浏览器，
       否则「全选」会同时触发 A=进攻，且阻止默认行为。 */
    if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
    const tag=((ev.target&&ev.target.tagName)||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea') return;
    const k=ev.key||'';
    if(k==='Escape') cancelAllPending();
    else if(k>='1'&&k<='4') zoomSet(+k-1);
    else if(k==='+'||k==='=') zoomBy(1);
    else if(k==='-'||k==='_') zoomBy(-1);
    else if(k==='f'||k==='F') focusSelected();
    else if(k==='e'||k==='E') focusEnemy();
    else if(k==='c'||k==='C') focusContact();
    else if(k==='l'||k==='L') fxLive();
    else if(k==='[') fxStep(-1);
    else if(k===']') fxStep(1);
    else if(k==='0') resetView();
    /* RTS 式命令热键；F 保留给 Focus */
    else if(k==='a'||k==='A') cmdHotkey('attack');
    else if(k==='m'||k==='M') cmdHotkey('move');
    else if(k==='i'||k==='I') cmdHotkey('infiltrate');
    else if(k==='r'||k==='R') cmdHotkey('recon');
    else if(k==='t'||k==='T') cmdHotkey('trench');
    else if(k==='h'||k==='H') cmdHotkey('defend');
    else if(k==='s'||k==='S') cmdHotkey('wait');
    else return;
    if(ev.preventDefault) ev.preventDefault();
  };
}
function layerOn(k){
  if(!S || !S.layers) return true;
  const o=S.layers.overrides[k];
  return o===undefined ? !!LOD[k][S.view.z] : !!o;
}
function toggleLayer(k){
  S.layers.preset=null;
  S.layers.overrides[k]=!layerOn(k);
  renderAll();
}
function resetLayers(){ S.layers.overrides={}; S.layers.preset=null; renderAll(); }

/* 视口：单一世界坐标 + viewBox 缩放，不会造成坐标错乱 */
function visibleBox(){
  const k=ZOOMS[S.view.z].k, w0=VW/k, h0=VH/k;
  let w=w0, h=h0;
  /* 手机 / 平板容器比例与 800:480 不同时，保持视口面积不变重算宽高，
     避免 preserveAspectRatio=none 把地图拉伸变形；桌面比例下结果不变 */
  const m=document.getElementById('map');
  const r=(m&&m.getBoundingClientRect)?m.getBoundingClientRect():null;
  if(r&&r.width>0&&r.height>0){
    const ar=r.width/r.height;
    if(Math.abs(ar-VW/VH)>0.06){
      const area=w0*h0;
      h=Math.sqrt(area/ar); w=area/h;
    }
  }
  return {x:clamp(S.view.cx-w/2,0,Math.max(0,VW-w)),
          y:clamp(S.view.cy-h/2,0,Math.max(0,VH-h)), w, h, k};
}
function viewBoxStr(){
  const b=visibleBox();
  if(b.k===1 && Math.abs(b.w-800)<0.1 && Math.abs(b.h-480)<0.1) return '0 0 800 480';
  return [b.x,b.y,b.w,b.h].map(v=>v.toFixed(1)).join(' ');
}
function visibleCells(){
  const b=visibleBox();
  return {b,
    ax:clamp(Math.floor(b.x/CW),0,W-1), bx:clamp(Math.ceil((b.x+b.w)/CW),0,W),
    ay:clamp(Math.floor(b.y/CH),0,H-1), by:clamp(Math.ceil((b.y+b.h)/CH),0,H)};
}
function zoomSet(z,cx,cy){
  const old=S.view.z;
  S.view.z=clamp(z,0,ZOOMS.length-1);
  /* 放大时自动聚焦所选单位，避免落到无信息的空白地幅 */
  if(cx===undefined && S.view.z>old){
    const u=byId(S.selected);
    if(u){ cx=(u.x+0.5)*CW; cy=(u.y+0.5)*CH; }
    else { const e=S.enemies.find(v=>v.alive&&v.active);
           if(e){ cx=(e.x+0.5)*CW; cy=(e.y+0.5)*CH; } }
  }
  if(cx!==undefined){ S.view.cx=cx; S.view.cy=cy; }
  const b=visibleBox();
  S.view.cx=clamp(S.view.cx,b.w/2,VW-b.w/2);
  S.view.cy=clamp(S.view.cy,b.h/2,VH-b.h/2);
  renderAll();
}
function zoomBy(d,wx,wy){
  const z=clamp(S.view.z+d,0,ZOOMS.length-1);
  /* 滚轮缩放以鼠标位置为中心；按钮 / 层级按钮不传中心，交给 zoomSet 自动聚焦部队 */
  if(wx===undefined) zoomSet(z); else zoomSet(z,wx,wy);
}
function panBy(dx,dy){
  const b=visibleBox();
  S.view.cx=clamp(S.view.cx+dx,b.w/2,VW-b.w/2);
  S.view.cy=clamp(S.view.cy+dy,b.h/2,VH-b.h/2);
  renderAll();
}
function focusCell(x,y){ S.view.cx=(x+0.5)*CW; S.view.cy=(y+0.5)*CH; renderAll(); }
/* v1.3 点击「地名」面板的分级条目 → 定位到该要素并展示其史料依据 */
function focusCarto(lv,idx){

  if(!o) return;

                src:o.src,exact:!!o.exact,lv:o.lv,lon:o.lon,lat:o.lat};

function focusSelected(){

/* 由屏幕像素换算到世界坐标（无 DOM 环境时退化为恒定换算） */
function screenToWorld(ev){
  const m=document.getElementById('map');
  const b=visibleBox();
  const r=(m&&m.getBoundingClientRect)?m.getBoundingClientRect():{left:0,top:0,width:VW,height:VH};
  return {x:b.x+(ev.clientX-r.left)/Math.max(1,r.width)*b.w,
          y:b.y+(ev.clientY-r.top)/Math.max(1,r.height)*b.h};
}

/* ---------- 战术子格与要点 ---------- */
function subWorld(x,y,sx,sy){ return {cx:(x+(sx+0.5)/SUB)*CW, cy:(y+(sy+0.5)/SUB)*CH}; }
function elevAtGrid(gkey, fx, fy){
  const A=ELEVATION.areas[gkey], g=A.grid, R=g.length, C=g[0].length;
  const gx=clamp((fx/W)*(C-1),0,C-1), gy=clamp((fy/H)*(R-1),0,R-1);
  const i=clamp(Math.floor(gx),0,C-2), j=clamp(Math.floor(gy),0,R-2);
  const tx=gx-i, ty=gy-j;
  return (g[j][i]*(1-tx)+g[j][i+1]*tx)*(1-ty)+(g[j+1][i]*(1-tx)+g[j+1][i+1]*tx)*ty;
}
function subFeature(gkey,x,y,sx,sy){
  for(const o of featureCells(gkey)){
    if(o.x===x&&o.y===y&&o.sx===sx&&o.sy===sy){
      const f=o.f, K=FEATURE_KIND[f.k];
      return {n:f.n,k:f.k,eff:K.eff,src:f.src,approx:!!f.approx||o.shifted,explicit:true,
              dir:SUB_DIRS[sy*SUB+sx],elev:Math.round(elevAtGrid(gkey,x+(sx+0.5)/SUB,y+(sy+0.5)/SUB))};
    }
  }
  const t=terrainAt(x,y);
  const e=elevAtGrid(gkey,x+(sx+0.5)/SUB,y+(sy+0.5)/SUB);
  const dh=e-elevAtGrid(gkey,x+0.5,y+0.5);
  const mid=(sx===1&&sy===1), edge=(sx===0||sx===2||sy===0||sy===2);
  let k;
  if(t==='~')      k = edge&&dh<-3 ? 'ford' : 'water';
  else if(t==='r') k = mid ? 'bridge' : 'defile';
  else if(t==='=') k = mid ? 'defile' : 'flat';
  else if(t==='f') k = mid ? 'wood' : (dh>10?'peak':'flat');
  else if(t==='v') k = mid ? 'hq' : 'village';
  else if(t==='m'||t==='h') k = dh>8 ? 'peak' : (edge?'defile':'wood');
  else if(t==='s') k = 'water';
  else k = dh>12 ? 'peak' : dh<-12 ? 'flat' : 'flat';
  const K=FEATURE_KIND[k];
  return {n:K.n+'（'+SUB_DIRS[sy*SUB+sx]+'）',k,eff:K.eff,explicit:false,
          src:'由 ASTER GDEM 真实高程场（相对高差 '+Math.round(dh)+' m）与该格真实地形 / 交通线派生',
          dir:SUB_DIRS[sy*SUB+sx],elev:Math.round(e),dh:Math.round(dh)};
}
function featureTip(x,y,sx,sy){
  const f=subFeature(S.sc.geo,x,y,sx,sy), K=FEATURE_KIND[f.k], T=TERRAIN[terrainAt(x,y)]||TERRAIN['.'];
  let s='格 ('+x+','+y+') · '+f.dir+'子格 · '+f.n+'\n高程约 '+f.elev+' m · 地形 '+T.n;
  s+='\n效应 防御 '+(f.eff.def>=0?'+':'')+Math.round(f.eff.def*100)+'% / 攻击 '+
     (f.eff.att>=0?'+':'')+Math.round(f.eff.att*100)+'% / 观察 '+Math.round(f.eff.obs*100)+
     ' / 机动 '+(f.eff.mv>=0?'+':'')+Math.round(f.eff.mv*100)+'%';
  if(f.explicit) s+='\n史实要点：'+f.src+(f.approx?'（边界为符号化示意）':'');
  else s+='\n派生依据：'+f.src;
  const d=deploymentAt(x,y,sx,sy);
  if(d) s+='\n驻守：'+d.name+' '+d.men+'人'+(d.level==='battalion'?' · '+BTASKS[d.task].n:'');
  const sub=subAt(x,y,sx,sy);
  if(sub) s+='\n本级阵地：'+POS_Z[clamp(S.view.z,1,3)]+' · 工事 '+(sub.entrench||0)+' 级';
  return s;
}

/* ============================================================
   v0.6 · 阵位调整（v0.5 "部署"机制的实体化升级）
   默认阵位已在 initSubPlacement 铺开，玩家调整的是"哪个单位占哪个要点"。
   ============================================================ */
function subLabel(subId){
  const s=subById(subId);
  return s?{name:s.name,regId:s.reg,sub:s}:null;
}
function deploymentAt(x,y,sx,sy){
  let best=null;
  for(const id in S.subs){ const s=S.subs[id];
    if(!s.alive||!s.placed||s.level==='squad') continue;
    const p=s.placed;
    if(p.x===x&&p.y===y&&p.sx===sx&&p.sy===sy && (!best||s.level==='battalion')) best=s;
  }
  return best;
}
function beginDeploy(subId){
  if(!subById(subId)) return;
  S.deployTarget=subId;
  if(S.view.z===0) zoomSet(1);
  renderAll();
}
function cancelDeploy(){ S.deployTarget=null; renderAll(); }
function deployHere(){
  if(!S.deployTarget||!S.inspect) return;
  const i=S.inspect, sel=document.getElementById('tactask');
  deploySubAt(S.deployTarget,i.x,i.y,i.sx,i.sy,sel?sel.value:'hold');
}
function undeploySub(subId){
  const s=subById(subId); if(!s||!s.home) return;
  s.placed=Object.assign({},s.home);
  s.repositioned=false;
  log('【阵位调整】'+s.name+' 回归团建制内默认阵位。','');
  renderAll();
}
function deploySubAt(subId,x,y,sx,sy,task){
  if(S.over) return false;
  const sub=subById(subId); if(!sub||!sub.alive) return false;
  const reg=byId(sub.reg);
  if(reg && dist(reg,{x,y})>1){ log('阵位调整只能在本团所在格及相邻格内。','warn'); return false; }
  const used=S.tacticalMoves[sub.reg]||0;
  if(used>=3 && !sub.repositioned){ log('本时段该团阵位调整已达 3 处上限。','warn'); return false; }
  if(sub.level==='battalion'){
    for(const id in S.subs){ const o=S.subs[id];
      if(o.id===subId||o.level!=='battalion'||!o.alive||!o.placed) continue;
      const p=o.placed;
      if(p.x===x&&p.y===y&&p.sx===sx&&p.sy===sy){
        log('该子格已由 '+o.name+' 占领，请选择其它要点。','warn'); return false;
      }
    }
  }
  const i=S.inspect;
  const p={x,y,sx,sy};
  if(sub.level!=='battalion'){
    p.mx=clamp(i&&i.mx!==undefined?i.mx:1,0,2);
    p.my=clamp(i&&i.my!==undefined?i.my:1,0,2);
  }
  const f=subFeature(S.sc.geo,x,y,sx,sy), K=FEATURE_KIND[f.k];
  sub.placed=p; sub.repositioned=true;
  if(sub.level==='battalion' && BTASKS[task]) sub.task=task;
  if(sub.level==='squad' && SQUAD_ROLES[task]) sub.role=task;
  /* 营移动时其所属连、班保持相对阵形 */
  const follow=(parent,ox,oy,osx,osy,dx,dy)=>{
    for(const c of subsOf(parent.id)){
      if(!c.placed) continue;
      c.placed.x=clamp(c.placed.x+dx,0,W-1);
      c.placed.y=clamp(c.placed.y+dy,0,H-1);
      c.placed.sx=sx; c.placed.sy=sy;
      follow(c,0,0,0,0,0,0);
    }
  };
  if(sub.level==='battalion'){
    const old=sub.home||p;
    const dx=x-old.x, dy=y-old.y;
    for(const c of sub.comps){
      if(!c.placed) continue;
      c.placed.x=clamp(c.placed.x+dx,0,W-1);
      c.placed.y=clamp(c.placed.y+dy,0,H-1);
      c.placed.sx=sx; c.placed.sy=sy;
      for(const s of c.squads){ if(!s.placed) continue;
        s.placed.x=clamp(s.placed.x+dx,0,W-1);
        s.placed.y=clamp(s.placed.y+dy,0,H-1);
        s.placed.sx=sx; s.placed.sy=sy; }
    }
  }
  S.tacticalMoves[sub.reg]=used+1;
  S.stats.tactical=(S.stats.tactical||0)+1;
  if(task==='scout' && S.intel<3){ S.intel++; S.stats.recon++; }
  S.deployTarget=null;
  log('【阵位调整】'+sub.name+' 进占 ('+x+','+y+')'+f.dir+'子格「'+f.n+'」'+
      (sub.level==='battalion'?'，任务改为'+BTASKS[sub.task].n:'')+
      '；防御 '+(K.eff.def>=0?'+':'')+Math.round(K.eff.def*100)+'%、攻击 '+
      (K.eff.att>=0?'+':'')+Math.round(K.eff.att*100)+'%。','good');
  if(f.explicit) log('【要点史料】'+f.src,'');
  renderAll();
  return true;
}

/* 要点落格：同一子格冲突时按曼哈顿距离分配到最近空子格，保证"图标=可点子格" */
function featureCells(gkey){
  if(S && S._fc && S._fc.gkey===gkey) return S._fc.list;
  const used=new Set(), list=[];
  (FEATURES[gkey]||[]).forEach(f=>{
    const L=locateGeo(GEO[gkey],f.lon,f.lat);
    const cells=[];
    for(let sy=0;sy<SUB;sy++) for(let sx=0;sx<SUB;sx++)
      cells.push({sx,sy,d:Math.abs(sx-L.sx)+Math.abs(sy-L.sy)});
    cells.sort((a,b)=>a.d-b.d);
    let pick=cells[0];
    for(const c of cells){
      const k=L.x+','+L.y+','+c.sx+','+c.sy;
      if(!used.has(k)){ used.add(k); pick=c; break; }
    }
    list.push({f,x:L.x,y:L.y,sx:pick.sx,sy:pick.sy,
               shifted:pick.sx!==L.sx||pick.sy!==L.sy});
  });
  if(S) S._fc={gkey,list};
  return list;
}

   v0.6 · 下级单位实体、兵力守恒、命令链与战绩结算

/* ---------- 兵力账目：严格守恒 ---------- */
function splitMen(total,n){
  const base=Math.floor(total/n), rem=total-base*n;
  return Array.from({length:n},(_,i)=>base+(i<rem?1:0));
}
function apportion(items,total,weightFn){
  const w=items.map(weightFn), sum=w.reduce((a,b)=>a+b,0)||1;
  const raw=w.map(v=>total*v/sum), parts=raw.map(Math.floor);
  let rem=total-parts.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f);
  for(let k=0;k<rem&&order.length;k++) parts[order[k%order.length].i]++;
  return parts;
}
function childList(n){
  if(n.level==='regiment') return n.subs||[];
  if(n.level==='battalion') return n.comps||[];
  if(n.level==='company') return n.squads||[];
  return [];
}
function lossWeight(k){
  const m=Math.max(1,k.men);
  if(k.level==='battalion') return m*Math.max(0.18,BTASKS[k.task].commit+0.18);
  return m;
}
/* 逐级分摊伤亡；每层子单位扣减之和恰等于上级扣减额 */
function applyLoss(node,loss){
  const actual=Math.min(Math.max(0,loss),node.men);
  node.men-=actual;
  const kids=childList(node).filter(k=>k.men>0);
  if(kids.length){
    const pool=Math.min(actual,kids.reduce((a,k)=>a+k.men,0));
    const parts=apportion(kids,pool,lossWeight);
    kids.forEach((k,i)=>{
      applyLoss(k,Math.min(k.men,parts[i]));
      if(k.men<=0) k.alive=false;
    });
  }
  if(node.men<=0) node.alive=false;
}
/* 逐级回补（即俘即补 / 休整），同样守恒 */
function applyReplenish(node,add){
  const actual=Math.min(Math.max(0,add),node.men0-node.men);
  node.men+=actual;
  const kids=childList(node).filter(k=>k.men<k.men0);
  if(kids.length){
    const parts=apportion(kids,actual,k=>k.men0-k.men);
    kids.forEach((k,i)=>applyReplenish(k,Math.min(k.men0-k.men,parts[i])));
  }
}
function subBookOK(reg){
  let sum=reg.subs.reduce((a,b)=>a+b.men,0);
  if(sum!==reg.men) return false;
  for(const b of reg.subs){
    if(b.comps.reduce((a,c)=>a+c.men,0)!==b.men) return false;
    for(const c of b.comps) if(c.squads.reduce((a,s)=>a+s.men,0)!==c.men) return false;
  }
  return true;
}

/* ---------- 实体索引与位置 ---------- */
function indexSubs(reg,table){
  for(const b of reg.subs){ table[b.id]=b;
    for(const c of b.comps){ table[c.id]=c;
      for(const s of c.squads) table[s.id]=s; } }
}
function subById(id){ return S&&S.subs?S.subs[id]:null; }
function subsOf(id){ return Object.values(S.subs||{}).filter(s=>s.parent===id); }
function battalionsOf(regId){ return subsOf(regId).filter(s=>s.level==='battalion'); }
function parentOf(sub){ return subById(sub.parent)||byId(sub.parent); }
function microWorld(x,y,sx,sy,mx,my){
  return {cx:(x+(sx+(mx+0.5)/SUB)/SUB)*CW, cy:(y+(sy+(my+0.5)/SUB)/SUB)*CH};
}
function subPos(sub){
  if(!sub||!sub.placed) return null;
  const p=sub.placed;
  if(p.mx!==undefined) return microWorld(p.x,p.y,p.sx,p.sy,p.mx,p.my);
  return subWorld(p.x,p.y,p.sx,p.sy);
}
/* 默认阵位：一进入团级 / 营连级视图，营、连、班即已在地图上 */
function initSubPlacement(){
  for(const r of S.pieces.filter(p=>p.kind==='regiment')){
    r.subAnchor={x:r.x,y:r.y};
    r.subs.forEach((b,bi)=>{
      const f=B_FORM[bi%3];
      b.placed={x:r.x,y:r.y,sx:f.sx,sy:f.sy};
      b.comps.forEach((c,ci)=>{
        const cf=C_FORM[ci%3];
        c.placed={x:r.x,y:r.y,sx:f.sx,sy:f.sy,mx:cf.mx,my:cf.my};
        c.squads.forEach((s,si)=>{
          const sf=S_FORM[si%3];
          s.placed={x:r.x,y:r.y,sx:f.sx,sy:f.sy,mx:cf.mx,my:cf.my,dx:sf.dx,dy:sf.dy};
        });
      });
    });
  }
}
/* 团机动时保持阵形：按团位移平移所属全部阵位，手动调整的偏移得以保留 */
function syncSubPositions(){
  for(const r of S.pieces.filter(p=>p.kind==='regiment')){
    const a=r.subAnchor||{x:r.x,y:r.y}, dx=r.x-a.x, dy=r.y-a.y;
    if(dx||dy){
      for(const id in S.subs){ const s=S.subs[id];
        if(s.reg===r.id&&s.placed){
          s.placed.x=clamp(s.placed.x+dx,0,W-1);
          s.placed.y=clamp(s.placed.y+dy,0,H-1);
        }
      }
    }
    r.subAnchor={x:r.x,y:r.y};
  }
}

/* ---------- 下级命令：按层级产生作业量与传达延迟 ---------- */
function subCmdName(sub,type){
  if(sub.level==='battalion') return BTASKS[type]?BTASKS[type].n:type;
  if(sub.level==='company') return CACTS[type]?CACTS[type].n:type;
  return SQUAD_ROLES[type]?SQUAD_ROLES[type].n:type;
}
function subCmdShort(sub,type){
  return sub.level==='company' && CACTS[type] && CACTS[type].short;
}
function issueSubOrder(type,comm,target){
  if(S.over) return false;
  const sub=subById(S.treeSel);
  if(!sub||!sub.alive){ log('请先在编制树中选中一个营、连或班。','warn'); return false; }
  const L=SUB_LEVEL[sub.level]; if(!L) return false;
  const table = sub.level==='battalion'?BTASKS:sub.level==='company'?CACTS:SQUAD_ROLES;
  if(!table[type]){ log('该级单位不能执行此命令。','warn'); return false; }
  if(type==='nightraid' && !S.night){ log('夜袭只能在夜间时段下达。','warn'); return false; }
  if(comm==='bugle' && !subCmdShort(sub,type)){ log('司号只能传达简短命令（停止 / 待命）。','warn'); return false; }
  if(S.points<L.cost){ log('师部参谋作业量不足：越级指挥到'+L.n+'需 '+L.cost+' 点。','warn'); return false; }
  const extra=(comm==='radio'&&!subCmdShort(sub,type))?1:0;
  const delay=COMM[comm].delay+L.delay+extra;
  S.points-=L.cost;
  S.cmdKinds.add(type); S.stats.variety=S.cmdKinds.size;
  S.subOrders.push({id:'so'+S.turn+'_'+S.subOrders.length, subId:sub.id, sub:sub.name,
    level:sub.level, type, comm, target, arrive:S.turn+delay, status:'pending'});
  S.decisions.push({turn:S.turn,unit:sub.name,cmd:subCmdName(sub,type),target:target?('('+target.x+','+target.y+')'):'当面之敌'});
  log('【逐级下达】向 '+sub.name+' 下达「'+subCmdName(sub,type)+'」，经'+COMM[comm].n+
      '按师—团—营—连逐级传达，预计第 '+(S.turn+delay)+' 时段生效。','order');
  deliverSubOrders();
  renderAll();
  return true;
}
function deliverSubOrders(){
  for(const o of S.subOrders){
    if(o.status!=='pending'||o.arrive>S.turn) continue;
    let rel=COMM[o.comm].rel;
    if(o.comm==='phone') rel+=S.lineBonus;
    if(rnd()>rel){ o.status='failed';
      log('【传达中断】致 '+o.sub+' 的「'+subCmdName(subById(o.subId)||{level:o.level},o.type)+
          '」未能送达，该部仍执行原命令。','warn'); continue; }
    const s=subById(o.subId);
    if(!s||!s.alive){ o.status='lost'; continue; }
    o.status='done';
    if(o.level==='battalion') s.task=o.type;
    else { s.order={type:o.type,target:o.target}; s.lastAct=o.type; }
    log('【生效】'+s.name+'：'+subCmdName(s,o.type)+(o.target?' → ('+o.target.x+','+o.target.y+')':''),'order');
  }
}
function nearestEnemyTo(x,y){
  let best=null,bd=99;
  for(const e of S.enemies){ if(!e.alive||!e.active) continue;
    const d=Math.max(Math.abs(e.x-x),Math.abs(e.y-y)); if(d<bd){bd=d;best=e;} }
  return best;
}
/* 战术阶段：连 / 班的一次性动作在本时段结算 */
function subPhase(){
  for(const id in S.subs){
    const s=S.subs[id];
    if(!s.alive) continue;
    if(s.level==='battalion'){
      s.fatigue=clamp(s.fatigue+2,0,100);
      s.ammo=clamp(s.ammo-3,0,100);
      continue;
    }
    const a=s.order&&s.order.type;
    if(!a) continue;
    const b=parentOf(s); if(!b) continue;
    const t=s.order.target||{x:b.placed?b.placed.x:0,y:b.placed?b.placed.y:0};
    switch(a){
      case 'trench': b.trench=Math.min(3,(b.trench||0)+1); S.stats.trench++;
        log('【近迫作业】'+s.name+' 交通壕推进至 '+b.trench+' 级，冲击距离缩短。','good'); break;
      case 'sapper': { const e=nearestEnemyTo(t.x,t.y);
        if(e&&dist(e,t)<=2){ e.entrench=Math.max(0,e.entrench-1);
          log('【尖刀爆破】'+s.name+' 爆破当面敌工事，工事降至 '+e.entrench+' 级。','good'); }
        break; }
      case 'fire': b.fireReady=Math.min(2,(b.fireReady||0)+1);
        log('【火力掩护】'+s.name+' 组织伴随火力，'+b.name+' 下时段突击增强。','good'); break;
      case 'entrench': b.entrench=Math.min(3,(b.entrench||0)+1);
        log('【构筑工事】'+b.name+' 工事升至 '+b.entrench+' 级。','good'); break;
      case 'recon': S.intel=Math.min(3,S.intel+1); S.stats.recon++;
        log('【侦察】'+s.name+' 查明当面敌情，敌情升至 '+['','不明','概略','确实'][S.intel]+'。','good');
        intelGain('recon',t.x,t.y,3); break;
      case 'persuade': { const e=nearestEnemyTo(t.x,t.y);
        if(e){ e.morale=clamp(e.morale-5,0,100); S.stats.persuade++;
          log('【政治攻势】'+s.name+' 对 '+e.name+' 喊话瓦解，敌士气下降。','good'); }
        break; }
      case 'political': b.morale=clamp(b.morale+6,0,100); S.stats.political++;
        log('【政治工作】'+s.name+' 开展立功运动 / 诉苦三查，'+b.name+' 士气回升。','good'); break;
      case 'line': S.lineBonus=Math.min(0.25,S.lineBonus+0.05);
        log('【架线】'+s.name+' 抢修有线电话，命令可靠性提升。','good'); break;
      case 'rest': b.fatigue=clamp(b.fatigue-15,0,100); b.ammo=clamp(b.ammo+12,0,100);
        b.morale=clamp(b.morale+4,0,100); S.stats.rest++;
        log('【休整】'+b.name+' 利用间隙整训，疲劳下降、弹药与士气回升。','good'); break;
      case 'ambush': b.ambush=true; log('【设伏】'+s.name+' 于 '+SUB_DIRS[(t.sx||0)*SUB+(t.sy||0)]+' 方向设伏。','good'); break;
      case 'attack': case 'nightraid': b.assault=true;
        log('【突击准备】'+s.name+' 编入 '+b.name+' 突击队。','good'); break;
      case 'recon_group': case 'sapper_group': case 'fire_group': case 'line_group': case 'persuade_group':
        break;
      default: break;
    }
    if(a && a!=='hold' && s.placed) fxPush('subact',s.placed.x,s.placed.y,
      {act:a,sx:s.placed.sx,sy:s.placed.sy,name:s.name});
    s.order={type:'hold'};
  }
}
/* 战术修正：把营的任务编成、要点效应、连的战术动作汇总成攻防系数 */
function subTacticalMod(units){
  let att=1, def=1, n=0, note=[];
  for(const r of units){
    if(r.kind!=='regiment') continue;
    const bs=battalionsOf(r.id).filter(b=>b.alive);
    if(!bs.length) continue;
    const committed=bs.filter(b=>BTASKS[b.task].commit>0);
    const main=bs.filter(b=>b.task==='main');
    const mainMen=main.reduce((a,b)=>a+b.men*BTASKS[b.task].commit,0);
    const totalMen=committed.reduce((a,b)=>a+b.men*BTASKS[b.task].commit,0)||1;
    const conc=mainMen/totalMen;
    if(main.length>=2 && conc>=0.55){ att*=1.12; note.push(r.name+'集中 '+main.length+' 个营主攻'); }
    else if(!main.length){ att*=0.94; note.push(r.name+'未指定主攻、兵力平分'); }
    if(bs.some(b=>BTASKS[b.task].pin)){ def*=1.05; note.push('以一部牵制敌其余各部'); }
    if(bs.some(b=>BTASKS[b.task].reserve)){ def*=1.06; note.push('掌握预备队'); }
    if(bs.some(b=>b.task==='defend')){ def*=1.10; }
    if(bs.some(b=>b.task==='block')){ att*=1.04; }
    for(const b of bs){
      if(b.entrench) def*=1+0.05*Math.min(3,b.entrench);
      if(b.fireReady) att*=1+0.04*b.fireReady;
      if(b.assault) att*=1.03;
      if(b.ambush) att*=1.02;
      if(b.trench) att*=1+0.05*Math.min(3,b.trench);
      if(b.placed){
        const f=subFeature(S.sc.geo,b.placed.x,b.placed.y,b.placed.sx,b.placed.sy);
        att*=1+clamp(f.eff.att,-0.10,0.16);
        def*=1+clamp(f.eff.def,-0.10,0.16);
        n++;
      }
    }
  }
  return {att:clamp(att,0.85,1.45), def:clamp(def,0.85,1.45), n, note:note.join('；')};
}
function tacticalFactor(units,mode){
  const m=subTacticalMod(units);
  return {f:mode==='def'?m.def:m.att, n:m.n, note:m.note};
}
/* 一次性战术动作只在结算中生效一次 */
function clearSubActionFlags(units){
  for(const r of units){ if(r.kind!=='regiment') continue;
    for(const b of battalionsOf(r.id)){ b.fireReady=0; b.assault=false; b.ambush=false; }
  }
}
/* 牵制 / 阻援营降低当面敌突围漏网概率 */
function subPinFactor(units){
  let k=1;
  for(const r of units){ if(r.kind!=='regiment') continue;
    for(const b of battalionsOf(r.id))
      if(b.alive&&(BTASKS[b.task].pin||BTASKS[b.task].block)) k*=0.6;
  }
  return Math.max(0.2,k);
}
function battalionOf(sub){
  let n=sub;
  while(n&&n.level!=='battalion') n=parentOf(n);
  return n&&n.level==='battalion'?n:null;
}

function findSub(id){
  for(const r of S.pieces.filter(p=>p.kind==='regiment')) for(const b of r.subs) for(const c of b.comps){
