function openCtxMenu(ev,d){
  const box=document.getElementById('ctxmenu'); if(!box) return;
  const u=byId(S.selected), sub=subById(S.treeSel);
  const ft=foeAtCell(d.x,d.y);
  const mine=S.pieces.some(p=>p.alive&&p.x===d.x&&p.y===d.y);
  const allow=k=>!!CMDS[k]&&CMDS[k].allow.indexOf(u.kind)>=0&&(!CMDS[k].night||S.night);
  let items=[];
  if(u&&u.alive){
    if(ft){
      if(allow('attack'))    items.push({k:'attack',n:'进攻该敌',h:'A'});
      if(allow('infiltrate'))items.push({k:'infiltrate',n:'穿插分割',h:'I'});
      if(allow('feint'))     items.push({k:'feint',n:'佯动牵制',h:'F'});
      if(allow('trench'))    items.push({k:'trench',n:'近迫作业',h:'T'});
      if(allow('artillery')) items.push({k:'artillery',n:'炮火准备',h:'G'});
    }else{
      if(allow('move'))    items.push({k:'move',n:'机动到此',h:'M'});
      if(allow('recon'))   items.push({k:'recon',n:'侦察此方',h:'R'});
      if(allow('defend'))  items.push({k:'defend',n:'就地构筑工事',h:'H'});
      if(allow('wait'))    items.push({k:'wait',n:'停止待命',h:'S'});
    }
  }else if(sub&&sub.alive){
    const table=sub.level==='battalion'?BTASKS:sub.level==='company'?CACTS:SQUAD_ROLES;
    const keys=sub.level==='battalion'?['main','support','pin','reserve','defend','block']:
               sub.level==='company'?['attack','trench','entrench','recon','ambush','fire']:
               ['recon','sapper','fire','line','persuade'];
    items=keys.filter(k=>table[k]).map(k=>({k,n:table[k].n||k,h:'',sub:true}));
  }
  const head=ft?(ft.lvl>=3?ft.e.name:'已侦知敌情')+' ('+d.x+','+d.y+')':
              mine?'我方阵位 ('+d.x+','+d.y+')':'地形 ('+d.x+','+d.y+')';
  let h='<div class="mhead">'+esc(head)+'</div>';
  if(!items.length) h+='<button disabled>无可下达命令 · 先在编制树选单位</button>';
  items.forEach(it=>{
    h+='<button data-k="'+esc(it.k)+'"'+(it.sub?' data-sub="1"':'')+'>'+
       '<span>'+esc(it.n)+'</span><span class="k">'+esc(it.h||'')+'</span></button>';
  });
  h+='<div class="sep"></div><button data-k="__info"><span>查看地形 / 敌情情报</span><span class="k">I</span></button>'+
     '<button data-k="__cancel"><span>取消</span><span class="k">Esc</span></button>';
  box.innerHTML=h; box.className='ctxmenu on';
  const frame=box.parentElement;
  const fr=(frame&&frame.getBoundingClientRect)?frame.getBoundingClientRect():
           {left:0,top:0,width:VW,height:480};
  const px=clamp((ev.clientX||0)-(fr.left||0),4,Math.max(4,(fr.width||800)-230));
  const py=clamp((ev.clientY||0)-(fr.top||0),4,Math.max(4,(fr.height||480)-280));
  if(box.style){ box.style.left=px+'px'; box.style.top=py+'px'; }
  box.onclick=(e2)=>{
    const b=e2.target&&e2.target.closest?e2.target.closest('button'):null;
    if(!b||b.disabled) return;
    const k=b.getAttribute('data-k');
    closeCtxMenu();
    if(k==='__cancel') return;
    if(k==='__info'){ S.inspect={x:d.x,y:d.y,sub:false}; onCell(d.x,d.y); renderAll(); return; }
    if(b.getAttribute('data-sub')){ S.subPending=k; renderAll(); return; }
    quickOrder(k,d.x,d.y,ev.shiftKey?'phone':curComm());
  };
}

function bindMapEvents(m){
  m.onclick=(ev)=>{
    if(S._dragMoved){ S._dragMoved=false; return; }
    if(S._suppressClick){ S._suppressClick=false; return; }
    /* v1.4 小地图点击跳转（热区带 data-mini，覆盖在格热区上层） */
    const mp=miniMapAt(ev.clientX||0,ev.clientY||0,m);
    if(mp){ S.view.cx=mp.x; S.view.cy=mp.y; renderAll(); return; }
    let d=null;
    if(isMobileLayout()) d=pickCellAt(ev.clientX||0,ev.clientY||0,m);
    else {
      const c=ev.target&&ev.target.closest?ev.target.closest('[data-x]'):null;
      if(!c) return;
      d={x:+c.getAttribute('data-x'),y:+c.getAttribute('data-y')};
      const sxs=c.getAttribute('data-sx'), sys=c.getAttribute('data-sy');
      const mxs=c.getAttribute('data-mx'), mys=c.getAttribute('data-my');
      if(sxs!==null&&sys!==null){ d.sx=+sxs; d.sy=+sys; }
      if(mxs!==null&&mys!==null){ d.mx=+mxs; d.my=+mys; }
    }
    if(d) handleMapPick(d);
  };
  m.onpointerdown=(ev)=>{
    if(ev.pointerType==='mouse' && ev.button!==undefined && ev.button!==0) return;
    /* v1.4.1 鼠标左键按下即阻断浏览器原生拖选；click / 手势仍照常触发 */
    if(ev.pointerType==='mouse'&&ev.preventDefault) ev.preventDefault();
    _ptrs.set(ev.pointerId,{x:ev.clientX||0,y:ev.clientY||0});
    if(_ptrs.size===1) S._drag={x:ev.clientX||0,y:ev.clientY||0,moved:false};
    else if(_ptrs.size===2){
      const a=[..._ptrs.values()];
      S._pinch={d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,last:1,
        mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
      S._drag=null;
    }
    if(m.setPointerCapture){ try{ m.setPointerCapture(ev.pointerId); }catch(e){} }
  };
  m.onpointermove=(ev)=>{
    if(!_ptrs.has(ev.pointerId)){
      /* v1.4 悬停预览：只更新 hoverfx 层，不做整图重绘 */
      if(!isMobileLayout()){
        S.hover=pickCellAt(ev.clientX||0,ev.clientY||0,m);
        const svg=m.querySelector?m.querySelector('svg'):null;
        const g=svg&&svg.querySelector?svg.querySelector('#hoverfx'):null;
        if(g&&g.innerHTML!==undefined) g.innerHTML=renderHoverFx(S.view.z,zoomU());
      }
      return;
    }
    _ptrs.set(ev.pointerId,{x:ev.clientX||0,y:ev.clientY||0});
    if(_ptrs.size>=2&&S._pinch){
      const a=[..._ptrs.values()].slice(0,2);
      S._pinch.last=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
      S._pinch.mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
      return;
    }
    if(_ptrs.size===1&&S._drag){
      const r=(m.getBoundingClientRect?m.getBoundingClientRect():{width:VW,height:VH});
      const b=visibleBox(), dx=(ev.clientX||0)-S._drag.x, dy=(ev.clientY||0)-S._drag.y;
      if(Math.abs(dx)+Math.abs(dy)>3) S._drag.moved=true;
      if(S._drag.moved){
        S.view.cx=clamp(S.view.cx-dx/Math.max(1,r.width||VW)*b.w,b.w/2,Math.max(b.w/2,VW-b.w/2));
        S.view.cy=clamp(S.view.cy-dy/Math.max(1,r.height||VH)*b.h,b.h/2,Math.max(b.h/2,VH-b.h/2));
        S._drag.x=ev.clientX||0; S._drag.y=ev.clientY||0;
        const svg=m.querySelector?m.querySelector('svg'):null;
        if(svg&&svg.setAttribute) svg.setAttribute('viewBox',viewBoxStr());
      }
    }
  };
  const endPointer=(ev)=>{
    const wasPinch=_ptrs.size>=2;
    _ptrs.delete(ev.pointerId);
    if(wasPinch&&S._pinch){
      const ratio=S._pinch.last/S._pinch.d0, mid=S._pinch.mid;
      _ptrs.clear(); S._pinch=null;
      const w=screenToWorld({clientX:mid.x,clientY:mid.y});
      if(ratio>1.25) zoomBy(1,w.x,w.y);
      else if(ratio<0.8) zoomBy(-1,w.x,w.y);
      S._dragMoved=true; S._suppressClick=true;
      return;
    }
    const x=ev.clientX||0, y=ev.clientY||0, now=Date.now();
    if(isMobileLayout()&&S._lastTap&&now-S._lastTap.t<320&&Math.hypot(x-S._lastTap.x,y-S._lastTap.y)<26){
      S._lastTap=null; S._dragMoved=true; S._suppressClick=true;
      const w=screenToWorld({clientX:x,clientY:y});
      zoomBy(1,w.x,w.y);
      return;
    }
    S._lastTap={t:now,x,y};
    endDrag();
  };
  m.onpointerup=endPointer;
  m.onpointercancel=endPointer;
  m.onpointerleave=()=>{ S.hover=null; if(_ptrs.size===0) endDrag(); };
  /* v1.4 右键上下文命令：目标由已知事实判定，未侦知敌只会得到「地形」菜单 */
  m.oncontextmenu=(ev)=>{
    if(ev.preventDefault) ev.preventDefault();
    if(S._dragMoved||S._suppressClick) return;
    let d=null;
    if(isMobileLayout()) d=pickCellAt(ev.clientX||0,ev.clientY||0,m);
    else {
      const c=ev.target&&ev.target.closest?ev.target.closest('[data-x]'):null;
      if(!c) return;
      d={x:+c.getAttribute('data-x'),y:+c.getAttribute('data-y')};
      const sxs=c.getAttribute('data-sx'),sys=c.getAttribute('data-sy');
      if(sxs!==null&&sys!==null){ d.sx=+sxs; d.sy=+sys; }
      const mxs=c.getAttribute('data-mx'),mys=c.getAttribute('data-my');
      if(mxs!==null&&mys!==null){ d.mx=+mxs; d.my=+mys; }
    }
    openCtxMenu(ev,d);
  };
  m.onwheel=(ev)=>{
    if(ev.preventDefault) ev.preventDefault();
    const w=(ev.clientX!==undefined)?screenToWorld(ev):{x:S.view.cx,y:S.view.cy};
    zoomBy((ev.deltaY||0)<0?1:-1,w.x,w.y);
  };
}

/* ============================================================
   v0.9 · 四组态势渲染：路线 / 战斗效果 / 战术态势 / 战略态势
   共用一套世界坐标；所有符号尺寸乘 u=1/k，屏幕大小恒定；
   每图层独立开关并按 LOD 自动分级，避免全要素同屏。
   ============================================================ */

function fxVisible(){ return visibleBox(); }
function fxInView(cx,cy,u,pad){
  const b=fxVisible(), p=(pad===undefined?40:pad)*u;
  return cx>=b.x-p && cx<=b.x+b.w+p && cy>=b.y-p && cy<=b.y+b.h+p;
}
function fxLabel(cx,cy,text,u,col,dy){
  const fs=(8.5)*u, w=String(text).length*fs*0.62+7*u;
  return '<rect x="'+(cx-w/2).toFixed(1)+'" y="'+(cy+dy*u-9*u).toFixed(1)+'" width="'+w.toFixed(1)+
    '" height="'+(12*u).toFixed(1)+'" rx="'+(2*u).toFixed(1)+'" fill="#0c1712" opacity=".86"/>'+
    '<text x="'+cx.toFixed(1)+'" y="'+(cy+dy*u).toFixed(1)+'" text-anchor="middle" font-size="'+
    fs.toFixed(2)+'" fill="'+col+'">'+esc(text)+'</text>';
}

/* A · 行军路线：我方计划路线 / 已执行轨迹 / 进攻轴线（敌方决心不渲染） */
function renderRoutes(z,u){
  const b=fxVisible();
  let s='<g pointer-events="none">';
  /* 1) 计划路线（我方待传达命令） */
  if(!fxIsReplay()){
    const plans=S.orders.filter(o=>o.status==='pending'&&o.target).map(o=>({o,un:byId(o.unitId)}))
      .concat(S.subOrders.filter(o=>o.status==='pending'&&o.target).map(o=>({o,un:subById(o.subId),sub:true})));
    for(const P of plans){
      const o=P.o, un=P.un;
      if(!un||un.alive===false||un.x===undefined) continue;
      const a=fxC(un.x,un.y), c=fxC(o.target.x,o.target.y);
      if(!fxInView((a.cx+c.cx)/2,(a.cy+c.cy)/2,u,50)) continue;
      /* v1.3 分级线宽：师级粗、团级标准、营 / 连级细，避免放大后路线压住阵地 */
      const rw=[1.9,1.5,1.2,1.0][z];
      s+=fxArrow(a.cx,a.cy,c.cx,c.cy,u,'#8fa79c',{w:rw,head:z>=2?4.5:6,dash:[3,3],op:.58,flow:true});
      if(z<=1) s+=fxLabel((a.cx+c.cx)/2,(a.cy+c.cy)/2,'第 '+o.arrive+' 时段',u,'#b9cdc2',-5);
      else if(P.sub) s+=fxLabel((a.cx+c.cx)/2,(a.cy+c.cy)/2,un.name,u,'#b9cdc2',-4);
    }
  }
  /* 2) 已执行轨迹：敌方轨迹只有"确实情报"时才可见（不泄露敌决心） */
  const T=fxTrails(), foeIds=new Set(S.enemies.map(e=>e.id));
  for(const id in T){
    const a=T[id]; if(a.length<2) continue;
    const un=byId(id), foe=foeIds.has(id);
    if(!un&&!foe) continue;
    if(un&&un.kind!=='regiment'&&!un.detached) continue;
    if(foe){
      const fe=S.enemies.find(x=>x.id===id);
      if(!fe||!foeExact(fe)) continue;       // 概略 / 迹象 / 未侦知：敌方行军轨迹对我隐藏
    }
    const col=foe?'#dc6d60':'#57c9a0';
    for(let i=1;i<a.length;i++){
      const p=fxC(a[i-1].x,a[i-1].y), q=fxC(a[i].x,a[i].y);
      if(p.cx===q.cx&&p.cy===q.cy) continue;
      if(!fxInView((p.cx+q.cx)/2,(p.cy+q.cy)/2,u,30)) continue;
      const op=0.20+0.48*(i/a.length);
      s+='<path d="M'+p.cx.toFixed(1)+' '+p.cy.toFixed(1)+' L'+q.cx.toFixed(1)+' '+q.cy.toFixed(1)+
        '" fill="none" stroke="'+col+'" stroke-width="'+((z>=2?1.5:2.1)*u).toFixed(2)+'" stroke-linecap="round" opacity="'+op.toFixed(2)+
        '" stroke-dasharray="'+(5*u).toFixed(1)+' '+(2.5*u).toFixed(1)+'"/>';
    }
    const last=a[a.length-1], prev=a[a.length-2], q=fxC(last.x,last.y), p=fxC(prev.x,prev.y);
    if(fxInView(q.cx,q.cy,u,20)&&(p.cx!==q.cx||p.cy!==q.cy))
      s+=fxArrow(p.cx,p.cy,q.cx,q.cy,u,col,{w:1.8,head:6,op:.72});
  }
  /* 3) 我方进攻轴线（敌方决心永远不渲染） */
  const AX=['attack','infiltrate','nightraid','feint','sapper','ambush'];
  if(!fxIsReplay()) for(const un of S.pieces){
    if(!un.alive||AX.indexOf(un.order.type)<0) continue;
    const a=fxC(un.x,un.y);
    let c=un.order.target?fxC(un.order.target.x,un.order.target.y):null;
    if(!c){ const e=nearestEnemy(un); if(e&&foeSighted(e)){ const rp=foeReportPos(e); c=fxC(rp.x,rp.y); } }
    if(!c||!fxInView((a.cx+c.cx)/2,(a.cy+c.cy)/2,u,60)) continue;
    const strong=(un.order.type==='attack'||un.order.type==='infiltrate');
    const aw=strong?(z>=2?2.4:3.4):(z>=2?1.5:2.1);
    s+=fxArrow(a.cx,a.cy,c.cx,c.cy,u,'#e4b969',{w:aw,head:strong?(z>=2?8:11):(z>=2?6:8),op:.9,flow:true});
  }
  /* v1.1：原"敌预期动向"红虚线已彻底移除——敌方 goal / task / 命令队列属对手决心，不得显示 */
  return s+'</g>';
}

/* ============================================================
   v1.3 · 分级行军路线（下半级）
   z=0 师：战役意图大箭头 + 团级主轨迹（由 renderStrategyFx / renderRoutes 承担）
   z=1 团：团计划路线 / 已执行轨迹 / 进攻轴线
   z=2 营：营计划路线（带番号）、阵地调整轨迹、已传达命令结果
   z=3 连：连 / 班接敌轴线、微格机动与动作标签
   只表达我方自己的命令与已发生的事实；敌方下级路线与决心一概不画。
   ============================================================ */
function echelonTarget(o){
  const t=o.target; if(!t) return null;
  if(t.mx!==undefined&&t.my!==undefined) return microWorld(t.x,t.y,t.sx===undefined?1:t.sx,t.sy===undefined?1:t.sy,t.mx,t.my);
  if(t.sx!==undefined&&t.sy!==undefined) return subWorld(t.x,t.y,t.sx,t.sy);
  return fxC(t.x,t.y);
}
function renderEchelonRoutes(z,u){
  if(z<2||!layerOn('route')||fxIsReplay()) return '';
  let s='<g pointer-events="none">';
  /* 1) 阵地调整轨迹：初始阵位 → 现阵位（真实已发生的机动） */
  for(const id in S.subs){
    const q=S.subs[id];
    if(!q.alive||!q.placed||!q.home||q.detached) continue;
    if(z===2&&q.level!=='battalion') continue;
    const p=subWorld(q.home.x,q.home.y,q.home.sx===undefined?1:q.home.sx,q.home.sy===undefined?1:q.home.sy);
    const w=subPos(q);
    if(!w||Math.abs(p.cx-w.cx)+Math.abs(p.cy-w.cy)<2) continue;
    if(!fxInView((p.cx+w.cx)/2,(p.cy+w.cy)/2,u,20)) continue;
    s+='<path d="M'+p.cx.toFixed(1)+' '+p.cy.toFixed(1)+' L'+w.cx.toFixed(1)+' '+w.cy.toFixed(1)+
       '" fill="none" stroke="#8fa79c" stroke-width="'+(1.2*u).toFixed(2)+'" opacity=".42" stroke-dasharray="'+
       (2*u).toFixed(1)+' '+(3*u).toFixed(1)+'"/>';
  }
  /* 2) 已下达的下级命令：done 实线 / failed 断线；lost 与 pending 不在此画 */
  for(const o of S.subOrders){
    if(o.status==='pending'||o.status==='lost'||!o.target) continue;
    const q=subById(o.subId); if(!q||!q.alive||!q.placed) continue;
    const p=subPos(q), c=echelonTarget(o); if(!p||!c) continue;
    if(!fxInView((p.cx+c.cx)/2,(p.cy+c.cy)/2,u,30)) continue;
    const ok=o.status==='done', col=ok?(o.level==='battalion'?'#8fc4d8':'#c2d68a'):'#8fa79c';
    s+=fxArrow(p.cx,p.cy,c.cx,c.cy,u,col,{w:ok?1.5:1.1,head:5,dash:ok?null:[2,3],op:ok?.72:.42});
    if(z>=3&&ok){
      const name=(CACTS[o.type]||SQUAD_ROLES[o.type]||BTASKS[o.type]||{}).n||o.type;
      s+=fxLabel((p.cx+c.cx)/2,(p.cy+c.cy)/2,o.sub+' · '+name,u,col,-4);
    }
  }
  /* 3) 连级接敌轴线：我方连 / 班当前战术动作 → 最近已侦知敌（非敌意图） */
  if(z>=3) for(const id in S.subs){
    const q=S.subs[id];
    if(!q.alive||!q.placed||q.detached||(q.level!=='company'&&q.level!=='squad')) continue;
    const act=q.lastAct||(q.order&&q.order.type);
    if(['attack','nightraid','ambush','sapper','trench','fire','recon'].indexOf(act)<0) continue;
    const p=subPos(q); if(!p) continue;
    const foe=nearestEnemyTo(Math.floor(p.cx/CW),Math.floor(p.cy/CH));
    if(!foe||!foeSighted(foe)) continue;
    const rp=foeReportPos(foe), c=fxC(rp.x,rp.y);
    if(!fxInView((p.cx+c.cx)/2,(p.cy+c.cy)/2,u,25)) continue;
    s+=fxArrow(p.cx,p.cy,c.cx,c.cy,u,'#a9c47a',{w:1.2,head:4.5,op:.48,dash:[3,2]});
  }
  return s+'</g>';
}

function renderCombatFx(z,u){
  let s='<g pointer-events="none">';
  /* 炮火压制区（实时状态 S.prep，复盘时不叠加当前值） */
  if(!fxIsReplay()) for(const k in S.prep){
    if(S.prep[k]<=0) continue;
    const a=k.split(',').map(Number), q=fxC(a[0],a[1]);
    if(!fxInView(q.cx,q.cy,u,40)) continue;
    const r=CW*0.30;
    s+='<circle cx="'+q.cx.toFixed(1)+'" cy="'+q.cy.toFixed(1)+'" r="'+r.toFixed(1)+
      '" fill="#e4b969" opacity=".075" stroke="#e4b969" stroke-width="'+(1*u).toFixed(2)+
      '" stroke-dasharray="'+(4*u).toFixed(1)+' '+(3*u).toFixed(1)+'" opacity=".55" class="fx-pulse"/>';
    for(let i=-1;i<=1;i++)
      s+='<path d="M'+(q.cx-r*0.8+i*r*0.4).toFixed(1)+' '+(q.cy+r*0.6).toFixed(1)+
         'L'+(q.cx-r*0.15+i*r*0.4).toFixed(1)+' '+(q.cy-r*0.6).toFixed(1)+
         '" stroke="#e4b969" stroke-width="'+(0.9*u).toFixed(2)+'" opacity=".35"/>';
    if(z===0) s+=fxLabel(q.cx,q.cy+r,'炮火压制 '+S.prep[k]+' 时段',u,'#e4b969',2);
  }
  const ev=fxEvents();
  for(const e of ev){
    if(e.type==='move'||e.type==='encircle'||e.type==='subact') continue;
    const K=FX_KIND[e.type]||{n:e.type,c:'#e4b969',big:true};
    if(z===0&&!K.big) continue;                 // 师级全景只留关键事件，避免噪声
    const q=fxC(e.x,e.y);
    if(!fxInView(q.cx,q.cy,u,40)) continue;
    const scale=e.type==='combat'?(e.dmgE>=600?1.5:e.dmgE>=250?1.2:1):(e.type==='kill'?1.4:1);
    s+=fxIcon(e.type,q.cx,q.cy,u,K.c,scale);
    /* 文字信息统一放进态势摘要卡：地图只保留符号与浮动战果数字，避免与单位牌争空间 */
    if(e.type==='combat'||e.type==='kill'){
      const val=e.type==='kill'?(e.cap||0):(e.dmgE||0);
      s+='<g class="fx-float" pointer-events="none"><text x="'+(q.cx+17*u).toFixed(1)+'" y="'+(q.cy-15*u).toFixed(1)+
        '" text-anchor="middle" font-size="'+(12*u).toFixed(2)+'" fill="#e4b969" stroke="#0c1712" stroke-width="'+
        (2.4*u).toFixed(2)+'" paint-order="stroke" font-weight="700">-'+val+'</text></g>';
    }
    /* 近迫作业：向当面之敌延伸的交通壕短划 */
    if(e.type==='trench'){
      const foe=nearestEnemyTo(e.x,e.y);
      if(foe){ const f=fxC(foe.x,foe.y), dx=f.cx-q.cx, dy=f.cy-q.cy, L=Math.hypot(dx,dy)||1;
        const vx=dx/L, vy=dy/L, px=-vy, py=vx;
        for(let i=1;i<=3;i++){
          const cx=q.cx+vx*(CW*0.28*i), cy=q.cy+vy*(CH*0.28*i);
          s+='<path d="M'+(cx-px*5*u).toFixed(1)+' '+(cy-py*5*u).toFixed(1)+'L'+(cx+px*5*u).toFixed(1)+' '+(cy+py*5*u).toFixed(1)+
             '" stroke="#c2d68a" stroke-width="'+(1.6*u).toFixed(2)+'" opacity=".75"/>';
        }
      }
    }
    /* 漏网：逃遁虚线箭头 */
    if(e.type==='escape'){
      s+=fxArrow(q.cx,q.cy,q.cx+CW*0.9,q.cy-CH*0.6,u,'#dc6d60',{w:1.8,head:7,dash:[3,3],op:.8});
    }
  }
  return s+'</g>';
}

/* C · 战术态势：合围圈 / 营任务符号 / 连战术动作 */
function renderTacticFx(z,u){
  let s='<g pointer-events="none">';
  /* 复盘只显示该时段事件；合围圈 / 营任务由实时状态派生，复盘时隐藏以免混淆 */
  /* 1) 合围圈：真实由 encircled() 判定，不是事件推测；未确认敌不画 */
  if(!fxIsReplay()) for(const e of S.enemies){
    if(!e.alive||!e.active||!foeExact(e)) continue;
    const al=S.pieces.filter(p=>p.alive&&!NONCOMBAT.has(p.kind)&&dist(p,e)<=1);
    if(!encircled(e,al)) continue;
    const q=fxC(e.x,e.y), rx=CW*0.62, ry=CH*0.62;
    s+='<ellipse cx="'+q.cx.toFixed(1)+'" cy="'+q.cy.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+
      '" fill="none" stroke="#e4b969" stroke-width="'+(1.6*u).toFixed(2)+'" stroke-dasharray="'+
      (5*u).toFixed(1)+' '+(4*u).toFixed(1)+'" opacity=".58" class="fx-pulse"/>';
    s+=fxLabel(q.cx,q.cy-ry,'合围',u,'#e4b969',-3);
  }
  /* 2) 营任务符号：主攻楔 / 牵制阻断 / 预备队环 / 固守盾 / 阻援交叉 */
  if(z>=1 && !fxIsReplay()) for(const id in S.subs){
    const q=S.subs[id];
    if(q.level!=='battalion'||!q.alive||!q.placed) continue;
    const w=subPos(q); if(!w||!fxInView(w.cx,w.cy,u,20)) continue;
    const a=7*u, cx=w.cx, cy=w.cy, col=(BTASKS[q.task]||{}).c||'#e4b969';
    let g='';
    if(q.task==='main'||q.task==='support') g='<path d="M'+(cx-a)+' '+(cy+a*0.6)+' L'+cx+' '+(cy-a)+' L'+(cx+a)+' '+(cy+a*0.6)+
      ' L'+cx+' '+(cy+a*0.28)+' Z" fill="'+col+'" opacity=".78"/>';
    else if(q.task==='pin'||q.task==='block') g='<path d="M'+(cx-a)+' '+(cy-a*0.5)+' H'+(cx+a)+
      '" stroke="'+col+'" stroke-width="'+(3*u).toFixed(2)+'"/><path d="M'+(cx-a)+' '+(cy+a*0.5)+' H'+(cx+a)+
      '" stroke="'+col+'" stroke-width="'+(1.4*u).toFixed(2)+'" stroke-dasharray="'+(3*u).toFixed(1)+' '+(2*u).toFixed(1)+'"/>';
    else if(q.task==='reserve') g='<circle cx="'+cx+'" cy="'+cy+'" r="'+(a*0.8).toFixed(1)+
      '" fill="none" stroke="'+col+'" stroke-width="'+(2.2*u).toFixed(2)+'"/>';
    else if(q.task==='defend') g='<path d="M'+cx+' '+(cy-a)+' L'+(cx+a*0.8)+' '+(cy-a*0.5)+' V'+(cy+a*0.3)+
      ' Q'+cx+' '+(cy+a)+' '+(cx-a*0.8)+' '+(cy+a*0.3)+' V'+(cy-a*0.5)+' Z" fill="none" stroke="'+col+'" stroke-width="'+(2*u).toFixed(2)+'"/>';
    if(g) s+='<g opacity=".55">'+g+'</g>';
  }
  /* 3) 连战术动作图标（营连级）：来自 subPhase 旁路的 subact 事件 */
  if(z>=2) for(const e of fxEvents()){
    if(e.type!=='subact'||e.sx===undefined) continue;
    const w=subWorld(e.x,e.y,e.sx,e.sy);
    if(!fxInView(w.cx,w.cy,u,20)) continue;
    const map={trench:'trench',sapper:'combat',fire:'combat',entrench:'defend',recon:'recon',
      persuade:'persuade',political:'political',line:'line',rest:'rest',ambush:'wait',attack:'combat'};
    const k=map[e.act]||'wait', col='#c2d68a';
    s+=fxIcon(k,w.cx,w.cy-6*u,u,col,0.62);
  }
  return s+'</g>';
}

/* D · 战略态势：交通线控制带 / 战役意图方向（师级全景） */
function renderStrategyFx(z,u){
  let s='<g pointer-events="none">';
  /* 1) 实际控制带：与 updateObjectives() 完全相同的判定，不另设事实源；复盘时隐藏 */
  if(!fxIsReplay()) for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const ch=terrainAt(x,y); if(ch!=='r'&&ch!=='=') continue;
    const mine=S.pieces.some(p=>p.alive&&!NONCOMBAT.has(p.kind)&&dist(p,{x,y})<=1);
    const foe=S.enemies.some(e=>e.alive&&e.active&&dist(e,{x,y})<=1);
    if(!mine||foe) continue;
    const q=fxC(x,y);
    if(!fxInView(q.cx,q.cy,u,20)) continue;
    s+='<rect x="'+(x*CW+2*u).toFixed(1)+'" y="'+(y*CH+2*u).toFixed(1)+'" width="'+(CW-4*u).toFixed(1)+
      '" height="'+(CH-4*u).toFixed(1)+'" rx="'+(3*u).toFixed(1)+'" fill="#57c9a0" opacity=".10" stroke="#57c9a0" stroke-width="'+
      (1.1*u).toFixed(2)+'" stroke-dasharray="'+(3*u).toFixed(1)+' '+(2*u).toFixed(1)+'"/>';
  }
  /* 2) 战役意图大箭头：依据剧本 intent / 真实电文，标注为方针示意而非精确坐标 */
  if(z===0 && S.sc.fxFocus){
    const f=S.sc.fxFocus, st=S.sc.start;
    const sx=st.reduce((a,p)=>a+p.x,0)/st.length, sy=st.reduce((a,p)=>a+p.y,0)/st.length;
    const a=fxC(sx,sy), c=fxC(f.x,f.y);
    s+=fxArrow(a.cx,a.cy,c.cx,c.cy,u,'#a9c47a',{w:5,head:17,op:.52,flow:true});
    s+=fxLabel((a.cx+c.cx)/2,(a.cy+c.cy)/2,'战役意图（我方上级方针）：'+f.label,u,'#a9c47a',-10);
  }
  return s+'</g>';
}


/* ---------------- 主渲染 ---------------- */
function renderMap(){
  const g=S.geo, gk=S.sc.geo, z=S.view.z, u=zoomU();
  let s='<svg class="geosvg '+(S.fx&&S.fx.animate?'fx-anim':'fx-static')+'" viewBox="'+viewBoxStr()+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="0" y="0" width="800" height="480" fill="#142b26"/>';
  if(layerOn('relief'))  s+=(z===0?hypsometric(gk):localHypsometric(gk,z));
  if(layerOn('zone'))    s+=renderControlZones(z,u);
  if(layerOn('lake'))    s+=renderWaterBodies(gk,z,u);
  if(layerOn('contour')) s+=(z===0?renderContours(gk,z,u):renderLocalContours(gk,z,u));
  if(layerOn('grid'))    s+=renderGrid(z,u);
  if(layerOn('water'))   s+=renderRivers(g,z,u);
  if(layerOn('road'))    s+=renderRoads(g,z,u);
  if(layerOn('rail'))    s+=renderRails(g,z,u);
  if(layerOn('place'))   s+=renderSettlements(g,z,u);
  if(layerOn('carto'))   s+=renderCartography(gk,z,u);
  if(layerOn('subgrid')) s+=renderSubGrid(z,u);
  if(layerOn('subgrid')) s+=renderSubFeatures(gk,z,u);
  if(layerOn('feature')) s+=renderFeatures(gk,z,u);
  /* v0.9：战略 / 路线 / 战术在单位之下，战斗效果覆盖在最上层
     v1.3：接触带与分级阵地是先于路线的面状 / 线状事实层 */
  if(layerOn('strategy')) s+=renderStrategyFx(z,u);
  if(layerOn('front'))    s+=renderFrontLine(z,u);
  if(layerOn('position')) s+=renderPositions(z,u);
  if(layerOn('route'))    s+=renderRoutes(z,u);
  if(layerOn('route'))    s+=renderEchelonRoutes(z,u);
  if(layerOn('tactic'))   s+=renderTacticFx(z,u);
  if(layerOn('contact'))  s+=renderContact(z,u);
  if(layerOn('unit'))    s+=renderUnits(z,u);
  if(layerOn('unit'))    s+=renderFoeUnits(z,u);
  if(layerOn('unit'))    s+=renderSubUnits(z,u);
  if(layerOn('unit'))    s+=renderEdgeCues(z,u);
  if(layerOn('combat'))  s+=renderCombatFx(z,u);
  const sel=byId(S.selected), t=S.pending&&S.pending.target?S.pending.target:null;
  const outline=(x,y,col)=>'<rect x="'+(x*CW).toFixed(1)+'" y="'+(y*CH).toFixed(1)+'" width="'+CW.toFixed(1)+
    '" height="'+CH.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="'+((z===0?2.2:1.0)*u).toFixed(2)+'" pointer-events="none"/>';
  if(sel) s+=outline(sel.x,sel.y,'#89e6c0');
  if(t)   s+=outline(t.x,t.y,'#6fa8c8');
  s+=renderHitAreas(z,u);
  s+=renderMicroHit(z,u);
  /* v1.4：小地图在上层可点击；悬停预览为只读图元 */
  if(layerOn('minimap')) s+=renderMiniMap(z,u);
  s+=renderHoverFx(z,u);
  s+='</svg>';
  const m=document.getElementById('map'); m.innerHTML=s;
  bindMapEvents(m);
}

      esc(hit.level==='battalion'?BTASKS[hit.task].n:((CACTS[hit.lastAct]||{}).n||'待命'))+
      '　<button onclick="selectNode(\''+hit.id+'\')">指挥此单位</button></div>';
    if(d&&d!==hit) h+='<div class="midep">本子格另有 <b>'+esc(d.name)+'</b> '+d.men+'人 · '+
      esc(d.level==='battalion'?BTASKS[d.task].n:'连 / 班')+
      '　<button onclick="undeploySub(\''+d.id+'\')">回归默认阵位</button></div>';
    if(S.deployTarget){
      const lab=subLabel(S.deployTarget);
      h+='<div class="midep">部署模式：<b>'+(lab?esc(lab.name):'')+'</b>　'+
         '<button onclick="(function(){const s=document.getElementById(\'tactask\');deploySubAt(S.deployTarget,'+
         '<button onclick="deployHere()">部署到此子格</button></div>';
    }
  }
  if(here.length) h+='<div>我：'+esc(here.join('、'))+'</div>';
  if(foe.length)  h+='<div>敌：'+esc(foe.join('、'))+'</div>';
  box.innerHTML=h;
}

function renderPlaces(){
  const g=S.geo;
  let h='<div class="sub"><b style="color:var(--gold)">'+esc(g.title)+'</b><br>'+esc(g.scale)+'</div>'+
        '<div class="sub" style="color:#8fa79c">'+esc(g.desc)+'</div>';
  g.places.forEach(p=>{ const c=proj(g,p.lon,p.lat);
    h+='<div class="placeitem"><b>'+esc(p.n)+'</b> <em>('+c.x+','+c.y+') · '+esc(p.t)+'</em><br>'+esc(p.h)+'</div>'; });
  if(!g.rails.length) h+='<div class="placeitem"><b>铁路</b> <em>本战区无铁路干线</em><br>沂蒙山区当时无铁路，机动主要依靠公路与山间道路。</div>';
  g.rails.forEach(r=>h+='<div class="placeitem"><b>'+esc(r.n)+'</b> <em>铁路（真实线路）</em></div>');
  g.rivers.forEach(r=>h+='<div class="placeitem"><b>'+esc(r.n)+'</b> <em>河流 / 水系</em></div>');
  g.roads.forEach(r=>h+='<div class="placeitem"><b>'+esc(r.n)+'</b> <em>公路</em></div>');
  /* v1.2 分级兵要地志：团 / 营 / 连三级应标要素，逐条带史料依据与坐标性质 */
  const lvName=['','团级 · 1:5 万基本战术用图','营级 · 1:2.5 万重点地段图','连级 · 1:1 万设防地区图'];
  for(let lv=1;lv<=3;lv++){
    const list=(CARTO[S.sc.geo]||[]).filter(o=>o.lv===lv);
    let inner='';
    list.forEach((o,ix)=>{
      const c=proj(g,o.lon,o.lat), K=CARTO_KIND[o.t]||CARTO_KIND.town;
      inner+='<div class="placeitem cartoitem" onclick="focusCarto('+lv+','+ix+')" title="点击定位到该要素">'+
        '<b style="color:'+K.c+'">'+esc(o.n)+'</b> <em>('+c.x+','+c.y+') · '+
        esc(K.n)+(o.e!==undefined?' · '+o.e+' m':'')+' · '+(o.exact?'实测坐标':'方位示意')+
        '</em><br>'+esc(o.src)+'</div>';
    });
    h+='<details class="cartod"'+(lv===1?' open':'')+'><summary>'+esc(lvName[lv])+' · '+list.length+
       ' 条应标要素</summary>'+inner+'</details>';
  }
  document.getElementById('places').innerHTML=h;
  document.getElementById('geonote').textContent='地理说明：'+g.desc+'　比例尺：'+g.scale+
    '。地名与坐标取自腾讯地图公开检索（GCJ-02）并据军史校核，地形由 NASA/METI ASTER GDEM 开放高程实测控制点插值重建（插值网格非完整 DEM）。'+
    'v1.2 采用单一世界坐标 + 四级 viewBox 比例尺（师 1:20万 / 团 1:5万 / 营 1:2.5万 / 连 1:1万）：'+
    '师级全景只显示枢纽、干线与大河；团级展开乡镇、山名、编号高地与支流；营级增标村庄、鞍部、冲沟与渡涉点；连级增标崮顶、陡崖、凹地与阵地工事，并逐子格判读地貌部位。'+
    '分级地名逐条标注史料依据，未标 exact 者为按战史方位示意标定，不用于量算。'+
    '符号尺寸与比例尺解耦，放大后线宽字号恒定；图层可独立开关。'+(LAKE_NOTES[S.sc.geo]||'')+
    ' 本图为教学示意格点图，非测绘图、非行政区划图；面状水域与要点边界为符号化示意。';
}

function pieceRow(u){
  const sel=S.selected===u.id?'sel':'';
  const alive=u.alive?'':'dead';
  const exp=S.expanded.has(u.id);
  const arrow=u.kind==='regiment'?'<span class="arrow" onclick="event.stopPropagation();toggle(\''+u.id+'\')">'+(exp?'▾':'▸')+'</span>':'<span class="arrow"></span>';
  const kind=u.kind==='regiment'?'团':u.kind==='squad'?'班':u.detached?'独':'直';
  return '<div class="tn p '+sel+' '+alive+'" onclick="selectNode(\''+u.id+'\')">'+arrow+
    '<span class="mini">'+kind+'</span><b class="tn-n">'+u.name+'</b>'+
    unitBar(u.men,u.men0)+unitLamp(u.alive)+
    '<span class="tn-txt">'+u.men+'人 · '+CMDS[u.order.type].n+'</span></div>';
}

function renderTree(){
  const sl=(id)=>S.treeSel===id?'sel':'';
  let h='<div class="tn root">师部 <span>师长 · 政委 · 参谋长 · 政治部主任</span></div>';
  for(const r of S.pieces.filter(p=>p.kind==='regiment')){
    h+=pieceRow(r);
    if(S.expanded.has(r.id)){
      for(const b of r.subs){
        const ex=S.expanded.has(b.id);
        h+='<div class="tn b '+sl(b.id)+'" onclick="selectNode(\''+b.id+'\')">'+
           '<span class="arrow" onclick="event.stopPropagation();toggle(\''+b.id+'\')">'+(ex?'▾':'▸')+'</span>'+
           '<span class="mini">营</span><b class="tn-n">'+b.name+'</b>'+unitBar(b.men,b.men0)+unitLamp(b.alive)+
           '<span class="tn-txt">'+BTASKS[b.task].n+'</span></div>';
        if(ex) for(const c of b.comps){
          const cx=S.expanded.has(c.id);
          h+='<div class="tn c '+sl(c.id)+'" onclick="selectNode(\''+c.id+'\')">'+
             '<span class="arrow" onclick="event.stopPropagation();toggle(\''+c.id+'\')">'+(cx?'▾':'▸')+'</span>'+
             '<span class="mini">连</span><b class="tn-n">'+c.name+'</b>'+unitBar(c.men,c.men0)+unitLamp(c.alive)+
             '<span class="tn-txt">'+((CACTS[c.lastAct]||{}).n||'待命')+'</span></div>';
          if(cx) for(const q of c.squads){
            const pid='p_'+q.id, dep=!!(byId(pid)&&byId(pid).alive);
            h+='<div class="tn s '+sl(dep?pid:q.id)+' '+(dep?'dep':'')+'" onclick="selectNode(\''+(dep?pid:q.id)+'\')">'+
               '<span class="mini">班</span><b class="tn-n">'+q.name+'</b>'+unitBar(q.men,q.men0)+unitLamp(q.alive)+
               '<span class="tn-txt">'+(dep?'已派出':SQUAD_ROLES[q.role].n)+'</span></div>';
          }
        }
      }
    }
  }
  h+='<div class="tn root" style="color:var(--blue)">师直属分队 <span>炮兵 / 侦察 / 通信 / 警卫 / 担架 / 支前 / 政工</span></div>';
  for(const u of S.pieces.filter(p=>p.kind!=='regiment'&&!p.detached)) h+=pieceRow(u);
  const detached=S.pieces.filter(p=>p.detached&&p.alive);
  if(detached.length){
    h+='<div class="tn root" style="color:var(--gold)">已派出分队 <span>师部直接指挥</span></div>';
    for(const u of detached) h+=pieceRow(u);
  }
  document.getElementById('tree').innerHTML=h;
}

function bar(v,color){ return '<div class="bar"><i class="'+(v<35?'low':'')+'" style="width:'+clamp(v,0,100)+'%'+(color?';background:'+color:'')+'"></i></div>'; }
function renderDetail(){
  const box=document.getElementById('detail');
  let u=byId(S.selected);
  const sub=S.treeSel?subById(S.treeSel):null;
  if(!u && sub){
    const L=SUB_LEVEL[sub.level], reg=byId(sub.reg), p=sub.placed;
    const taskTxt=sub.level==='battalion'?BTASKS[sub.task].n:
                  sub.level==='company'?((CACTS[sub.lastAct]||{}).n||'待命'):SQUAD_ROLES[sub.role].n;
    const pos=p?('('+p.x+','+p.y+') '+SUB_DIRS[p.sy*SUB+p.sx]+'子格'+
      (p.mx!==undefined?' · 微格('+p.mx+','+p.my+')':'')):'—';
    const f=p?subFeature(S.sc.geo,p.x,p.y,p.sx,p.sy):null;
    let info='<div class="kv"><div>单位 <b>'+esc(sub.name)+'</b></div><div>层级 <b>'+L.n+'</b></div>'+
      '<div>隶属 <b>'+esc(reg?reg.name:'—')+'</b></div><div>兵员 <b>'+sub.men+' / '+sub.men0+'</b></div>'+
      '<div>士气 <b>'+Math.round(sub.morale)+'</b></div><div>弹药 <b>'+Math.round(sub.ammo)+'</b></div></div>';
    info+='<div style="font-size:10px;color:var(--mut)">疲劳 '+Math.round(sub.fatigue)+'</div>'+bar(100-sub.fatigue)+
          '<div style="font-size:10px;color:var(--mut)">编成占母团 '+Math.round(sub.men/Math.max(1,reg?reg.men0:1)*100)+'%</div>'+bar(sub.men/Math.max(1,sub.men0)*100);
    info+='<div class="sub" style="margin-top:6px">当前任务：<b style="color:var(--gold)">'+esc(taskTxt)+'</b><br>阵位：'+esc(pos)+'</div>';
    if(f) info+='<div class="misrc">要点：'+esc(f.n)+' · 高程 '+f.elev+' m · 防'+
      (f.eff.def>=0?'+':'')+Math.round(f.eff.def*100)+'% / 攻'+(f.eff.att>=0?'+':'')+

      '<button onclick="focusOnSub(\''+sub.id+'\')">地图定位</button>'+
      '<button onclick="undeploySub(\''+sub.id+'\')">回归默认阵位</button>'+

    info+='<div class="hint">'+L.n+'级指挥经师—团—营—连逐级传达：作业量 <b>'+L.cost+'</b> 点、传达延迟 <b>+'+L.delay+'</b> 时段。'+
      '右侧命令面板已按本级自动切换；兵力计入母团账目，伤亡与补充逐级分摊。</div>';

function renderCmd(){
  const box=document.getElementById('cmdpanel');
  const sub=S.treeSel?subById(S.treeSel):null;
  if(sub&&sub.alive){
    const L=SUB_LEVEL[sub.level];
    const table=sub.level==='battalion'?BTASKS:sub.level==='company'?CACTS:SQUAD_ROLES;
    const btn=(k)=>{
      const c=table[k], dis=(c.night&&!S.night);
      const cost=sub.level==='battalion'?('×'+BTASKS[k].commit.toFixed(2)):(c.need?'⌖':'○');
      return cmdCard(k,c,{active:S.subPending===k,disabled:dis,cost,
        onclick:"chooseSubCmd('"+k+"')"});
    };
    let h='<div class="sub">指挥对象：<b style="color:var(--ours2)">'+esc(sub.name)+'</b>（'+L.n+'级）· 作业量 '+L.cost+' 点 / 传达延迟 +'+L.delay+'</div>';
    if(sub.level==='company'){
      const groups={};
      for(const k in table){ const g=table[k].g; (groups[g]=groups[g]||[]).push(k); }
      for(const g in groups) h+='<div class="cmdgroup"><span>'+esc(g)+'</span><div class="cmds">'+groups[g].map(btn).join('')+'</div></div>';
    }else h+='<div class="cmds">'+Object.keys(table).map(btn).join('')+'</div>';

    else h+='<div class="hint">'+(sub.level==='battalion'?'任务编成决定该营投入多少兵力：主攻 / 助攻 / 牵制 / 预备队。集中两个以上营主攻可形成局部优势。':
      sub.level==='company'?'连是基本战术单位，动作在下一时段生效并产生具体效果。':'班可编为专门小组，或派出为师部直接指挥的独立分队。')+'</div>';

  for(const k of list){
    const c=CMDS[k], dis=(c.night&&!S.night);
    h+=cmdCard(k,c,{active:!!(S.pending&&S.pending.type===k),disabled:dis,
      cost:(c.need?'⌖':'○')+(c.night?' ☾':''),onclick:"chooseCmd('"+k+"')"});
  }
  h+='</div>';
  if(S.pending) h+='<div class="hint">已选「'+CMDS[S.pending.type].n+'」：现在点击地图上的目标格（原地类命令无需目标）。<button onclick="clearPending()">取消</button></div>';
  else h+='<div class="hint">'+(list.length?CMDS[list[0]].d:'')+'</div>';

function toggle(id){ if(S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id); renderTree(); }
function selectNode(id){
  const p=byId(id);
  if(p){ S.selected=id; S.treeSel=null; }
  else {
    S.treeSel=id; S.selected=null;
    const sub=subById(id);
    if(sub){
      S.expanded.add(id); S.expanded.add(sub.reg);
      let n=parentOf(sub);
      while(n&&n.level!=='regiment'){ S.expanded.add(n.id); n=parentOf(n); }
      const bo=battalionOf(sub); if(bo) S.focusSub=bo.id;
      if(S.view.z===0) zoomSet(1);
    }
  }
  renderAll();
}
function deploy(subId){
  const f=findSub(subId); if(!f) return;
  const pid='p_'+subId;
  if(byId(pid)){ log('该分队已派出。','warn'); return; }
  const s=f.node;
  if(f.kind!=='squad' && f.kind!=='company'){ log('原型中仅连、班可派出为独立分队。','warn'); return; }
  const men=f.kind==='squad'?s.men:Math.round(s.squads.reduce((a,b)=>a+b.men,0));
  const r=f.reg;
  if(r.men<=men+100){ log('母团兵力不足，无法抽调。','warn'); return; }
  const chain=[s]; let par=parentOf(s);
  while(par&&par.level!=='regiment'){ chain.push(par); par=parentOf(par); }
  chain.push(r);
  for(const n of chain) n.men=Math.max(0,n.men-men);
  s.alive=false; s.detached=true;
  if(f.kind==='company') for(const q of s.squads){ q.men=0; q.alive=false; q.detached=true; }
  const u={id:pid,name:(f.kind==='squad'?'':'')+r.name+' '+s.name,kind:'squad',level:'squad',
    x:r.x,y:r.y,men,men0:men,morale:r.morale,fatigue:r.fatigue,ammo:r.ammo,training:1.08,
    entrench:0,trench:0,order:{type:'hold'},subs:[],alive:true,detached:true,from:r.id};
  S.pieces.push(u);
  S.selected=pid; S.treeSel=null;
  log('【编组】'+u.name+' 从 '+r.name+' 抽调 '+men+' 人，作为独立分队受师部直接指挥。','good');
  renderAll();
}
function chooseCmd(k){
  const c=CMDS[k];
  if(c.night&&!S.night){ log('夜袭只能在夜间下达。','warn'); return; }
  if(!c.need){ issueOrder(k,document.getElementById('comm').value,null); return; }
  S.pending={type:k};
  renderAll();
}
function clearPending(){ S.pending=null; renderAll(); }
function chooseSubCmd(k){
  const sub=subById(S.treeSel); if(!sub) return;
  const table=sub.level==='battalion'?BTASKS:sub.level==='company'?CACTS:SQUAD_ROLES;
  const c=table[k]; if(!c) return;
  if(c.night&&!S.night){ log('夜袭只能在夜间时段下达。','warn'); return; }
  if(['attack','nightraid','ambush','recon','sapper','persuade'].indexOf(k)>=0 && S.view.z>=1){
    S.subPending=k; renderAll(); return;
  }
  issueSubOrder(k,document.getElementById('comm').value,null);
}
function clearSubPending(){
  if(!S.subPending) return;
  issueSubOrder(S.subPending,document.getElementById('comm').value,null);
  S.subPending=null;
}
function focusOnSub(id){
  const s=subById(id); if(!s||!s.placed) return;
  const w=subPos(s);
  S.treeSel=id; S.selected=null;
  const bo=battalionOf(s); if(bo) S.focusSub=bo.id;
  if(S.view.z===0) S.view.z=1;
  S.view.cx=w.cx; S.view.cy=w.cy;
  renderAll();
}
function clearFocusSub(){ S.focusSub=null; renderAll(); }
function onCell(x,y){
  const cellPieces=S.pieces.filter(u=>u.alive&&u.x===x&&u.y===y);
  if(S.pending){ issueOrder(S.pending.type,document.getElementById('comm').value,{x,y}); S.pending=null; renderAll(); return; }
  if(cellPieces.length){ S.selected=cellPieces[0].id; S.treeSel=null; renderAll(); return; }
  /* v1.4：目标识别必须走侦知等级，不得用敌方真实坐标，
     否则点击空格就会报出未侦知敌军的番号 / 装备 / 工事，绕开 v1.1 迷雾。 */
  const e=S.enemies.find(z=>{
    if(!z.alive||!z.active||!foeSighted(z)) return false;
    const rp=foeReportPos(z); return rp.x===x&&rp.y===y;
  });
  if(e){
    const lvl=foeLvl(e), rp=foeReportPos(e);
    const nm=lvl>=3?e.name:'当面之敌';
    const det=lvl>=3?'（'+e.equip+'，工事 '+e.entrench+' 级）':
              lvl===2?'（'+foeReportMen(e)+'）':'';
    log('【目标】'+nm+det+' 最后确认于 ('+x+','+y+')'+(rp.stale?'，情报已过 '+rp.stale+' 时段':'')+'。','');
  }
  else log('【地形】('+x+','+y+') '+(TERRAIN[terrainAt(x,y)]||TERRAIN['.']).n+'。','');
  renderLog();
}

    '战略态势（交通线控制带 / 战役意图方向）四组可开关图层；工具栏「态势时间轴」可逐时段复盘，'+
    '地图只放符号、数值统一进「态势摘要卡」。所有表现由结算旁路记录，不改变兵力与胜负。<br>'+
    '<b>编制说明：</b>1948-11-01 前这一级称"旅"（隶属纵队，每旅 3 团）；通令后"旅统改称师、纵队改称军"，军以下按三三制。界面统一称"师"，剧本卡标注当时实际称谓。<br>'+
    '<b>敌情不明，对手会打仗（v1.1）。</b>不再显示敌军动向：每支敌军按「未侦知 / 有迹象 / 概略 / 确实」分级显示，'+
    '位置会随时段过时，需靠侦察连、连级侦察动作、接触、审俘、群众通报与上级来电不断更新；未确认的敌军不会出现在地图上。'+
    '敌军同样有指挥能力，按观察—判断—决心—行动自主选择主攻、牵制、迂回、固守筑垒、火力准备、设伏反冲击、增援友邻、侦察与有序转进，'+
    '并受情报不全、通信延迟与派系协同掣肘约束；敌方决心对我始终隐藏，玩家只能通过侦察与战果推断。<br>'+
    '<b>指挥所作战台（v1.0）。</b>顶栏是带指示灯的战况仪表与推演进度条；左侧是带军标、兵力条与状态灯的单位卡；'+
    '右侧把命令做成带图标、分类色条与代价角标的指令卡，通信方式改为五个电台按键，传达队列是电报回执，敌情是有兵力条的态势卡；'+
    '底部战报是电报纸带，当前指示是四格仪表任务简报。信息载体变了，命令语义、参谋作业量与传达延迟完全不变。<br>'+
    '<b>史实边界：</b>宏观进程、作战方针、电文与地理要素取自公开权威史料；二维地形由 NASA/METI ASTER GDEM 开放高程的实测控制点插值重建并绘制等高线（插值网格非完整 DEM）；'+
    '战术要点位置依据史料方位与真实地名，边界为符号化示意；地图为教学示意格点图，非测绘图。番号、指战员姓名与具体战斗为师级局部示意，'+
    '不改写历史结论，不虚构真实历史人物言行，不渲染血腥。'+
    '</div></details><div class="scs" id="scs"></div></div>'+
    '<div class="ovfoot">'+
    '<button class="big" onclick="start(curSC)">▶ 受领战斗命令，开始推演</button>'+
    '<button onclick="showHistory()">先看战局背景与电文原件</button>'+
    '<span class="sub" style="margin:0;flex:1 1 100%;text-align:left">操作：选单位 → 右键地图弹快捷命令（或按 A 进攻 / M 机动）→ 点地图指定目标 → 结束时段。'+
    'Esc 取消 · 1–4 切级 · 右下小地图点击跳转。每时段 4 点作业量（营 1 点、连 / 班 2 点），建议每 2–3 时段上报战况。'+
    '详细玩法见上方展开项；依据见 docs/SOURCES.md、docs/DESIGN.md。</span></div></div></div>';
  const box=document.getElementById('scs');
  box.innerHTML=SCENARIOS.map((s,i)=>'<div class="sc '+(i===curSC?'on':'')+'" onclick="pickSC('+i+')">'+
    '<em class="sc-no">任务 '+String(i+1).padStart(2,'0')+'</em><b>'+s.name+'</b><p>'+s.era+'<br>'+s.goalText+'<br>'+GEO[s.geo].title+'<br>时限 '+s.limit+' 时段 · 当时称谓：'+s.actual+'</p></div>').join('');
}
var curSC = 0;
function pickSC(i){ curSC=i; showStart(); }
function showBrief(){
  if(!S) return;
  const d=DOCTRINE.find(z=>z.id===S.sc.wire.doc)||DOCTRINE[0];
  document.getElementById('overlay').innerHTML='<div class="ov"><div class="ovcard">'+
    '<h1>上级战斗命令</h1><h2>'+esc(S.sc.name)+' · '+esc(S.sc.era)+'</h2>'+
    '<div class="wire"><b>'+esc(d.title)+'（'+esc(d.date)+'）· '+esc(d.by)+'</b><br>'+esc(S.sc.wire.text)+
    '<br><span style="color:var(--dim);font-size:10px">来源：'+esc(d.src)+'（节选）</span></div>'+
    '<div class="facts"><b>战役意图：</b>'+esc(S.sc.intent)+'<br><b>约束：</b>'+esc(S.sc.constraint)+'<br>'+
    '<b>本级任务：</b>'+esc(S.sc.goalText)+'（时限 '+S.sc.limit+' 时段）<br>'+
    '<b>情况判断：</b>'+esc(S.sc.brief)+'<br>'+
    '<b>编制：</b>师部 → 3 个团 → 每团 3 营 → 每营 3 连 → 每连 3 班；另辖炮兵营、侦察连、通信班、警卫连、担架队、支前民工队、政治工作队。团为地图主棋子，连/班可"派出"。<br>'+
    '<b>史实称谓：</b>'+esc(S.sc.actual)+'<br><b>战场地理：</b>'+esc(S.geo.title)+'；'+esc(S.geo.scale)+'</div>'+
    '<div class="facts" style="margin-top:9px"><b>授权依据：</b>1947-05-12 中央军委电"究打何路最好，由你们当机决策，立付施行，我们不遥制"；'+
    '中央军委并明确"在此方针下，由你们机断专行，不要事事请示……但将战况及意见每日或每两日或每三日报告一次"。</div>'+
    '<div style="text-align:center;margin-top:14px"><button class="big" onclick="closeOverlay()">返回推演</button> '+
    '<button onclick="showHistory()">查阅全部电文</button></div></div></div>';
}
function showHistory(){
  const h='<div class="ov"><div class="ovcard"><h1>战局背景与真实电文</h1>'+
    '<h2>宏观历史进程 · 敌我兵力对比 · 编制沿革 · 上级原文（节选）</h2>'+
    '<h3>一、战争进程</h3><div class="facts">'+HISTORY.timeline.map(t=>'<b>'+esc(t.d)+' · '+esc(t.s)+'</b>：'+esc(t.t)).join('<br>')+'</div>'+
    '<h3 style="margin-top:12px">二、敌我兵力对比</h3><div class="facts">'+
    HISTORY.forces.map(f=>'<b>'+esc(f.d)+'</b>　我 '+esc(f.our)+' ／ 敌 '+esc(f.foe)+' ／ '+esc(f.ratio)+'　'+esc(f.note)).join('<br>')+'</div>'+
    '<h3 style="margin-top:12px">三、编制沿革</h3><div class="facts">'+HISTORY.formations.map(f=>esc(f)).join('<br>')+'</div>'+
    '<h3 style="margin-top:12px">四、真实宏观战斗命令 / 电文（按时间）</h3>'+
    DOCTRINE.map(d=>'<details><summary>'+esc(d.date)+'　'+esc(d.title)+'</summary><p><b>'+esc(d.by)+'</b><br>'+esc(d.q)+
      '<br><em>来源：'+esc(d.src)+'</em><br><em>设计含义：'+esc(d.hint)+'</em></p></details>').join('')+
    '<div style="text-align:center;margin-top:14px"><button class="big" onclick="closeOverlay()">返回</button></div></div></div>';
  document.getElementById('overlay').innerHTML=h;
}
function closeOverlay(){ document.getElementById('overlay').innerHTML=''; }
function showResult(){
  const r=S.result;
  const h='<div class="ov"><div class="ovcard"><h1 style="color:'+(r.score>=52?'var(--ours2)':'var(--enemy)')+'">'+esc(r.title)+'</h1>'+
    '<h2>'+esc(S.sc.name)+' · 第 '+S.turn+' 时段 · 综合 '+r.score+' 分 · '+esc(r.grade)+'</h2>'+
    '<div class="facts">'+esc(r.detail)+'<br>歼敌 '+Math.round(S.stats.enemyLoss)+' 人 · 我伤亡 '+Math.round(S.stats.ownLoss)+' 人 · '+
    '最高局部优势 '+S.stats.bestRatio.toFixed(1)+' 倍 · 控制交通节点 '+(S.stats.railControl||0)+' 处 · 敌漏网 '+S.stats.escape+' 次 · 决心种类 '+S.stats.variety+' 类</div>'+
    '<h3 style="margin-top:14px">十大军事原则评分卡（'+r.ev.filter(x=>x.ok).length+'/8）</h3><div class="evlist">'+
    r.ev.map(x=>'<div class="ev '+(x.ok?'y':'n')+'">'+(x.ok?'✓ ':'✗ ')+esc(x.k)+' <span style="color:var(--dim)">— '+esc(x.n)+'</span></div>').join('')+'</div>'+
    '<h3 style="margin-top:12px">本级决心记录（复盘）</h3><div class="facts" style="max-height:140px;overflow:auto">'+
    (S.decisions.length?S.decisions.map(d=>'第 '+d.turn+' 时段 · '+esc(d.unit)+' · '+esc(d.cmd)+' · '+esc(d.target)).join('<br>'):'未下达任何命令')+'</div>'+
    '<div class="sub" style="margin-top:9px">本作为教学推演，评分只反映指挥部署是否符合当年作战原则，不代表对历史战役的评价。</div>'+
    '<div style="text-align:center;margin-top:12px"><button class="big" onclick="restart()">重新推演</button> '+
    '<button onclick="closeOverlay()">查看战场</button> <button onclick="showHistory()">战局背景</button></div></div></div>';
  document.getElementById('overlay').innerHTML=h;
}
/* v1.2 可选只读预览参数：?sc=0&z=2&cx=375&cy=310
   便于直接打开某一级（团 / 营 / 连）地图做教学或截图；不带参数时行为完全不变。
   参数只改视图，不改史实、规则与情报；无 DOM / 无 location 的测试环境自动跳过。 */
function applyPreviewParams(){
  if(typeof location==='undefined'||typeof URLSearchParams==='undefined') return false;
  try{
    const q=new URLSearchParams(location.search||'');
    if(!q.has('z')) return false;
    const si=clamp(parseInt(q.get('sc')||'0',10)||0,0,SCENARIOS.length-1);
    start(si);
    S.view.z=clamp(parseInt(q.get('z'),10)||0,0,ZOOMS.length-1);
    if(q.has('cx')) S.view.cx=Number(q.get('cx'))||S.view.cx;
    if(q.has('cy')) S.view.cy=Number(q.get('cy'))||S.view.cy;
    renderAll();
    return true;
  }catch(e){ return false; }
}
setupKeys();
if(!applyPreviewParams()) showStart();
