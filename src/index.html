/* 旁路埋点：所有调用点都不读取返回值，也不影响数值 */
function fxPush(type,x,y,o){
  if(!S || !S.fx) return;
  S.fx.events.push(Object.assign({t:S.turn, type, x, y}, o||{}));
}
/* 时段快照：轨迹 + 事件 + 单位位置 + 战果，供复盘时间轴使用 */
function fxSnapshot(){
  if(!S || !S.fx) return;
  for(const u of S.pieces){
    if(!u.alive) continue;
    const a=S.fx.trails[u.id]||(S.fx.trails[u.id]=[]);
    a.push({t:S.turn,x:u.x,y:u.y}); if(a.length>7) a.shift();
  }
  for(const e of S.enemies){
    if(!e.alive || !e.active) continue;
    const a=S.fx.trails[e.id]||(S.fx.trails[e.id]=[]);
    a.push({t:S.turn,x:e.x,y:e.y}); if(a.length>7) a.shift();
  }
  S.fx.history.push({
    t:S.turn, events:S.fx.events.slice(),
    units:S.pieces.filter(u=>u.alive).map(u=>({id:u.id,x:u.x,y:u.y,order:u.order.type,men:u.men})),
    enemies:S.enemies.filter(e=>e.alive&&e.active).map(e=>({id:e.id,x:e.x,y:e.y,men:e.men})),
    stats:{enemyLoss:S.stats.enemyLoss,ownLoss:S.stats.ownLoss,railControl:S.stats.railControl||0},
    score:strategicScore()
  });
  if(S.fx.history.length>40) S.fx.history.shift();
}
function fxIsReplay(){ return !!(S&&S.fx&&S.fx.viewTurn!==null); }
function fxEvents(){
  if(!S||!S.fx) return [];
  if(!fxIsReplay()) return S.fx.events;
  const h=S.fx.history.filter(x=>x.t===S.fx.viewTurn).pop();
  return h?h.events.slice():[];
}
function fxTrails(){
  if(!S||!S.fx) return {};
  if(!fxIsReplay()) return S.fx.trails;
  const out={};
  for(const id in S.fx.trails) out[id]=S.fx.trails[id].filter(p=>p.t<=S.fx.viewTurn);
  return out;
}
function fxHist(){ return (S&&S.fx)?S.fx.history:[]; }

/* 复盘时间轴：手动步进为主（兵棋 AAR 需要逐帧检查），自动播放可选 */
function fxStep(d){
  if(!S||!S.fx||!S.fx.history.length) return;
  fxStop();
  const H=S.fx.history, min=H[0].t, max=H[H.length-1].t;
  let n=(S.fx.viewTurn===null?max:S.fx.viewTurn)+d;
  if(n<min) n=min;
  S.fx.viewTurn=(n>max)?null:n;
  renderAll();
}
function fxLive(){
  if(!S||!S.fx) return;
  fxStop(); S.fx.viewTurn=null; renderAll();
}
function fxStop(){
  if(S&&S.fx&&S.fx.playTimer&&typeof clearInterval==='function'){
    clearInterval(S.fx.playTimer); S.fx.playTimer=null;
  }
}
function fxPlay(){
  if(!S||!S.fx) return;
  if(S.fx.playTimer){ fxStop(); renderAll(); return; }
  const H=S.fx.history; if(!H.length) return;
  if(typeof setInterval!=='function'){ fxStep(1); return; }  // 无定时器环境降级为单步
  if(S.fx.viewTurn===null) S.fx.viewTurn=H[0].t;
  S.fx.playTimer=setInterval(()=>{
    if(!S||!S.fx||!S.fx.history.length){ fxStop(); return; }
    const max=Math.max.apply(null,S.fx.history.map(x=>x.t));
    if(S.fx.viewTurn===null || S.fx.viewTurn>=max){ fxLive(); return; }
    S.fx.viewTurn++; renderAll();
  },750);
  renderAll();
}
function fxToggleAnim(){
  if(!S||!S.fx) return;
  S.fx.animate=!S.fx.animate;
  if(!S.fx.animate) fxStop();
  renderAll();
}

/* 世界坐标辅助：所有尺寸乘 u=1/k，保证任何比例尺下屏幕大小恒定 */
function fxC(x,y){ return {cx:(x+0.5)*CW, cy:(y+0.5)*CH}; }
function fxArrow(x1,y1,x2,y2,u,col,opt){
  opt=opt||{};
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  if(L<0.6*u) return '';
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const hs=(opt.head||7)*u, hw=(opt.head||7)*0.56*u;
  const bx=x2-ux*hs, by=y2-uy*hs;
  const dash=opt.dash?' stroke-dasharray="'+((opt.dash[0])*u).toFixed(1)+' '+((opt.dash[1])*u).toFixed(1)+'"':'';
  let s='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+bx.toFixed(1)+' '+by.toFixed(1)+
    '" fill="none" stroke="'+col+'" stroke-width="'+((opt.w||1.8)*u).toFixed(2)+
    '" stroke-linecap="round" opacity="'+(opt.op||0.85)+'"'+dash+(opt.flow?' class="fx-flow"':'')+'/>';
  const pts=[[x2,y2],[bx+px*hw,by+py*hw],[bx-px*hw,by-py*hw]];
  s+='<path d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z" fill="'+col+'" opacity="'+(opt.op||0.85)+'"/>';
  return s;
}
/* 事件符号：形状编码，不靠更多颜色；带深色底衬保证压在晕渲上可读 */
function fxIcon(type,cx,cy,u,col,scale){
  const a=(6*(scale||1))*u, s=col||(FX_KIND[type]||{c:'#e4b969'}).c;
  let g='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(a*1.25).toFixed(1)+
        '" fill="#0c1712" opacity=".88" stroke="'+s+'" stroke-width="'+(1*u).toFixed(2)+'"/>';
  const P=(d,extra)=>'<path d="'+d+'" fill="none" stroke="'+s+'" stroke-width="'+(1.5*u).toFixed(2)+
     '" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'/>';
  switch(type){
    case 'combat': case 'kill': case 'air': {
      let rays='';
      for(let i=0;i<8;i++){ const an=i*Math.PI/4;
        rays+='M'+(cx+Math.cos(an)*a*0.35).toFixed(1)+' '+(cy+Math.sin(an)*a*0.35).toFixed(1)+
              'L'+(cx+Math.cos(an)*a*0.92).toFixed(1)+' '+(cy+Math.sin(an)*a*0.92).toFixed(1)+' '; }
      g+=P(rays); g+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(a*0.26).toFixed(1)+'" fill="'+s+'"/>';
      break;
    }
    case 'artillery': g+=P('M'+(cx-a*0.7)+' '+(cy+a*0.6)+'L'+(cx+a*0.7)+' '+(cy-a*0.6)+
      ' M'+(cx-a*0.7)+' '+(cy+a*0.1)+'L'+(cx+a*0.7)+' '+(cy-a*0.1)); break;
    case 'trench': case 'line': g+=P(
      'M'+(cx-a*0.8)+' '+(cy-a*0.4)+'h'+(a*1.6)+' M'+(cx-a*0.8)+' '+cy+'h'+(a*1.6)+
      ' M'+(cx-a*0.8)+' '+(cy+a*0.4)+'h'+(a*1.6)); break;
    case 'recon': g+=P('M'+(cx-a*0.8)+' '+cy+'Q'+cx+' '+(cy-a*0.75)+' '+(cx+a*0.8)+' '+cy+
      'Q'+cx+' '+(cy+a*0.75)+' '+(cx-a*0.8)+' '+cy);
      g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(a*0.24).toFixed(1)+'" fill="'+s+'"/>'; break;
    case 'persuade': case 'political': g+=P(
      'M'+(cx-a*0.7)+' '+(cy-a*0.35)+'L'+(cx+a*0.35)+' '+(cy-a*0.65)+'V'+(cy+a*0.65)+
      'L'+(cx-a*0.7)+' '+(cy+a*0.35)+'Z M'+(cx-a*0.7)+' '+(cy+a*0.35)+'v'+(a*0.45)); break;
    case 'defend': case 'entrench': g+=P('M'+cx+' '+(cy-a*0.85)+'L'+(cx+a*0.7)+' '+(cy-a*0.5)+
      'V'+(cy+a*0.2)+'Q'+cx+' '+(cy+a*0.9)+' '+(cx-a*0.7)+' '+(cy+a*0.2)+'V'+(cy-a*0.5)+'Z'); break;
    case 'rest': case 'wait': g+=P('M'+(cx-a*0.55)+' '+(cy+a*0.4)+'A'+(a*0.62)+' '+(a*0.62)+' 0 1 1 '+
      (cx+a*0.55)+' '+(cy+a*0.4)); break;
    case 'envelop': g+=P('M'+(cx-a*0.75)+' '+(cy+a*0.55)+'A'+(a*0.85)+' '+(a*0.85)+' 0 1 1 '+
      (cx+a*0.75)+' '+(cy+a*0.55),'stroke-dasharray="'+(2*u).toFixed(1)+' '+(1.6*u).toFixed(1)+'"'); break;
    case 'supply': g+=P('M'+(cx-a*0.75)+' '+(cy+a*0.5)+'h'+(a*1.5)+'M'+(cx-a*0.5)+' '+(cy+a*0.5)+

    case 'escape': case 'abandon': g+=P('M'+(cx-a*0.7)+' '+(cy+a*0.45)+'L'+(cx+a*0.6)+' '+(cy-a*0.45)+
      'M'+(cx+a*0.6)+' '+(cy-a*0.45)+'l-'+(a*0.55)+' 0 M'+(cx+a*0.6)+' '+(cy-a*0.45)+'l0 '+(a*0.55),

    case 'spawn': case 'breach': g+=P('M'+cx+' '+(cy-a*0.8)+'V'+(cy+a*0.25)+'M'+cx+' '+(cy+a*0.7)+'v'+(a*0.1)); break;
    default: g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(a*0.4).toFixed(1)+'" fill="'+s+'"/>';

  return '<g class="fx-pop" pointer-events="none">'+g+'</g>';

/* 本时段态势摘要：把文字战报结构化，复盘时显示对应时段 */
function renderFxSummary(){
  const box=document.getElementById('fxsummary');
  if(!box) return;
  const replay=fxIsReplay(), H=fxHist();
  const ev=fxEvents();
  /* 地图上只留符号，数值统一收进摘要卡：既丰富信息又不挤压标图 */
  const byType={}, agg={};
  for(const e of ev){
    byType[e.type]=(byType[e.type]||0)+1;
    if(e.type==='combat'){ const d=agg.combat||(agg.combat={e:0,u:0}); d.e+=e.dmgE||0; d.u+=e.dmgU||0; }
    if(e.type==='kill') agg.kill=(agg.kill||0)+(e.cap||0);
    if(e.type==='air') agg.air=(agg.air||0)+(e.d||0);
  }
  const chips=Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).slice(0,7).map(k=>{
    const K=FX_KIND[k]||{n:k,c:'#8fa79c'};
    const ext=k==='combat'&&agg.combat?(' <em>歼 '+Math.round(agg.combat.e)+' / 我 '+Math.round(agg.combat.u)+'</em>'):
              k==='kill'&&agg.kill?(' <em>俘约 '+Math.round(agg.kill)+'</em>'):
              k==='air'&&agg.air?(' <em>-'+Math.round(agg.air)+'</em>'):'';
    return '<span class="fxchip"><i style="background:'+K.c+'"></i>'+esc(K.n)+' <b>'+byType[k]+'</b>'+ext+'</span>';
  }).join('');
  const st=replay?(H.filter(x=>x.t===S.fx.viewTurn).pop()||{stats:{},score:0}):null;
  const s=replay?st.stats:S.stats, score=replay?st.score:strategicScore();
  const bar=(name,v,col)=>'<div class="fxbar"><span>'+name+'</span><i><b style="width:'+
    (clamp(v,0,1)*100).toFixed(0)+'%;background:'+col+'"></b></i><em>'+Math.round(clamp(v,0,1)*100)+'</em></div>';
  let h='<div class="fxhead"><b>'+(replay?'复盘 · 第 '+S.fx.viewTurn+' 时段':'实时 · 第 '+S.turn+' 时段')+'</b>'+
    '<span>'+ev.length+' 项态势事件</span>'+
    (replay?'<button onclick="fxLive()">⟲ 返回实时</button>':'')+'</div>';
  h+='<div class="fxchips">'+(chips||'<span class="fxchip muted">本时段暂无态势事件 · 结束时段后生成</span>')+'</div>';
  h+='<div class="fxbars">'+
    bar('歼敌进度',s.enemyLoss/6500,'#89e6c0')+
    bar('伤亡比',s.enemyLoss/Math.max(1,s.ownLoss)/3,'#e4b969')+
    bar('局部集中',S.stats.bestRatio/3,'#8fc4d8')+
    bar('战斗准备',(S.stats.recon+S.stats.trench+S.stats.prepFire)/6,'#c2d68a')+
    bar('交通线控制',(s.railControl||0)/8,'#d8b39a')+
    bar('战役分',score/100,'#e4b969')+'</div>';
  h+='<div class="fxnote">态势图层只读：路线 / 事件 / 战术战略符号由结算旁路记录，不改变兵力、胜负与评分。复盘仅切换所显示的时段。</div>';
  box.innerHTML=h;
}

/* ============================================================
   v1.1 · 情报不对称（战争迷雾）
   ------------------------------------------------------------
   1. 敌方决心（goal / task / 命令队列）永远不向玩家渲染。
   2. 每个敌单位有独立侦知档案；等级决定"能不能看见、看得清不清"。
   3. 情报会过期：最后一次确认的位置随时段降级，敌人机动后旧位置失效。
   4. 敌方同样只有对我方的不完整情报，绝不直接读取 S.pieces 精确位置。
   ============================================================ */
const INTEL_LV = ['未侦知','有迹象','概略','确实'];
const INTEL_COL = ['#3d5a4a','#8a7338','#c8a55e','#f0937f'];
const INTEL_SRC = {
  wire:'上级通报', contact:'接触发现', recon:'侦察', capture:'审俘 / 俘虏供述',
  guide:'群众带路', fire:'火力暴露', report:'战况通报'
};

function initIntel(){
  S.foeIntel={}; S.foeView={}; S.foeOrders=[]; S.foePrep={};
  for(const e of S.enemies){
    const lvl=e.activateAt?0:2;   // 上级通报：已入场敌军有概略方位，未抵达增援完全未知
    S.foeIntel[e.id]={lvl, seen:{x:e.x,y:e.y,turn:1}, src:lvl?INTEL_SRC.wire:'—',
      last:lvl?1:0, age:0};
  }
  for(const r of S.pieces.filter(p=>p.kind==='regiment'))
    S.foeView[r.id]={lvl:1, seen:{x:r.x,y:r.y,turn:1}};
}
function foeIntel(id){ return (S&&S.foeIntel)?S.foeIntel[id]:null; }
function foeLvl(e){ const q=foeIntel(e.id); return q?q.lvl:0; }
function foeSeen(e){ return foeLvl(e)>=2; }        // 可在地图显示
function foeExact(e){ return foeLvl(e)>=3; }        // 精确读数 / 精确位置
function foeSighted(e){ return foeLvl(e)>=1; }      // 至少知道有这支部队
/* 玩家在地图上看到的位置：精确情报用实时位置，否则用最后确认位置 */
function foeReportPos(e){
  const q=foeIntel(e.id);
  if(!q||q.lvl>=3) return {x:e.x,y:e.y,stale:0};
  return {x:q.seen.x,y:q.seen.y,stale:Math.max(0,S.turn-q.seen.turn)};
}
/* 兵力读数：按情报等级模糊化，绝不直接给精确值 */
function foeReportMen(e){
  const q=foeIntel(e.id), lvl=q?q.lvl:0;
  if(lvl>=3) return e.men+' 人';
  if(lvl===2) return '约 '+Math.round(e.men/200)*200+' 人';
  if(lvl===1) return '兵力不明';
  return '无情报';
}
/* 提升情报；只写档案，不改任何战斗数值 */
function intelMark(id,lvl,src,note){
  if(!S||!S.foeIntel) return;
  const e=S.enemies.find(x=>x.id===id); if(!e) return;
  const q=S.foeIntel[id]; if(!q) return;
  const nl=Math.max(q.lvl,Math.min(3,lvl));
  if(lvl>=2 || nl>q.lvl){
    q.seen={x:e.x,y:e.y,turn:S.turn}; q.src=src; q.last=S.turn; q.age=0;
  }
  q.lvl=nl;
  if(note) q.note=note;
}
function intelGain(kind,x,y,radius){
  if(!S||!S.foeIntel) return 0;
  let n=0;
  for(const e of S.enemies){
    if(!e.alive||!e.active) continue;
    if(radius!==undefined && dist(e,{x,y})>radius) continue;
    const q=S.foeIntel[e.id]; if(!q) continue;
    const before=q.lvl;
    intelMark(e.id,Math.min(3,q.lvl+1),INTEL_SRC[kind]||kind);
    if(S.foeIntel[e.id].lvl>before) n++;
  }
  return n;
}
/* 接触即确认：我方战斗单位与敌相邻时自动获得确实情报 */
function refreshContactIntel(){
  if(!S||!S.foeIntel) return;
  for(const e of S.enemies){
    if(!e.alive||!e.active) continue;
    const near=S.pieces.some(u=>u.alive&&!NONCOMBAT.has(u.kind)&&dist(u,e)<=1);
    if(near) intelMark(e.id,3,INTEL_SRC.contact);
  }
  /* 敌方同样靠接触确认我方，绝不窥屏 */
  for(const r of S.pieces.filter(p=>p.kind==='regiment'&&p.alive)){
    const v=S.foeView[r.id]; if(!v) continue;
    const near=S.enemies.some(e=>e.alive&&e.active&&dist(e,r)<=1);
    if(near){ v.lvl=3; v.seen={x:r.x,y:r.y,turn:S.turn}; }
  }
}
/* 情报衰减：未被本时段刷新则逐步降级，旧位置变成"最后确认" */
function intelDecay(){
  if(!S||!S.foeIntel) return;
  for(const id in S.foeIntel){
    const q=S.foeIntel[id];
    if(q.last===S.turn) continue;
    q.age=(q.age||0)+1;
    if(q.age>=2 && q.lvl>0){ q.lvl--; q.age=0; q.src='情报过时'; }
  }
  for(const id in S.foeView){
    const v=S.foeView[id];
    if(v.seen.turn<S.turn-1 && v.lvl>1) v.lvl--;
  }
}
/* 敌方对我方位置的"估计"：不完整情报下带误差，不返回真实坐标 */
function foeEstimate(regId){
  if(!S||!S.foeView) return null;
  const v=S.foeView[regId]; if(!v||v.lvl<=0) return null;
  const r=byId(regId); if(!r||!r.alive) return null;
  if(v.lvl>=3) return {x:r.x,y:r.y,lvl:3};
  if(v.lvl===2){
    const off=((regId.charCodeAt(regId.length-1)+S.turn)%3)-1;
    return {x:clamp(r.x+off,0,W-1),y:clamp(v.seen.y,0,H-1),lvl:2};
  }
  return {x:v.seen.x,y:v.seen.y,lvl:1};   // 只有旧通报方向
}
function foeViewBest(){
  if(!S||!S.foeView) return 1;
  return Math.max(1,...Object.values(S.foeView).map(v=>v.lvl));
}
/* 敌方侦察提升认知 */
function foeScout(){
  if(!S||!S.foeView) return;
  const rs=S.pieces.filter(p=>p.kind==='regiment'&&p.alive);
  if(!rs.length) return;
  const r=rs[ri(0,rs.length-1)], v=S.foeView[r.id];
  if(v){ v.lvl=Math.min(3,v.lvl+1); v.seen={x:r.x,y:r.y,turn:S.turn}; }
}
/* 我方主动开火会暴露位置 */
function ourFireExpose(){
  if(!S||!S.foeView) return;
  for(const r of S.pieces.filter(p=>p.kind==='regiment'&&p.alive)){
    if(!['attack','artillery','nightraid','trench'].includes(r.order.type)) continue;
    const v=S.foeView[r.id];
    if(v&&v.lvl<3){ v.lvl=Math.min(3,v.lvl+1); v.seen={x:r.x,y:r.y,turn:S.turn}; }
  }
}


/* ============================================================
   v1.1 · 敌方指挥（OPFOR C2）：OODA + 效用评分 + 指挥延迟
   ------------------------------------------------------------
   敌人不再是 advance / hold 两个固定动作，而是按
   观察 → 判断 → 决心 → 行动 自主决策：
   - 只用 foeEstimate() 得到的不完整情报，绝不窥屏读我方真实坐标
   - 十类任务与我方攻防/侦察/支援/撤退/工事对称
   - 决心经通信延迟生效；派系协同失败会延误或只做象征性推进
   - 敌方意图（goal / task / 命令队列）严禁渲染给玩家
   ============================================================ */
const FOE_TASKS = {
  scout:    {n:'侦察搜索',   att:0.80, def:1.00, move:0.5},
  main:     {n:'主攻突击',   att:1.30, def:0.95, move:1},
  support:  {n:'助攻协同',   att:1.12, def:1.00, move:1},
  pin:      {n:'牵制',       att:0.85, def:1.08, move:0.4},
  flank:    {n:'迂回穿插',   att:1.18, def:0.92, move:1},
  fortify:  {n:'固守筑垒',   att:0.90, def:1.35, move:0},
  prep:     {n:'火力准备',   att:1.10, def:1.00, move:0},
  ambush:   {n:'设伏反冲击', att:1.25, def:1.05, move:0.2},
  assist:   {n:'增援友邻',   att:1.00, def:1.02, move:1},
  withdraw: {n:'转进突围',   att:0.70, def:1.10, move:1}
};
const FOE_AGGRESSIVE = new Set(['main','support','ambush','prep','flank']);

function foeStrength(e){ return e.men/Math.max(1,e.men0); }
function foeContacted(e){
  return S.pieces.some(u=>u.alive&&!NONCOMBAT.has(u.kind)&&dist(u,e)<=1);
}
function foeEncircled(e){
  return encircled(e,S.pieces.filter(u=>u.alive&&!NONCOMBAT.has(u.kind)&&dist(u,e)<=1));
}
/* 敌方对我方兵力的估计：情报越差越不准，绝不直接用真实总兵力 */
function foeEstForce(){
  const known=foeViewBest();
  const real=S.pieces.filter(p=>p.kind==='regiment'&&p.alive).reduce((a,p)=>a+p.men,0);
  const f=known>=3?1:known===2?0.75:known===1?0.5:0.3;
  return real*f*(0.9+rnd()*0.2);
}
function foeBestTarget(e){
  const rs=S.pieces.filter(p=>p.kind==='regiment'&&p.alive);
  let best=null,bd=1e9;
  for(const r of rs){
    const est=foeEstimate(r.id); if(!est) continue;
    const d=dist(e,est);
    if(d<bd){bd=d;best=est;}
  }
  if(best) return best;
  return e.goal||null;                    // 上级战役意图，仅 AI 内部使用
}
function foeFlankTarget(e){
  const t=foeBestTarget(e); if(!t) return null;
  const dy=(e.y<=t.y?1:-1);
  return {x:clamp(t.x+(e.x<t.x?-2:2),0,W-1), y:clamp(t.y+dy*2,0,H-1)};
}
function foeThreatenedAlly(e){
  return S.enemies.filter(x=>x!==e&&x.alive&&x.active&&
      (foeStrength(x)<0.92 || foeContacted(x)))
    .sort((a,b)=>dist(e,a)-dist(e,b))[0]||null;
}
function foeRear(e){
  const h=e.home||{x:e.x,y:e.y};
  return {x:clamp(h.x,0,W-1),y:clamp(h.y,0,H-1)};
}
/* 态势判断（Orient）：只使用敌方能感知的量 */
function foeContext(e){
  const known=foeViewBest();
  const est=foeEstForce();
  return {
    known, ratio:est/Math.max(1,e.men), strength:foeStrength(e),
    morale:e.morale/100, ammo:e.ammo/100, entrench:e.entrench||0,
    enc:foeEncircled(e), contact:foeContacted(e),
    ally:!!foeThreatenedAlly(e), goalDist:e.goal?dist(e,e.goal):0,
    terrain:(TERRAIN[terrainAt(e.x,e.y)]||TERRAIN['.']).d,
    ourPressure:(S.turn-(S.stats.lastAttackTurn||0))<=1
  };
}
/* 效用评分：每个任务一个 0..1 分数，取最高；另加随机与行为惯性 */
function foeUtility(e,k,c){
  const F=FOE_TASKS[k];
  let u=0.12;
  switch(k){
    case 'scout':    u=c.known<3?0.48+0.15*(3-c.known):0.05; break;
    case 'withdraw': u=c.strength<0.58?0.94:c.morale<0.40?0.86:c.enc?0.66:0.02; break;
    case 'fortify':  u=(!c.contact?0.30:0.20)+0.07*(3-Math.min(3,c.entrench))+
                       (c.terrain>1.05?0.10:0)+(e.ai==='hold'?0.26:0.06); break;
    case 'prep':     u=(c.known>=2&&c.ammo>0.45)?(c.contact?0.42:0.72):0.10; break;
    case 'ambush':   u=(c.ourPressure&&!c.enc)?0.58:0.16; break;
    case 'assist':   u=c.ally?0.66:0.02; break;
    case 'main':     u=(c.ratio>=1.05&&c.morale>0.45&&c.known>=2)?0.70:0.22; break;
    case 'support':  u=(c.contact&&c.morale>0.40)?0.60:0.18; break;
    case 'pin':      u=(c.ratio<0.9||c.strength<0.6)?0.58:0.20; break;
    case 'flank':    u=(c.known>=2&&!c.enc&&c.ratio>0.7)?0.62:0.18; break;
  }
  if(c.enc && (k==='main'||k==='flank')) u*=0.55;
  if(c.ammo<0.25 && (k==='main'||k==='prep')) u*=0.5;
  if(e.task===k && (e.taskRepeat||0)>=1) u*=0.50;      // 连任即降权，避免战术单调
  return u;
}
/* 决心（Decide）：经指挥链延迟进入命令队列 */
function foeDecide(){
  if(!S||S.over) return;
  const c2=S.sc.foeC2||{delay:1,cohesion:0.65};
  for(const e of S.enemies){
    if(!e.alive||!e.active) continue;
    if(e.taskHold>0 && e.task && e.task!=='withdraw'){ e.taskHold--; continue; }
    const ctx=foeContext(e);
    let best=null,bs=-1;
    for(const k in FOE_TASKS){
      let u=foeUtility(e,k,ctx)+rnd()*0.10;
      if(e.task===k) u+=0.09;                       // 行为惯性，避免抖动
      if(u>bs){bs=u;best=k;}
    }
    const delay=c2.delay+(rnd()>c2.cohesion?1:0);   // 越级遥制 / 派系协同迟缓
    S.foeOrders.push({id:'f'+S.turn+'_'+e.id+'_'+S.foeOrders.length,
      unitId:e.id,task:best,arrive:S.turn+delay,status:'pending',score:+bs.toFixed(2)});
    e.taskHold=1;
  }
}
/* 传达（Deliver）：命令到达才生效，协同失败会再延一个时段 */
function foeDeliver(){
  const c2=S.sc.foeC2||{delay:1,cohesion:0.65};
  for(const o of S.foeOrders){
    if(o.status!=='pending'||o.arrive>S.turn) continue;
    const e=S.enemies.find(x=>x.id===o.unitId);
    if(!e||!e.alive||!e.active){ o.status='void'; continue; }
    if(rnd()>c2.cohesion+0.22){ o.status='delayed'; o.arrive=S.turn+1; continue; }
    o.status='done';
    if(e.task!==o.task){
      S.stats.foeTaskKinds=(S.stats.foeTaskKinds||new Set()).add(o.task);
      e.taskRepeat=0;
    }else e.taskRepeat=(e.taskRepeat||0)+1;
    e.task=o.task;
  }
}
/* 行动（Act）：任务转化为机动 / 工事 / 火力 / 侦察 / 转进 */
function foeExecute(e){
  const F=FOE_TASKS[e.task]||FOE_TASKS.fortify;
  const c2=S.sc.foeC2||{delay:1,cohesion:0.65};
  const fx0={x:e.x,y:e.y};
  let t=null;
  switch(e.task){
    case 'scout':
      foeScout();
      t=foeBestTarget(e);
      if(t&&dist(e,t)>2) moveToward(e,t,1);
      S.stats.foeScout=(S.stats.foeScout||0)+1;
      break;
    case 'main': case 'support':
      t=foeBestTarget(e);
      if(t) moveToward(e,t,F.move?2:1);
      e.committed=true;
      break;
    case 'pin':
      t=foeBestTarget(e);
      if(t&&dist(e,t)>2) moveToward(e,t,1);
      e.pin=true;
      break;
    case 'flank':
      t=foeFlankTarget(e);
      if(t) moveToward(e,t,2);
      e.flanking=true;
      break;
    case 'fortify':
      e.entrench=Math.min(3,(e.entrench||0)+1);
      e.morale=clamp(e.morale+2,0,100);
      if(foeSeen(e)){
        fxPush('foeFortify',e.x,e.y,{name:e.name});
        if(e.entrench===2) log('【敌情】'+(foeExact(e)?e.name:'当面之敌')+' 加修地堡与交通壕，工事增强；宜侦察、近迫作业或尖刀爆破。','warn');
      }
      S.stats.foeFortify=(S.stats.foeFortify||0)+1;
      break;
    case 'prep':
      t=foeBestTarget(e);
      if(t){ S.foePrep[key(t.x,t.y)]=2; e.ammo=clamp(e.ammo-8,0,100); }
      if(foeSeen(e)) log('【敌炮火】'+(foeExact(e)?e.name:'当面之敌')+' 实施火力准备；宜构筑工事、夜间疏散或抢先近迫作业。','warn');
      S.stats.foePrep=(S.stats.foePrep||0)+1;
      break;
    case 'ambush':
      e.ambush=true;
      break;
    case 'assist': {
      const ally=foeThreatenedAlly(e);
      if(ally){
        if(rnd()<c2.cohesion) moveToward(e,{x:ally.x,y:ally.y},1);
        else if(rnd()<0.30) moveToward(e,{x:ally.x,y:ally.y},1);  // 象征性推进（"尖锥战术"）
        S.stats.foeAssist=(S.stats.foeAssist||0)+1;
      }
      break; }
    case 'withdraw': {
      const rear=foeRear(e);
      if(rear) moveToward(e,rear,1);
      e.retreating=true; e.morale=clamp(e.morale+3,0,100);
      const clear=!foeContacted(e);
      e.retreatCount=(e.retreatCount||0)+(clear?1:0);
      if(e.retreatCount>=2){
        e.alive=false; e.escaped=true; S.stats.escape++;
        log('【转进】'+e.name+' 残部有序脱离战场，未能达成"不使漏网"。','warn');
        if(foeSeen(e)) fxPush('escape',e.x,e.y,{name:e.name});
      }
      S.stats.foeWithdraw=(S.stats.foeWithdraw||0)+1;
      break; }
  }
  if(e.x!==fx0.x||e.y!==fx0.y) fxPush('move',e.x,e.y,{from:fx0,id:e.id,foe:true});
  e.ammo=clamp(e.ammo-(F.att>1.05?3:1),0,100);
  e.fatigue=clamp((e.fatigue||0)+(F.move?3:1),0,100);
  e.committed=false; e.pin=false; e.flanking=false; e.ambush=e.task==='ambush';
}
/* 敌方时段入口：观察 → 判断 → 决心 → 传达 → 行动 */
function foeCommandPhase(){
  if(!S||S.over) return;
  refreshContactIntel();
  ourFireExpose();
  foeDecide();
  foeDeliver();
  let breached=false;
  for(const e of S.enemies){
    if(e.activateAt && !e.active && S.turn>=e.activateAt){
      e.active=true;
      intelMark(e.id,1,INTEL_SRC.report,'增援抵达通报');
      if(foeSighted(e)) log('【敌情通报】据侦察，'+e.name+' 方向发现敌部队活动，兵力待核实。','warn');
      else log('【敌情通报】某方向发现敌部队活动，番号与兵力不明，建议组织侦察。','warn');
      if(foeSighted(e)) fxPush('spawn',e.x,e.y,{name:e.name,known:foeLvl(e)});
    }
    if(!e.alive||!e.active) continue;
    if(!e.task) e.task=e.ai==='hold'?'fortify':'scout';
    foeExecute(e);
    if(S.sc.id==='tashan' && e.y<=7 && e.x>=7 && e.x<=13) breached=true;
  }
  if(breached){ S.stats.breach+=1; log('【战况】援敌逼近公路防线一带，累计突破 '+S.stats.breach+' 次。','warn');
    const be=S.enemies.find(e=>e.alive&&e.active); if(be&&foeSeen(be)) fxPush('breach',be.x,be.y,{n:S.stats.breach}); }
  /* 敌方火力准备衰减 */
  for(const k in S.foePrep){ if(S.foePrep[k]>0) S.foePrep[k]--; }
}
/* 敌方主动打击：我方未处于攻击命令时，敌人仍会反冲击 */
function foeInitiative(){
  if(!S||S.over) return;
  for(const e of S.enemies){
    if(!e.alive||!e.active||!FOE_AGGRESSIVE.has(e.task)) continue;
    if(foeContacted(e)===false) continue;
    const victims=S.pieces.filter(u=>u.alive&&!NONCOMBAT.has(u.kind)&&dist(u,e)<=1);
    if(!victims.length) continue;
    const attacking=victims.some(u=>COMBAT_ORDERS.has(u.order.type)&&
      ['attack','nightraid','infiltrate','sapper','ambush'].includes(u.order.type));
    if(attacking) continue;                       // 已有我方主动交火，交给 resolveCombat 统一结算
    const F=FOE_TASKS[e.task];
    let raw=enemyPower(e)*0.045*F.att;
    if(S.foePrep[key(e.x,e.y)]>0) raw*=1.18;
    const dmg=Math.round(raw*(0.9+rnd()*0.2));
    if(dmg<=0) continue;
    const tot=victims.reduce((a,u)=>a+u.men,0)||1;
    for(const u of victims){
      applyLoss(u,Math.round(dmg*u.men/tot));
      u.morale=clamp(u.morale-1.2,0,100);
      if(u.men<=0) u.alive=false;
    }
    S.stats.ownLoss+=dmg;
    S.stats.foePressure=(S.stats.foePressure||0)+1;
    log('【敌反冲击】'+(foeSeen(e)?e.name:'当面之敌')+' 主动攻击我阵地，我伤亡约 '+dmg+' 人；宜构筑工事、掌握预备队或组织反冲击。','warn');
    fxPush('combat',e.x,e.y,{dmgE:0,dmgU:dmg,ratio:0,enc:false,name:e.name,foeInit:true});
  }
}


/* ---------------- ENGINE ---------------- */
function issueOrder(type, comm, target){
  if(S.over) return;
  const u = byId(S.selected);
  if(!u || !u.alive){ log('未选中可指挥单位。','warn'); return; }
  const c = CMDS[type];
  if(!c || c.allow.indexOf(u.kind)<0){ log('该单位不能执行此命令。','warn'); return; }
  if(c.night && !S.night){ log('夜袭只能在夜间时段下达。','warn'); return; }
  if(comm==='bugle' && !c.short){ log('司号只能传达简短命令（停止/待命/转移）。','warn'); return; }
  if(comm==='horn' && u.kind!=='squad'){ log('小喇叭仅用于连以下分队协同。','warn'); return; }
  const cost = 1 + (u.level==='squad' ? 1 : 0);
  if(S.points < cost){ log('师部参谋作业量已用尽，本时段不再下达新命令。','warn'); return; }
  const extra = comm==='radio' && !c.short ? 1 : 0;
  const delay = COMM[comm].delay + (LEVEL_EXTRA[u.level]||0) + extra;
  S.points -= cost;
  S.cmdKinds.add(type);
  S.decisions.push({turn:S.turn, unit:u.name, cmd:c.n, target:target?('('+target.x+','+target.y+')'):'原地'});
  if(type==='wait') S.stats.wait++;
  if(type==='envelop') S.stats.envelop++;
  if(type==='abandon') S.stats.abandon++;
  if(type==='persuade') S.stats.persuade++;
  S.orders.push({id:'o'+S.turn+'_'+S.orders.length, unitId:u.id, unit:u.name, type, comm,
    target, arrive:S.turn+delay, status:'pending'});
  log('【下达】向 '+u.name+' 下达「'+c.n+'」，经'+COMM[comm].n+'传达，预计第 '+(S.turn+delay)+' 时段生效'+(target?'（目标 '+target.x+','+target.y+'）':''),'order');
  if(type==='feint') S.stats.feint++;
  if(type==='infiltrate') S.stats.infiltrate++;
  deliverOrders();
  renderAll();
}
function deliverOrders(){
  for(const o of S.orders){
    if(o.status!=='pending' || o.arrive>S.turn) continue;
    let rel = COMM[o.comm].rel;
    if(o.comm==='phone') rel += S.lineBonus;
    if(rnd() > rel){ o.status='failed'; log('【传达中断】致 '+o.unit+' 的「'+CMDS[o.type].n+'」未能送达（'+COMM[o.comm].n+'），该部仍执行原命令。','warn'); continue; }
    o.status='done';
    const u = byId(o.unitId);
    if(!u || !u.alive) continue;
    u.order = {type:o.type, target:o.target, comm:o.comm};
    log('【生效】'+u.name+'：'+CMDS[o.type].n+(o.target?' → ('+o.target.x+','+o.target.y+')':''),'order');
  }
}
function moveToward(a, t, maxStep){
  if(!t) return false;
  let steps = maxStep || 1;
  const here=terrainAt(a.x,a.y);
  if(here==='='||here==='r') steps += 1;
  if(here==='m'||here==='~') steps = Math.max(1,steps-1);
  if(S.weather==='雨雪') steps = 1;
  let moved = false;
  for(let i=0;i<steps;i++){
    if(a.x===t.x && a.y===t.y) break;
    const dx = t.x-a.x, dy = t.y-a.y;
    let nx=a.x, ny=a.y;
    if(Math.abs(dx)>=Math.abs(dy) && dx!==0) nx += dx>0?1:-1;
    else if(dy!==0) ny += dy>0?1:-1;
    nx=clamp(nx,0,W-1); ny=clamp(ny,0,H-1);
    const nt=terrainAt(nx,ny);
    if(nt==='s') break;
    if(nt==='~' && rnd()<0.45){ break; }
    a.x=nx; a.y=ny; moved=true;
    if(a.fatigue!==undefined) a.fatigue=clamp(a.fatigue+4,0,100);
  }
  return moved;
}

function nearestEnemy(u){
  let best=null, bd=99;
  for(const e of S.enemies){ if(!e.alive||!e.active) continue; const d=dist(u,e); if(d<bd){bd=d;best=e;} }
  return bd<=2 ? best : null;
}

function power(u,e){
  const t = TERRAIN[terrainAt(u.x,u.y)] || TERRAIN['.'];
  let p = u.men * u.training * (0.45+u.morale/180) * (1-u.fatigue/260)
        * (0.35+0.65*u.ammo/100) * t.d * (TACTIC[u.order.type]||0.85);
  if(S.night) p *= (u.order.type==='nightraid' ? 1.35 : 1.08);
  if(u.order.type==='feint') p *= 0.9;
  return p * 0.85;
}
function enemyPower(e){
  const t = TERRAIN[terrainAt(e.x,e.y)] || TERRAIN['.'];
  let p = e.men * (0.5+e.morale/200) * (0.35+0.65*e.ammo/100) * e.fire * t.d;
  if(S.night && e.equip==='美械') p *= 0.75;
  if(S.prep[key(e.x,e.y)]>0) p *= 0.72;
  p *= (1-0.10*e.entrench);
  return p * 0.90;
}
function encircled(e, allies){
  let blocked=0;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  for(const d of dirs){
    const x=e.x+d[0], y=e.y+d[1];
    if(x<0||y<0||x>=W||y>=H){ blocked++; continue; }
    if(terrainAt(x,y)==='~'){ blocked++; continue; }
    if(allies.some(u=>u.x===x&&u.y===y)) blocked++;
  }
  return blocked>=3;
}

  }

  for(const b of e.foeSubs||[]){ b.men=0; b.alive=false; for(const c of b.comps){ c.men=0; c.alive=false; } }
  e.men=0;
  const fighting=S.pieces.filter(u=>u.alive&&!NONCOMBAT.has(u.kind));
  const cand=fighting.filter(u=>dist(u,e)<=1).sort((a,b)=>b.men-a.men)[0];
  if(cand && terrainAt(e.x,e.y)!=='s'){
    cand.x=e.x; cand.y=e.y; cand.order={type:'hold'};

  }

function resolveCombat(){
  for(const e of S.enemies){
    if(!e.alive || !e.active) continue;
    const allies=S.pieces.filter(u=>u.alive && !NONCOMBAT.has(u.kind) && dist(u,e)<=1 && COMBAT_ORDERS.has(u.order.type));
    if(!allies.length) continue;
    const myMen=allies.reduce((s,u)=>s+u.men,0);
    const ratio=myMen/Math.max(1,e.men);
    S.stats.bestRatio=Math.max(S.stats.bestRatio,ratio);
    const enc=encircled(e,allies);
    if(enc){ S.stats.encircle++; fxPush('encircle',e.x,e.y,{name:e.name}); }
    let myE=0, ent=0;
    for(const u of allies){ myE+=power(u,e); ent+=u.entrench; }
    ent/=allies.length;
    const eE=enemyPower(e);
    /* v1.1 敌方指挥：任务编成决定其攻防表现；敌方火力准备压制我方 */
    const ft=FOE_TASKS[e.task]||FOE_TASKS.fortify;
    const foePrep=S.foePrep&&S.foePrep[key(e.x,e.y)]>0?1.15:1.0;
    const rb = ratio>=3?1.30 : ratio>=2?1.15 : ratio<1?0.80 : 1.0;
    const eb = enc?1.28:1.0;
    const trenchB = 1 + 0.16*Math.max.apply(null, allies.map(u=>u.trench||0).concat([0]));
    /* v0.6 下级编成 / 要点 / 战术动作汇总为攻防系数 */
    const tm=subTacticalMod(allies);
    let dmgE=myE*0.110*rb*eb*trenchB*(1-0.12*e.entrench)*tm.att/ft.def;
    let dmgU=eE*0.075*(1-0.10*ent)*(enc?0.85:1)/tm.def*ft.att*foePrep;
    dmgE=Math.round(dmgE*(0.9+rnd()*0.2));
    dmgU=Math.round(dmgU*(0.9+rnd()*0.2));
    const before=e.men;
    applyFoeLoss(e,dmgE);
    e.morale=clamp(e.morale-3-(enc?3:0)-(S.prep[key(e.x,e.y)]>0?2:0),0,100);
    e.ammo=clamp(e.ammo-6,0,100);
    S.stats.enemyLoss+=Math.min(dmgE,before);
    const tot=allies.reduce((s,u)=>s+power(u,e),0)||1;
    for(const u of allies){
      const share=dmgU*power(u,e)/tot;
      applyLoss(u,Math.round(share));
      u.morale=clamp(u.morale-1.6,0,100);
      u.fatigue=clamp(u.fatigue+4,0,100);
      u.ammo=clamp(u.ammo-8,0,100);
      if(u.men<=0){ u.alive=false; log('【减员】'+u.name+' 已失去战斗力。','warn'); }
    }
    S.stats.ownLoss+=dmgU;
    fxPush('combat',e.x,e.y,{dmgE:Math.min(dmgE,before),dmgU,ratio:+ratio.toFixed(2),enc,name:e.name,allies:allies.length});
    log('【接触】'+e.name+'：我以 '+ratio.toFixed(1)+' 倍局部兵力'+(enc?'四面包围':'发起攻击')+
        '，歼敌 '+Math.min(dmgE,before)+'，我伤亡 '+dmgU+'。'+
        (tm.note?'（'+tm.note+'；'+tm.n+' 处要点生效）':''),'combat');
    if(e.men<=0 || e.morale<=15) killEnemy(e,enc);
    else if(e.morale<30 && !enc){
      e.taskHold=0;   // 士气动摇：敌方指挥下时段可决心转进，而非凭空消失
      log('【敌情】'+(foeSeen(e)?e.name:'当面之敌')+' 阵势动摇，或有转进迹象；宜加紧合围、断其退路。','warn'); }
  }
  clearSubActionFlags(S.pieces.filter(u=>u.alive));
  for(const k in S.prep){ if(S.prep[k]>0) S.prep[k]--; }
}

function updateObjectives(){
  // 开放式目标：不设固定占领格，只统计我方实际控制的真实交通线节点
  let rail=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const ch=terrainAt(x,y);
    if(ch!=='r'&&ch!=='=') continue;
    const mine=S.pieces.some(u=>u.alive&&!NONCOMBAT.has(u.kind)&&dist(u,{x,y})<=1);
    const foe=S.enemies.some(e=>e.alive&&e.active&&dist(e,{x,y})<=1);
    if(mine&&!foe) rail++;

  S.stats.railControl=Math.max(S.stats.railControl||0,rail);

  const gap=S.turn-S.lastReport;

    log('【提醒】已逾 '+gap+' 个时段未上报战况；上级要求"战况及意见每日或每两日或每三日报告一次"。','warn'); }
}

function strategicScore(){

  const kill=clamp(s.enemyLoss/6500,0,1);
  const ratio=clamp(s.enemyLoss/Math.max(1,s.ownLoss)/3,0,1);
  const mass=clamp(s.bestRatio/3,0,1);
  const enc=clamp(s.encircle/4,0,1);
  const prep=clamp((s.recon+s.trench+s.prepFire)/6,0,1);
  const line=clamp((s.railControl||0)/8,0,1);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 二维真实地形图：高程分级晕渲 + marching squares 等高线 */
const HYPS = ['#142b26','#1b3a2b','#244630','#31502f','#405430','#515633','#635a38','#75613d'];
function mixHex(a,b,f){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const ch=[0,8,16].map(sh=>{
    const va=(pa>>sh)&255, vb=(pb>>sh)&255;
    return clamp(Math.round(va+(vb-va)*f),0,255).toString(16).padStart(2,'0');
  });
  return '#'+ch[2]+ch[1]+ch[0];
}
function hypsColor(t){
  const n=HYPS.length-1, p=clamp(t,0,1)*n, i=Math.min(n-1,Math.floor(p));
  return mixHex(HYPS[i],HYPS[i+1],p-i);
}
const CW = 800/W, CH = 480/H;
function planePath(pts){
  return pts.map((p,i)=>{
    const c=proj(S.geo,p[0],p[1]);
    return (i?'L':'M')+((c.x+0.5)*CW).toFixed(1)+' '+((c.y+0.5)*CH).toFixed(1);
  }).join(' ');
}
function sampleElevation(gkey, x, y){
  const A=ELEVATION.areas[gkey], g=A.grid, R=g.length, C=g[0].length;
  const fx=(x+0.5)/W*(C-1), fy=(y+0.5)/H*(R-1);
  const gx=clamp(Math.floor(fx),0,C-2), gy=clamp(Math.floor(fy),0,R-2);
  const tx=fx-gx, ty=fy-gy;
  const a=g[gy][gx], b=g[gy][gx+1], c=g[gy+1][gx], d=g[gy+1][gx+1];
  return (a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
}
function contourLevels(gkey){
  const A=ELEVATION.areas[gkey], step=A.contourStep;
  const lo=Math.ceil(A.min/step)*step, hi=Math.floor(A.max/step)*step;
  const out=[]; for(let v=lo; v<=hi; v+=step) out.push(v);
  return out;
}
function contourSegments(gkey, level){
  const A=ELEVATION.areas[gkey], g=A.grid, R=g.length, C=g[0].length, segs=[];
  const X=i=>i/(C-1)*800, Y=j=>j/(R-1)*480;
  for(let j=0;j<R-1;j++) for(let i=0;i<C-1;i++){
    const v=[g[j][i],g[j][i+1],g[j+1][i+1],g[j+1][i]];
    const P=[[X(i),Y(j)],[X(i+1),Y(j)],[X(i+1),Y(j+1)],[X(i),Y(j+1)]];
    const pts=[];
    for(let k=0;k<4;k++){
      const a=v[k], b=v[(k+1)%4], pa=P[k], pb=P[(k+1)%4];
      if((a<level&&b>=level)||(a>=level&&b<level)){
        const t=(level-a)/(b-a);
        pts.push([pa[0]+(pb[0]-pa[0])*t, pa[1]+(pb[1]-pa[1])*t]);
      }
    }
    if(pts.length===2) segs.push([pts[0],pts[1]]);
    else if(pts.length===4){ segs.push([pts[0],pts[1]]); segs.push([pts[2],pts[3]]); }
  }
  return segs;
}
function hypsometric(gkey){
  const A=ELEVATION.areas[gkey], g=A.grid, R=g.length, C=g[0].length;
  const span=Math.max(1,A.max-A.min), w=800/(C-1), h=480/(R-1);
  let s='';
  for(let j=0;j<R-1;j++) for(let i=0;i<C-1;i++){
    const e=(g[j][i]+g[j][i+1]+g[j+1][i]+g[j+1][i+1])/4;
    s+='<rect x="'+(i*w).toFixed(1)+'" y="'+(j*h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+hypsColor((e-A.min)/span)+'"/>';
  }
  return s;
}

  if(plans) s+='\n指向本格的待传达命令 '+plans+' 条';

function renderContours(gk,z,u){
  const L=contourLevels(gk);
  let s='<g pointer-events="none">';
  L.forEach((lv,idx)=>{
    const major=idx%5===0;
    if(z===0 && idx%2===1 && !major) return;
    const segs=contourSegments(gk,lv);
    if(!segs.length) return;
    const d=segs.map(sg=>'M'+sg[0][0].toFixed(1)+' '+sg[0][1].toFixed(1)+'L'+sg[1][0].toFixed(1)+' '+sg[1][1].toFixed(1)).join('');
    s+='<path d="'+d+'" fill="none" stroke="'+(major?'#dcc590':'#9aa884')+'" stroke-width="'+
       ((major?1.4:0.75)*u).toFixed(2)+'" opacity="'+(major?0.72:0.42)+'" stroke-linecap="round"/>';
    if(major){
      const stepN=Math.max(1,Math.floor(segs.length/7));
      for(let k=stepN;k<segs.length;k+=stepN*2){
        const mx=(segs[k][0][0]+segs[k][1][0])/2, my=(segs[k][0][1]+segs[k][1][1])/2;
        s+='<text x="'+mx.toFixed(1)+'" y="'+(my-3*u).toFixed(1)+'" font-size="'+(9*u).toFixed(2)+
           '" fill="#e4b969" opacity=".85" text-anchor="middle">'+lv+'m</text>';
      }
    }
  });

       '" stroke-dasharray="'+(1.1*u).toFixed(2)+' '+(7*u).toFixed(2)+'" opacity=".9"/>';
    if(z>=1){
      const mid=r.pts[Math.floor(r.pts.length/2)], q=geoXY(S.geo,mid[0],mid[1]);
      s+='<text x="'+q.x.toFixed(1)+'" y="'+(q.y+10*u).toFixed(1)+'" text-anchor="middle" font-size="'+
         (8.5*u).toFixed(2)+'" fill="#e0c98f" opacity=".92">'+esc(r.n)+'</text>';
    }
  });
  g.places.forEach(p=>{
    if(p.t==='车站'||p.n.indexOf('车站')>=0){
      const q=geoXY(S.geo,p.lon,p.lat), a=4.5*u;
      s+='<rect x="'+(q.x-a).toFixed(1)+'" y="'+(q.y-a).toFixed(1)+'" width="'+(2*a).toFixed(1)+
         '" height="'+(2*a).toFixed(1)+'" fill="#0b120f" stroke="#c9b47a" stroke-width="'+(1.2*u).toFixed(2)+'"/>';
    }
  });
  return s+'</g>';
}

/* 居民地：等级符号 + 标签避让；Z1 只显示枢纽与县城级，避免地名淹没地形 */
function renderSettlements(g,z,u){
  const showLabel=layerOn('label'), placed=[], b=visibleBox(), pad=70*u;
  /* 放大视图：把可见单位牌预占为障碍，地名标签主动绕开，避免压字 */
  if(z>=1 && showLabel){
    const occupy=(cx,cy,level,compact)=>{
      const near=z>=2?8*u:pad;
      if(cx<b.x-near||cx>b.x+b.w+near||cy<b.y-near||cy>b.y+b.h+near) return;
      const B=BADGE[level]||BADGE.battalion, sc=compact?0.72:1;
      const w=B.w*sc*u, h=B.h*sc*u;
      placed.push({x:cx-w/2,y:cy-h/2,w,h});
    };
    for(const id in S.subs){ const q=S.subs[id];
      if(!q.alive||q.detached||!q.placed) continue;
      if(z===1&&q.level!=='battalion') continue;
      const w=subPos(q); if(w) occupy(w.cx,w.cy,q.level,false);
    }
    for(const e of S.enemies){ for(const fb of e.foeSubs||[]){
      if(!fb.alive||!fb.placed) continue;
      const q=subWorld(fb.placed.x,fb.placed.y,fb.placed.sx,fb.placed.sy);
      occupy(q.cx,q.cy,'foeBattalion',z>=2);
    } }
  }
  let s='<g pointer-events="none">';
  const list=g.places.map(p=>({p,rank:placeRank(p),q:geoXY(g,p.lon,p.lat)}))
    .filter(o=>o.rank>0&&o.rank<4&&!(z===0&&o.rank>=3))
    .filter(o=>o.q.x>=b.x-pad&&o.q.x<=b.x+b.w+pad&&o.q.y>=b.y-pad&&o.q.y<=b.y+b.h+pad)
    .sort((a,b)=>a.rank-b.rank);
  const used=new Set();
  list.forEach(o=>{
    const {p,rank,q}=o, k=key(Math.round(q.x/(CW/2)),Math.round(q.y/(CH/2)));
    if(used.has(k)) return; used.add(k);
    const a=(rank===1?5.2:rank===2?3.4:2.3)*u;
    if(rank===1)
      s+='<rect x="'+(q.x-a).toFixed(1)+'" y="'+(q.y-a).toFixed(1)+'" width="'+(2*a).toFixed(1)+
         '" height="'+(2*a).toFixed(1)+'" fill="#e8dcc0" stroke="#0d1712" stroke-width="'+(1.1*u).toFixed(2)+'"/>';
    else if(rank===2)
      s+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="'+a.toFixed(2)+
         '" fill="#1c2c24" stroke="#e8dcc0" stroke-width="'+(1.3*u).toFixed(2)+'"/>';
    else
      s+='<rect x="'+(q.x-a).toFixed(1)+'" y="'+(q.y-a).toFixed(1)+'" width="'+(2*a).toFixed(1)+
         '" height="'+(2*a).toFixed(1)+'" fill="#9fb0a2" opacity=".9"/>';
    if(!showLabel) return;
    const lab=p.n.length>6?p.n.slice(0,6):p.n;
    const fs=(rank===1?14:rank===2?11.5:10)*u;
    const w=lab.length*fs*0.95+10*u, h=fs+5*u;
    let ly=q.y-(rank===1?17:14)*u, ok=false;
    for(let t=0;t<5;t++){
      const box={x:q.x-w/2,y:ly-h/2,w,h};
      const clash=placed.some(b=>!(box.x+box.w<b.x||b.x+b.w<box.x||box.y+box.h<b.y||b.y+b.h<box.y));
      if(!clash){ placed.push(box); ok=true; break; }
      ly-=(h+3*u);
    }
    if(!ok){ if(rank>=3) return; placed.push(box); }
    s+='<rect x="'+(q.x-w/2).toFixed(1)+'" y="'+(ly-h/2).toFixed(1)+'" width="'+w.toFixed(1)+
       '" height="'+h.toFixed(1)+'" rx="'+(3*u).toFixed(1)+'" fill="#0d1712" stroke="#5c4a29" stroke-width="'+
       (0.7*u).toFixed(2)+'" opacity=".94"/>'+
       '<text x="'+q.x.toFixed(1)+'" y="'+(ly+fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+
       fs.toFixed(2)+'" fill="'+(rank===1?'#f0d99a':'#e4b969')+'"'+(rank===1?' font-weight="700"':'')+'>'+esc(lab)+'</text>';
  });
  return s+'</g>';
}

/* ============================================================
   v1.2 · 敌我控制区色块（只取用户参考图的「敌我展示方式」）
   参考：态势图用高对比双色番号牌 + 半透明色块表达控制区，地名用蓝色小字、
   高程点用白色数字、番号字号随师/旅/团/连层级递减。本作沿用这一表达方式，
   但严守 v1.1 信息不对称：只画玩家已知事实 —— 我方实际控制区，以及
   「已侦知且等级 >= 2」的敌控区；不画敌方决心、行军箭头、任务或未来位置；
   情报过时色块淡出并标注时段。形状编码（我方圆角 / 敌方切角）保持不变。
   ============================================================ */
function renderControlZones(z,u){
  if(z<1||!layerOn('zone')) return '';
  const v=visibleCells();
  let s='<g pointer-events="none">';
  /* v1.3：先算「我方控制格」与「已侦知敌格」两个集合，
     用于画未侦知地幅斜纹与我方控制区外边界；全部取自已知事实。 */
  const mineSet=new Set(), knownSet=new Set();
  for(let y=v.ay;y<v.by;y++) for(let x=v.ax;x<v.bx;x++)
    if(S.pieces.some(p=>p.alive&&!NONCOMBAT.has(p.kind)&&dist(p,{x,y})<=1)) mineSet.add(key(x,y));
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeSeen(e)) continue;
    const rp=foeReportPos(e); knownSet.add(key(rp.x,rp.y));
  }
  /* 1) 未侦知地幅：视口内既无我方控制、也无已侦知敌情的格，用极淡斜纹提示 */
  for(let y=v.ay;y<v.by;y++) for(let x=v.ax;x<v.bx;x++){
    const k=key(x,y); if(mineSet.has(k)||knownSet.has(k)) continue;
    s+='<path d="M'+(x*CW+CW*0.18).toFixed(1)+' '+(y*CH+CH*0.82).toFixed(1)+
       ' L'+(x*CW+CW*0.82).toFixed(1)+' '+(y*CH+CH*0.18).toFixed(1)+
       '" stroke="#7d9688" stroke-width="'+(0.7*u).toFixed(2)+'" opacity=".16"/>';
  }
  /* 2) 我方控制区外边界：只画与邻格不相连的四条边，形成连续控制线 */
  for(const k of mineSet){
    const a=k.split(','), x=+a[0], y=+a[1], X=x*CW, Y=y*CH;
    const seg=(x1,y1,x2,y2)=>'<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+x2.toFixed(1)+' '+y2.toFixed(1)+'"/>';
    let d='';
    if(!mineSet.has(key(x,y-1))) d+=seg(X,Y,X+CW,Y);
    if(!mineSet.has(key(x,y+1))) d+=seg(X,Y+CH,X+CW,Y+CH);
    if(!mineSet.has(key(x-1,y))) d+=seg(X,Y,X,Y+CH);
    if(!mineSet.has(key(x+1,y))) d+=seg(X+CW,Y,X+CW,Y+CH);
    if(d) s+='<g fill="none" stroke="#89e6c0" stroke-width="'+(1.7*u).toFixed(2)+
      '" opacity=".52" stroke-linecap="round">'+d+'</g>';
  }
  /* 3) 原控制区色块 */
  for(let y=v.ay;y<v.by;y++) for(let x=v.ax;x<v.bx;x++){
    const mine=mineSet.has(key(x,y));
    if(!mine) continue;
    s+='<rect x="'+(x*CW+1.2*u).toFixed(1)+'" y="'+(y*CH+1.2*u).toFixed(1)+
       '" width="'+(CW-2.4*u).toFixed(1)+'" height="'+(CH-2.4*u).toFixed(1)+
       '" fill="#57c9a0" opacity=".12" stroke="#57c9a0" stroke-width="'+(1.0*u).toFixed(2)+
       '" stroke-opacity=".30"/>';
  }
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeSighted(e)||foeLvl(e)<2) continue;
    const rp=foeReportPos(e), fade=clamp(1-(rp.stale||0)*0.22,0.35,1);
    if(rp.x<v.ax||rp.x>=v.bx||rp.y<v.ay||rp.y>=v.by) continue;
    s+='<rect x="'+(rp.x*CW+3*u).toFixed(1)+'" y="'+(rp.y*CH+3*u).toFixed(1)+
       '" width="'+(CW-6*u).toFixed(1)+'" height="'+(CH-6*u).toFixed(1)+
       '" rx="'+(3*u).toFixed(1)+'" fill="#f0937f" opacity="'+(0.17*fade).toFixed(2)+
       '" stroke="#f0937f" stroke-width="'+(1.4*u).toFixed(2)+'" stroke-opacity="'+(0.55*fade).toFixed(2)+
       '" stroke-dasharray="'+(5*u).toFixed(1)+' '+(3*u).toFixed(1)+'"/>';
    if(z>=2)
      s+='<text x="'+((rp.x+0.5)*CW).toFixed(1)+'" y="'+(rp.y*CH+12*u).toFixed(1)+
         '" text-anchor="middle" font-size="'+(8.5*u).toFixed(2)+'" fill="#f5b7a8" opacity=".9">已侦知敌控区'+
         (rp.stale?'（情报 '+rp.stale+' 时段前）':'')+'</text>';
  }
  return s+'</g>';
}

/* ============================================================
   v1.3 · 分级阵地与接触带
   阵地是「面状事实」：地域框随比例尺真实缩放，符号 / 线宽 / 字号乘 u 恒定。
   全部取自实时状态（S.pieces[].entrench、S.subs[].entrench、S.prep 等），不臆造阵地；
   敌方只在「已侦知」位置画模糊阵地框，绝不标工事等级 / 任务 / 决心。
   ============================================================ */
const POS_Z = ['师级不标','团防御地域','营支撑点','连 / 班阵地'];
const POS_COL = {reg:'#89e6c0',btn:'#8fc4d8',coy:'#c2d68a',sqd:'#a9c47a',
                 fire:'#e4b969',obs:'#8fc4d8',foe:'#f0937f'};
function posRect(cx,cy,w,h,col,u,op,dash){
  return '<rect x="'+(cx-w/2).toFixed(1)+'" y="'+(cy-h/2).toFixed(1)+
    '" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+(3*u).toFixed(1)+
    '" fill="'+col+'" fill-opacity=".055" stroke="'+col+'" stroke-width="'+(1.5*u).toFixed(2)+
    '" opacity="'+op.toFixed(2)+'"'+(dash?' stroke-dasharray="'+(6*u).toFixed(1)+' '+(3*u).toFixed(1)+'"':'')+'/>';
}
/* 工事等级 0–3：三根短齿，实心齿数即等级（读 S.pieces / S.subs 的 entrench） */
function posWorks(lv,cx,cy,u,col){
  let s='';
  for(let i=0;i<3;i++)
    s+='<path d="M'+(cx+i*4.2*u).toFixed(1)+' '+cy.toFixed(1)+' v'+(i<lv?-4.5*u:-1.4*u).toFixed(1)+
       '" stroke="'+col+'" stroke-width="'+(1.5*u).toFixed(2)+'" opacity="'+(i<lv?'.9':'.28')+'"/>';
  return s;
}
/* 接触带：把同一行内我方最前格与已侦知敌格之间的分界连成折线 */
function renderFrontLine(z,u){
  if(z<1||!layerOn('front')) return '';
  /* 先按全图逐行算分界（我方单位常在视口外），再把落在视口内的点连成折线 */
  const b=visibleBox(), pts=[];
  for(let y=0;y<H;y++){
    let mx=-1, fx=Infinity;
    for(let x=0;x<W;x++)
      if(S.pieces.some(p=>p.alive&&p.kind==='regiment'&&p.x===x&&p.y===y)) mx=Math.max(mx,x);
    for(const e of S.enemies){
      if(!e.alive||!e.active||!foeSeen(e)) continue;
      const rp=foeReportPos(e); if(rp.y===y) fx=Math.min(fx,rp.x);
    }
    if(mx>=0&&fx!==Infinity&&mx<fx){
      const cx=((mx+fx)/2+0.5)*CW, cy=(y+0.5)*CH;
      if(cx>=b.x-20*u&&cx<=b.x+b.w+20*u&&cy>=b.y-20*u&&cy<=b.y+b.h+20*u) pts.push({x:cx,y:cy});
    }
  }
  if(!pts.length) return '';
  let d='M'+pts[0].x.toFixed(1)+' '+pts[0].y.toFixed(1);
  for(let i=1;i<pts.length;i++) d+=' L'+pts[i].x.toFixed(1)+' '+pts[i].y.toFixed(1);
  let s='<g pointer-events="none"><path d="'+d+'" fill="none" stroke="#e4b969" stroke-width="'+
    (2.2*u).toFixed(2)+'" stroke-dasharray="'+(7*u).toFixed(1)+' '+(4*u).toFixed(1)+
    '" opacity=".66" stroke-linejoin="round"/>';
  for(let i=0;i<pts.length;i++)
    s+='<path d="M'+pts[i].x.toFixed(1)+' '+(pts[i].y-3.5*u).toFixed(1)+' L'+(pts[i].x+3.5*u).toFixed(1)+' '+
       pts[i].y.toFixed(1)+' L'+pts[i].x.toFixed(1)+' '+(pts[i].y+3.5*u).toFixed(1)+' L'+
       (pts[i].x-3.5*u).toFixed(1)+' '+pts[i].y.toFixed(1)+' Z" fill="#e4b969" opacity=".72"/>';
  const mid=pts[Math.floor(pts.length/2)];
  s+=fxLabel(mid.x,mid.y,'接触带',u,'#e4b969',-8);
  return s+'</g>';
}
function renderPositions(z,u){
  if(z<1||!layerOn('position')||fxIsReplay()) return '';
  let s='<g pointer-events="none">';
  /* A · 团级：防御地域 + 工事等级 */
  if(z===1) for(const p of S.pieces){
    if(!p.alive||p.kind!=='regiment') continue;
    const q=fxC(p.x,p.y);
    if(!fxInView(q.cx,q.cy,u,CW)) continue;
    s+=posRect(q.cx,q.cy,CW*0.88,CH*0.88,POS_COL.reg,u,.62,true);
    s+=posWorks(p.entrench||0,q.cx-CW*0.30,q.cy+CH*0.30,u,POS_COL.reg);
    s+=fxLabel(q.cx,q.cy-CH*0.30,'团防御地域 · 工事 '+(p.entrench||0)+' 级',u,POS_COL.reg,-2);
  }
  /* B · 直属火力阵地 / 观察所 */
  if(z>=1) for(const p of S.pieces){
    if(!p.alive||p.kind==='regiment') continue;
    const kind=p.kind==='arty'?'fire':p.kind==='recon'?'obs':null;
    if(!kind) continue;
    const q=fxC(p.x,p.y);
    if(!fxInView(q.cx,q.cy,u,20)) continue;
    const a=6.5*u, col=POS_COL[kind];
    s+='<path d="M'+(q.cx-a).toFixed(1)+' '+(q.cy+a*0.6).toFixed(1)+' L'+q.cx.toFixed(1)+' '+
       (q.cy-a).toFixed(1)+' L'+(q.cx+a).toFixed(1)+' '+(q.cy+a*0.6).toFixed(1)+
       ' Z" fill="'+col+'" fill-opacity=".18" stroke="'+col+'" stroke-width="'+(1.2*u).toFixed(2)+'"/>';
    if(z>=2) s+=fxLabel(q.cx,q.cy+a+4*u,kind==='fire'?'炮兵阵地':'侦察观察所',u,col,4);
  }
  /* C · 营支撑点 / 连阵地带与射界 / 班阵地 */
  if(z>=2) for(const id in S.subs){
    const q=S.subs[id];
    if(!q.alive||!q.placed||q.detached) continue;
    const w=subPos(q);
    if(!w||!fxInView(w.cx,w.cy,u,14)) continue;
    if(q.level==='battalion'){
      const sw=CW/SUB, sh=CH/SUB;
      s+=posRect(w.cx,w.cy,sw*0.86,sh*0.86,POS_COL.btn,u,.58,true);
      s+=posWorks(q.entrench||0,w.cx-sw*0.28,w.cy+sh*0.28,u,POS_COL.btn);
      if(z===2) s+=fxLabel(w.cx,w.cy-sh*0.34,'营支撑点 · 工事 '+(q.entrench||0)+' 级',u,POS_COL.btn,-2);
    }else if(q.level==='company'&&z>=3){
      const sw=CW/SUB/SUB, sh=CH/SUB/SUB;
      s+=posRect(w.cx,w.cy,sw*0.82,sh*0.82,POS_COL.coy,u,.55,false);
      const foe=nearestEnemyTo(Math.floor(w.cx/CW),Math.floor(w.cy/CH));
      if(foe&&foeSighted(foe)){
        const rp=foeReportPos(foe), fq=fxC(rp.x,rp.y);
        const ang=Math.atan2(fq.cy-w.cy,fq.cx-w.cx);
        const L=Math.min(CW/SUB*0.85,Math.max(6*u,Math.hypot(fq.cx-w.cx,fq.cy-w.cy)));
        const a1=ang-0.30,a2=ang+0.30;
        s+='<path d="M'+w.cx.toFixed(1)+' '+w.cy.toFixed(1)+' L'+(w.cx+L*Math.cos(a1)).toFixed(1)+' '+
           (w.cy+L*Math.sin(a1)).toFixed(1)+' A'+L.toFixed(1)+' '+L.toFixed(1)+' 0 0 1 '+
           (w.cx+L*Math.cos(a2)).toFixed(1)+' '+(w.cy+L*Math.sin(a2)).toFixed(1)+
           ' Z" fill="'+POS_COL.coy+'" opacity=".07"/>';
      }
    }else if(q.level==='squad'&&z>=3){
      const a=3.4*u;
      s+='<path d="M'+w.cx.toFixed(1)+' '+(w.cy-a).toFixed(1)+' L'+(w.cx+a).toFixed(1)+' '+w.cy.toFixed(1)+
         ' L'+w.cx.toFixed(1)+' '+(w.cy+a).toFixed(1)+' L'+(w.cx-a).toFixed(1)+' '+w.cy.toFixed(1)+
         ' Z" fill="none" stroke="'+POS_COL.sqd+'" stroke-width="'+(1.1*u).toFixed(2)+'" opacity=".78"/>';
    }
  }
  /* D · 交通壕：同团相邻营支撑点之间的折线（营 / 连级） */
  if(z>=2) for(const id in S.subs){
    const a=S.subs[id];
    if(a.level!=='battalion'||!a.alive||!a.placed) continue;
    for(const id2 in S.subs){
      const c=S.subs[id2];
      if(id2<=id||c.level!=='battalion'||!c.alive||!c.placed||c.parent!==a.parent) continue;
      const p=subPos(a), q=subPos(c);
      if(!p||!q||Math.hypot(p.cx-q.cx,p.cy-q.cy)>CW*0.85) continue;
      s+='<path d="M'+p.cx.toFixed(1)+' '+p.cy.toFixed(1)+' L'+(p.cx+(q.cx-p.cx)*0.35).toFixed(1)+' '+
         (p.cy+(q.cy-p.cy)*0.35+3*u).toFixed(1)+' L'+(p.cx+(q.cx-p.cx)*0.65).toFixed(1)+' '+
         (p.cy+(q.cy-p.cy)*0.65-3*u).toFixed(1)+' L'+q.cx.toFixed(1)+' '+q.cy.toFixed(1)+
         '" fill="none" stroke="#c2d68a" stroke-width="'+(1.1*u).toFixed(2)+'" opacity=".30" stroke-dasharray="'+
         (3*u).toFixed(1)+' '+(2*u).toFixed(1)+'"/>';
    }
  }
  /* E · 敌方：只在已侦知位置画模糊阵地框，不标工事等级 / 任务 / 决心 */
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeSeen(e)) continue;
    const rp=foeReportPos(e), q=fxC(rp.x,rp.y);
    if(!fxInView(q.cx,q.cy,u,CW)) continue;
    const fade=clamp(1-(rp.stale||0)*0.2,0.4,1);
    s+=posRect(q.cx,q.cy,CW*0.72,CH*0.72,POS_COL.foe,u,0.52*fade,true);
    if(z>=2) s+=fxLabel(q.cx,q.cy+CH*0.30,'已侦知敌阵地',u,POS_COL.foe,2);
  }
  return s+'</g>';
}

/* 分级兵要地志注记：四色图式 + 高程点 + 标签避让 + 密度上限 */
const CARTO_SYM = {town:'square',peak:'tri',height:'diamond',relief:'dash',
                   river:'wave',road:'bridge',field:'fort',wood:'tree'};
function renderCartography(gk,z,u){
  if(z<1||!layerOn('carto')) return '';
  const g=GEO[gk], b=visibleBox(), pad=34*u, placed=[], used=new Set();
  const cand=cartoVisible(gk,z)
    .map(o=>({o,q:geoXY(g,o.lon,o.lat)}))
    .filter(v=>v.q.x>=b.x-pad&&v.q.x<=b.x+b.w+pad&&v.q.y>=b.y-pad&&v.q.y<=b.y+b.h+pad)
    .sort((a,b)=>cartoRank(b.o)-cartoRank(a.o));
  const cap=z===1?16:z===2?20:18;
  let s='<g pointer-events="none">', drawn=0;
  for(const ent of cand){
    const o=ent.o, q=ent.q, K=CARTO_KIND[o.t]||CARTO_KIND.town;
    const a=(o.t==='height'?7.2:o.t==='peak'?6.4:5.2)*u;
    const fs=(o.lv===1?12:o.lv===2?10.5:9.5)*u;
    s+=featureSymbol(CARTO_SYM[o.t]||'square',q.x,q.y,a,K.c);
    /* 高程点：白色数字，字头朝北（参考态势图 330 / 285 / 540 的写法） */
    if(o.e!==undefined)
      s+='<text x="'+(q.x+a+1.5*u).toFixed(1)+'" y="'+(q.y-a*0.35).toFixed(1)+
         '" font-size="'+(9*u).toFixed(2)+'" fill="#ffffff" opacity=".94" font-weight="600">'+o.e+'</text>';
    const lab=o.n, w=lab.length*fs*0.90+10*u, h=fs+4*u;
    let ly=q.y+a+6*u, ok=false;
    for(let t=0;t<4;t++){
      const box={x:q.x-w/2,y:ly-h/2,w,h};
      const clash=placed.some(p=>!(box.x+box.w<p.x||p.x+p.w<box.x||box.y+box.h<p.y||p.y+p.h<box.y));
      if(!clash){ placed.push(box); ok=true; break; }
      ly+=h+2*u;
    }
    if(!ok||drawn>=cap) continue;      /* 挤不下时只保留符号与高程点 */
    const k=key(Math.round(q.x/(CW/3)),Math.round(q.y/(CH/3)));
    if(used.has(k)) continue;
    used.add(k); drawn++;
    s+='<rect x="'+(q.x-w/2).toFixed(1)+'" y="'+(ly-h/2).toFixed(1)+'" width="'+w.toFixed(1)+
       '" height="'+h.toFixed(1)+'" rx="'+(2*u).toFixed(1)+'" fill="#0d1712" opacity=".88" stroke="'+
       K.c+'" stroke-width="'+(0.6*u).toFixed(2)+'" stroke-opacity=".55"/>'+
       '<text x="'+q.x.toFixed(1)+'" y="'+(ly+fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+
       fs.toFixed(2)+'" fill="'+K.c+'"'+(o.t==='river'?' font-style="italic"':'')+'>'+esc(lab)+'</text>';
  }
  if(z>=3) s+=renderReliefNotes(gk,u,placed);
  return s+'</g>';
}
/* 连级：由插值高程场派生地貌部位（山顶/鞍部/脊/谷/陡坡）。
   明确为判读结果，非实测微地貌；不含任何敌情信息。 */
function reliefAt(gk,wx,wy){
  /* 采样半径约 1 个子格（6 世界单位 ≈ 0.6–1 km），与连级地幅相称；
     用邻域高差归一化判定，避免不同战区绝对高差导致的误判。 */
  const d=6, e=(fx,fy)=>elevAtGrid(gk,(wx+fx*d)/CW,(wy+fy*d)/CH);
  const c=e(0,0), n=e(0,-1), so=e(0,1), we=e(-1,0), ea=e(1,0);
  const hi=Math.max(n,so,we,ea), lo=Math.min(n,so,we,ea), amp=hi-lo;
  const grad=Math.hypot(ea-we,so-n), top=c>=hi-0.5, bottom=c<=lo+0.5;
  if(amp<4) return {n:'缓坡 / 平地',c:'#a9c0b3'};
  if(top&&Math.abs((n+so)-(we+ea))>amp*0.6) return {n:'鞍部',c:'#c2a878'};
  if(top) return {n:'山顶 / 崮顶',c:'#d8b98a'};
  if(bottom) return {n:'谷地 / 冲沟',c:'#8fc9e8'};
  /* 只有约 0.7 km 内高差 > 38 m 才判为陡坡 / 崮壁，避免普通斜坡被误标 */
  if(grad>amp*0.8 && amp>38) return {n:'陡坡 / 崮壁',c:'#c98d6a'};
  if(grad>amp*0.3) return {n:'山脊 / 斜坡',c:'#c2a878'};
  return {n:'缓坡 / 平地',c:'#a9c0b3'};
}
function renderReliefNotes(gk,u,placed){
  const v=visibleCells(), b=visibleBox(), fs=8.5*u;
  let s='', n=0;
  for(let y=v.ay;y<v.by&&n<9;y++) for(let x=v.ax;x<v.bx&&n<9;x++)
    for(let sy=0;sy<SUB&&n<9;sy++) for(let sx=0;sx<SUB&&n<9;sx++){
      const w=subWorld(x,y,sx,sy);
      if(w.cx<b.x||w.cx>b.x+b.w||w.cy<b.y||w.cy>b.y+b.h) continue;
      const r=reliefAt(gk,w.cx,w.cy), box={x:w.cx-30*u,y:w.cy+8*u,w:60*u,h:fs+4*u};
      if(placed.some(p=>!(box.x+box.w<p.x||p.x+p.w<box.x||box.y+box.h<p.y||p.y+p.h<box.y))) continue;
      placed.push(box); n++;
      s+='<text x="'+w.cx.toFixed(1)+'" y="'+(w.cy+8*u+fs).toFixed(1)+'" text-anchor="middle" font-size="'+
         fs.toFixed(2)+'" fill="'+r.c+'" opacity=".80">'+r.n+'</text>';
    }
  return s;
}

/* 要点符号：全部用 path / rect / circle / line，避免引入立体多边形 */
function featureSymbol(kind,cx,cy,a,col){
  switch(kind){
    case 'tri': return '<path d="M'+cx+' '+(cy-a)+' L'+(cx+a)+' '+(cy+a)+' L'+(cx-a)+' '+(cy+a)+
      ' Z" fill="'+col+'" stroke="#0d1712" stroke-width="0.8"/>';
    case 'bridge': return '<rect x="'+(cx-a)+'" y="'+(cy-a*0.55)+'" width="'+(2*a)+'" height="'+(a*1.1)+
      '" fill="#0d1712" stroke="'+col+'" stroke-width="1.2"/><path d="M'+(cx-a*0.4)+' '+(cy-a*0.55)+
      ' V'+(cy+a*0.55)+' M'+(cx+a*0.4)+' '+(cy-a*0.55)+' V'+(cy+a*0.55)+'" stroke="'+col+'" stroke-width="1"/>';
    case 'ford': return '<path d="M'+(cx-a)+' '+(cy-a*0.4)+' Q'+cx+' '+(cy-a)+' '+(cx+a)+' '+(cy-a*0.4)+
      ' M'+(cx-a)+' '+(cy+a*0.35)+' Q'+cx+' '+(cy-a*0.15)+' '+(cx+a)+' '+(cy+a*0.35)+
      '" fill="none" stroke="'+col+'" stroke-width="1.6"/>';
    case 'square': return '<rect x="'+(cx-a*0.8)+'" y="'+(cy-a*0.8)+'" width="'+(a*1.6)+'" height="'+
      (a*1.6)+'" fill="'+col+'" stroke="#0d1712" stroke-width="0.8"/>';
    case 'fort': return '<path d="M'+(cx-a)+' '+(cy+a*0.7)+' V'+(cy-a*0.4)+' H'+(cx-a*0.45)+
      ' V'+(cy-a*0.85)+' H'+(cx+a*0.45)+' V'+(cy-a*0.4)+' H'+(cx+a)+' V'+(cy+a*0.7)+
      ' Z" fill="'+col+'" stroke="#0d1712" stroke-width="0.8"/>';
    case 'arrow': return '<path d="M'+(cx-a)+' '+(cy+a)+' L'+(cx+a*0.8)+' '+(cy-a*0.8)+' M'+
      (cx-a*0.1)+' '+(cy-a*0.9)+' H'+(cx+a*0.85)+' V'+(cy-a*0.05)+
      '" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round"/>';
    case 'dash': return '<path d="M'+(cx-a)+' '+(cy-a*0.3)+' H'+(cx+a)+' M'+(cx-a*0.6)+' '+(cy+a*0.45)+
      ' H'+(cx+a*0.6)+'" stroke="'+col+'" stroke-width="1.5"/>';
    case 'diamond': return '<path d="M'+cx+' '+(cy-a)+' L'+(cx+a)+' '+cy+' L'+cx+' '+(cy+a)+' L'+
      (cx-a)+' '+cy+' Z" fill="'+col+'" stroke="#0d1712" stroke-width="0.8"/>';
    case 'tree': return '<circle cx="'+cx+'" cy="'+(cy-a*0.3)+'" r="'+a*0.7+'" fill="'+col+'"/>'+
      '<path d="M'+cx+' '+(cy+a*0.4)+' V'+(cy+a)+'" stroke="'+col+'" stroke-width="1.4"/>';
    case 'wave': return '<path d="M'+(cx-a)+' '+cy+' Q'+(cx-a*0.5)+' '+(cy-a*0.6)+' '+cx+' '+cy+
      ' T'+(cx+a)+' '+cy+'" fill="none" stroke="'+col+'" stroke-width="1.6"/>';
    default: return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(a*0.6)+'" fill="'+col+'"/>';
  }
}
function renderFeatures(gk,z,u){
  const b=visibleBox(), pad=40*u;

  featureCells(gk).forEach(o=>{
    const f=o.f, q=subWorld(o.x,o.y,o.sx,o.sy);

      const fs=(z>=2?13*u:11*u), w=f.n.length*fs*0.95+8*u;

         '" height="'+(fs+4*u).toFixed(1)+'" rx="2" fill="#0d1712" opacity=".82"/>'+
         '<text x="'+q.cx.toFixed(1)+'" y="'+(q.cy+a+2*u+fs*0.9).toFixed(1)+'" text-anchor="middle" font-size="'+
         fs.toFixed(2)+'" fill="'+K.c+'">'+esc(f.n)+'</text>';

/* 部队标号：尺寸乘 u，屏幕恒定；Z2/Z3 叠加已部署下级单位 */
/* ============================================================
   v0.7 · 敌我双方单位标号牌（清晰可读的态势显示）
   设计要点：
   1) 形状编码阵营：我方圆角矩形、敌方切角八边形，色盲亦可辨；
   2) 尺寸编码层级：团 / 营 / 连 / 班递减，但基准按目标屏幕像素反算，
      随 u=1/k 缩放保持屏幕恒定，且明显大于 v0.6 的小圆点；
   3) 每牌两行：番号 + 兵力 / 任务，深色底板保证在晕渲上可读；
   4) 敌方按同一三三制解聚，兵力守恒，使团级 / 营连级敌我态势对称。

/* 世界尺寸 = 目标屏幕 px / 1.12 × u；数值已折算为 ×u 的系数 */
const BADGE = {
  regiment:    {w:59.0,h:28.6,f1:13,f2:10,rx:3},
  battalion:   {w:51.8,h:25.0,f1:12,f2:9.5,rx:3},
  company:     {w:44.6,h:23.2,f1:11,f2:9,  rx:3},
  squad:       {w:30.4,h:17.9,f1:10,f2:0,  rx:2},
  foe:         {w:59.0,h:28.6,f1:13,f2:10,rx:3},
  foeBattalion:{w:51.8,h:25.0,f1:12,f2:9.5,rx:3},
  foeCompany:  {w:44.6,h:23.2,f1:11,f2:9,  rx:3},
  support:     {w:40.0,h:20.0,f1:10,f2:8,  rx:2}
};
const REG_COLOR=['#57c9a0','#8fc4d8','#e4b969','#c2d68a','#d8b39a'];
const OUR_FRAME='#89e6c0', OUR_BG='#0c241b', OUR_TX='#eafff3';
const FOE_FRAME='#f0937f', FOE_BG='#2a1512', FOE_TX='#ffe7e2';

function badgePath(x,y,w,h,c){
  return 'M'+(x+c)+' '+y+' L'+(x+w-c)+' '+y+' L'+(x+w)+' '+(y+c)+
    ' L'+(x+w)+' '+(y+h-c)+' L'+(x+w-c)+' '+(y+h)+' L'+(x+c)+' '+(y+h)+
    ' L'+x+' '+(y+h-c)+' L'+x+' '+(y+c)+' Z';
}
/* 统一标号牌：o = {cx,cy,u,level,foe,color,label,sub,selected,dead,compact} */
function unitBadge(o){
  const B=BADGE[o.level]||BADGE.battalion, u=o.u;
  const sc=o.compact?0.72:1;
  const w=B.w*sc*u, h=B.h*sc*u, c=(o.foe?4:3)*u;
  /* 营连级视口很小：把边缘的牌钳制到视口内并画引线，避免半截牌看不清 */
  let cx=o.cx, cy=o.cy, lead='';
  if(S && S.view && S.view.z>=2){
    const bx=visibleBox(), hw=w/2+2*u, hh=h/2+2*u;
    const nx=clamp(cx,bx.x+hw,bx.x+bx.w-hw), ny=clamp(cy,bx.y+hh,bx.y+bx.h-hh);
    const frame0=o.foe?FOE_FRAME:OUR_FRAME;
    if(Math.abs(nx-cx)+Math.abs(ny-cy)>0.5*u)
      lead='<path d="M'+cx.toFixed(1)+' '+cy.toFixed(1)+' L'+nx.toFixed(1)+' '+ny.toFixed(1)+
        '" fill="none" stroke="'+frame0+'" stroke-width="'+(0.9*u).toFixed(2)+
        '" stroke-dasharray="'+(2*u).toFixed(1)+' '+(2*u).toFixed(1)+'" opacity=".65"/>';
    cx=nx; cy=ny;
  }
  const x=cx-w/2, y=cy-h/2;
  const frame=o.foe?FOE_FRAME:OUR_FRAME, bg=o.foe?FOE_BG:OUR_BG, tx=o.foe?FOE_TX:OUR_TX;
  const stripe=o.color||frame;
  let s='<g pointer-events="none"'+(o.dead?' opacity=".42"':'')+'>'+lead;
  if(o.selected){
    const pad=3.4*u;
    s+=o.foe?
      '<path d="'+badgePath(x-pad,y-pad,w+2*pad,h+2*pad,c)+'" fill="none" stroke="#ffffff" stroke-width="'+(2.2*u).toFixed(2)+'" opacity=".92"/>':
      '<rect x="'+(x-pad).toFixed(1)+'" y="'+(y-pad).toFixed(1)+'" width="'+(w+2*pad).toFixed(1)+
      '" height="'+(h+2*pad).toFixed(1)+'" rx="'+(B.rx*u+pad).toFixed(1)+'" fill="none" stroke="#ffffff" stroke-width="'+(2.2*u).toFixed(2)+'" opacity=".92"/>';
  }
  s+=o.foe?
    '<path d="'+badgePath(x,y,w,h,c)+'" fill="'+bg+'" stroke="'+frame+'" stroke-width="'+((o.selected?2.4:1.8)*u).toFixed(2)+'"/>':
    '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+
    '" rx="'+(B.rx*u).toFixed(1)+'" fill="'+bg+'" stroke="'+frame+'" stroke-width="'+((o.selected?2.4:1.8)*u).toFixed(2)+'"/>';
  s+='<rect x="'+x.toFixed(1)+'" y="'+(y+2*u).toFixed(1)+'" width="'+(3.2*u).toFixed(1)+
     '" height="'+(h-4*u).toFixed(1)+'" fill="'+stripe+'" opacity=".95"/>';
  const f1=B.f1*sc*u, f2=B.f2*sc*u;
  const y1=f2>0?(cy-1.6*sc*u):(cy+f1*0.34);
  s+='<text x="'+(cx+1.2*u).toFixed(1)+'" y="'+y1.toFixed(1)+'" text-anchor="middle" font-size="'+
     f1.toFixed(2)+'" fill="'+tx+'" font-weight="500">'+esc(o.label)+'</text>';
  if(f2>0&&o.sub) s+='<text x="'+(cx+1.2*u).toFixed(1)+'" y="'+(y+h/2-3.2*sc*u).toFixed(1)+
     '" text-anchor="middle" font-size="'+f2.toFixed(2)+'" fill="'+stripe+'">'+esc(o.sub)+'</text>';
  if(o.corner){
    const sz=8.4*u, px=x+w-sz-1.2*u, py=y+1.2*u;
    s+='<rect x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" width="'+sz.toFixed(1)+'" height="'+sz.toFixed(1)+
       '" rx="'+(1.2*u).toFixed(1)+'" fill="'+(o.cornerColor||frame)+'" stroke="'+bg+'" stroke-width="'+(0.8*u).toFixed(2)+'"/>'+
       '<text x="'+(px+sz/2).toFixed(1)+'" y="'+(py+sz*0.76).toFixed(1)+'" text-anchor="middle" font-size="'+
       (6.4*u).toFixed(2)+'" fill="#0d1712" font-weight="500">'+esc(o.corner)+'</text>';
  }
  if(o.dead) s+='<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+' L'+(x+w).toFixed(1)+' '+(y+h).toFixed(1)+
     '" stroke="#dc6d60" stroke-width="'+(2*u).toFixed(2)+'"/>';
  return s+'</g>';
}

/* ---------- 敌方解聚：与我方同样的三三制与兵力守恒 ---------- */
const FOE_FORM=[{sx:0,sy:2},{sx:2,sy:2},{sx:1,sy:0}];
function buildFoeSubs(){
  for(const e of S.enemies){
    const bm=splitMen(e.men,3);
    e.foeSubs=[]; e.foeAnchor={x:e.x,y:e.y};
    for(let b=1;b<=3;b++){
      const f=FOE_FORM[b-1], cm=splitMen(bm[b-1],3), comps=[];
      for(let c=1;c<=3;c++){
        const cf=C_FORM[c-1];
        const fc={id:e.id+'-b'+b+'-c'+c, name:'敌 '+c+' 连', level:'foeCompany',
          host:e.id, parent:e.id+'-b'+b, men:cm[c-1], men0:cm[c-1], equip:e.equip,
          alive:true, placed:{x:e.x,y:e.y,sx:f.sx,sy:f.sy,mx:cf.mx,my:cf.my}};
        comps.push(fc); S.foeSubs[fc.id]=fc;
      }
      const fb={id:e.id+'-b'+b, name:'敌 '+b+' 营', level:'foeBattalion',
        host:e.id, parent:e.id, men:bm[b-1], men0:bm[b-1], equip:e.equip,
        alive:true, placed:{x:e.x,y:e.y,sx:f.sx,sy:f.sy}, comps};
      e.foeSubs.push(fb); S.foeSubs[fb.id]=fb;
    }
  }
}
function syncFoePositions(){
  for(const e of S.enemies){
    const a=e.foeAnchor||{x:e.x,y:e.y}, dx=e.x-a.x, dy=e.y-a.y;
    if(dx||dy){
      const shift=(n)=>{ if(!n.placed) return;
        n.placed.x=clamp(n.placed.x+dx,0,W-1); n.placed.y=clamp(n.placed.y+dy,0,H-1); };
      for(const b of e.foeSubs||[]){ shift(b); for(const c of b.comps) shift(c); }
    }
    e.foeAnchor={x:e.x,y:e.y};
  }
}
function applyFoeLoss(e,loss){
  const actual=Math.min(Math.max(0,loss),e.men);
  e.men-=actual;
  const bs=(e.foeSubs||[]).filter(b=>b.men>0);
  if(!bs.length) return;
  const pool=Math.min(actual,bs.reduce((a,b)=>a+b.men,0));
  const parts=apportion(bs,pool,b=>Math.max(1,b.men));
  bs.forEach((b,i)=>{
    const l=Math.min(b.men,parts[i]); b.men-=l;
    const cs=b.comps.filter(c=>c.men>0);
    if(cs.length){
      const ps=apportion(cs,Math.min(l,cs.reduce((a,c)=>a+c.men,0)),c=>Math.max(1,c.men));
      cs.forEach((c,j)=>{ c.men-=Math.min(c.men,ps[j]); if(c.men<=0)c.alive=false; });
    }
    if(b.men<=0) b.alive=false;
  });
}
function foeBookOK(e){
  const bs=e.foeSubs||[];
  if(bs.reduce((a,b)=>a+b.men,0)!==e.men) return false;
  return bs.every(b=>b.comps.reduce((a,c)=>a+c.men,0)===b.men);
}
function foeShortName(e){ return e.name.replace(/[（(].*$/,'').slice(0,5); }

/* ---------- 团 / 师直属 / 敌方主单位 ---------- */
function renderUnits(z,u){
  const vb=visibleBox();
  let s='';
  const marks=new Map();
  const push=mk=>{ const k=key(mk.x,mk.y); if(!marks.has(k))marks.set(k,[]); marks.get(k).push(mk); };
  for(const p of S.pieces){
    if(!p.alive) continue;
    if(z>=1 && p.kind!=='regiment') continue;
    push({x:p.x,y:p.y,foe:false,level:p.kind==='regiment'?'regiment':'support',
      color:p.kind==='regiment'?'#57c9a0':'#4d94c4',

  /* v1.1：敌方主棋子按侦知等级显示；未侦知完全不画，概略用最后确认位置 */
  for(const e of S.enemies){

      label:lvl>=3?foeShortName(e):'敌 ? 部',

  for(const [k,arr] of marks){

        if(cx<vb.x-4*u||cx>vb.x+vb.w+4*u||cy<vb.y-4*u||cy>vb.y+vb.h+4*u) return;
        s+=unitBadge({cx,cy,u,level:mk.level,foe:mk.foe,color:mk.color,
          label:mk.label.slice(0,3),sub:'',selected:mk.selected,dead:false,compact:true});
      });
    }else{
      arr.slice(0,4).forEach((mk,i)=>{
        const B=BADGE[mk.level], h=B.h*u;
        const cx=(a[0]+0.5)*CW+(arr.length>1?(i%2===0?-13:13)*u:0);
        const cy=(a[1]+0.5)*CH+(i-(Math.min(arr.length,4)-1)/2)*h*1.12;
        s+=unitBadge({cx,cy,u,level:mk.level,foe:mk.foe,color:mk.color,
          label:mk.label,sub:mk.sub,selected:mk.selected,dead:false});
      });
      if(arr.length>4) s+='<text x="'+((a[0]+0.5)*CW).toFixed(1)+'" y="'+((a[1]+0.5)*CH+30*u).toFixed(1)+
        '" text-anchor="middle" font-size="'+(10*u).toFixed(2)+'" fill="#e4b969" pointer-events="none">+'+(arr.length-4)+' 队</text>';
    }
  }
  return s;
}

function foeFocus(){
  const b=visibleBox();
  let best=null,bd=1e9;
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeExact(e)) continue;   // 未确认敌不展开下级标号
    for(const fb of e.foeSubs||[]){
      if(!fb.alive||!fb.placed) continue;
      const w=subWorld(fb.placed.x,fb.placed.y,fb.placed.sx,fb.placed.sy);
      const d=Math.abs(w.cx-(b.x+b.w/2))+Math.abs(w.cy-(b.y+b.h/2));
      if(d<bd){bd=d;best=fb;}
    }
  }
  return best?best.id:null;
}

function renderFoeUnits(z,u){
  if(z===0) return '';
  const b=visibleBox(), pad=(z>=2?6*u:34*u), focus=foeFocus();

            corner:String(e.id.replace(/\D/g,'')||'1'),cornerColor:'#f0937f'});

  return s;

/* 局部高程重采样：Z2/Z3 视口小，若沿用全战区 60×36 色块会被拉成一整片纯色。
   按同一插值网格在可见范围重采样，并用局部高程范围拉伸色阶，恢复层次。
   注意：不新增实测点，只是显示层的重采样与局部归一化。 */
function localHypsometric(gk,z){
  const b=visibleBox(), step=z>=2?1.6:3.0;
  const A=ELEVATION.areas[gk], pts=[];
  let lo=Infinity, hi=-Infinity;
  for(let y=b.y;y<=b.y+b.h+0.01;y+=step){
    const row=[];
    for(let x=b.x;x<=b.x+b.w+0.01;x+=step){
      const wx=Math.min(VW,x), wy=Math.min(VH,y);
      const e=elevAtGrid(gk,wx/CW,wy/CH);
      row.push(e); if(e<lo)lo=e; if(e>hi)hi=e;
    }
    pts.push(row);
  }
  const localSpan=Math.max(1,hi-lo);
  const pad=Math.max(3,localSpan*0.22);
  const low=lo-pad, span=Math.max(10,localSpan+pad*2);
  let out='<g pointer-events="none">';
  for(let j=0;j<pts.length-1;j++) for(let i=0;i<pts[j].length-1;i++){
    const e=(pts[j][i]+pts[j][i+1]+pts[j+1][i]+pts[j+1][i+1])/4;
    const x=b.x+i*step, y=b.y+j*step;
    out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(step+0.15).toFixed(2)+
         '" height="'+(step+0.15).toFixed(2)+'" fill="'+hypsColor((e-low)/span)+'"/>';
  }
  return out+'</g>';
}
/* 局部加密等高线：层级由当前视口真实高程范围派生，间隔按级别细化，线段裁剪到视口 */
function localContourLevels(gk,z){
  const A=ELEVATION.areas[gk], b=visibleBox();
  let lo=Infinity, hi=-Infinity;
  for(let j=0;j<=4;j++) for(let i=0;i<=4;i++){
    const e=elevAtGrid(gk,(b.x+b.w*i/4)/CW,(b.y+b.h*j/4)/CH);
    if(e<lo)lo=e; if(e>hi)hi=e;
  }
  /* v1.2 分级等高距：军用规范 1:5万 10m / 1:2.5万 5m / 1:1万 2.5m。
     本作高程只有 96 个 ASTER 控制点插值到 60×36 网格，不是完整 DEM，
     故实际可辨间隔退让为 20 / 10 / 5 m，仅作制图分级密度，不代表实测精度。 */
  const demoStep=z>=3?5:z===2?10:20;
  const step=Math.max(demoStep,Math.round(A.contourStep/(z>=3?20:z>=2?10:5)));
  const out=[];
  for(let v=Math.ceil((lo-step)/step)*step; v<=hi+step; v+=step) out.push(v);
  return out;
}
function renderLocalContours(gk,z,u){
  const b=visibleBox(), L=localContourLevels(gk,z);
  let s='<g pointer-events="none">';
  L.forEach((lv,idx)=>{
    /* 计曲线：按军用地形图图式每隔 4 条首曲线加粗一条（即每 5 条） */
    const major=idx%5===0;
    const segs=contourSegments(gk,lv).filter(sg=>{
      const mx=(sg[0][0]+sg[1][0])/2, my=(sg[0][1]+sg[1][1])/2;
      return mx>=b.x-6&&mx<=b.x+b.w+6&&my>=b.y-6&&my<=b.y+b.h+6;
    });
    if(!segs.length) return;
    const d=segs.map(sg=>'M'+sg[0][0].toFixed(1)+' '+sg[0][1].toFixed(1)+'L'+sg[1][0].toFixed(1)+' '+sg[1][1].toFixed(1)).join('');
    s+='<path d="'+d+'" fill="none" stroke="'+(major?'#dcc590':'#9aa884')+'" stroke-width="'+
       ((major?1.5:0.8)*u).toFixed(2)+'" opacity="'+(major?0.78:0.5)+'" stroke-linecap="round"/>';
    if(major){
      const stepN=Math.max(1,Math.floor(segs.length/5));
      for(let k=stepN;k<segs.length;k+=stepN*2){
        const mx=(segs[k][0][0]+segs[k][1][0])/2, my=(segs[k][0][1]+segs[k][1][1])/2;
        s+='<text x="'+mx.toFixed(1)+'" y="'+(my-3*u).toFixed(1)+'" font-size="'+(10*u).toFixed(2)+
           '" fill="#e4b969" opacity=".9" text-anchor="middle">'+lv+'m</text>';
      }
    }
  });
  return s+'</g>';
}
/* 营连级：每个子格填充真实派生信息（要点符号 / 名称 / 高程 / 攻防效应），
   显式史料要点由 renderFeatures 用大符号单独绘制，此处跳过以免重复 */
function renderSubFeatures(gk,z,u){
  if(z<2) return '';
  const v=visibleCells(), b=visibleBox();
  const explicit=new Set(featureCells(gk).map(o=>[o.x,o.y,o.sx,o.sy].join(',')));
  const occ=occupiedSubCells();
  let s='<g pointer-events="none">';
  for(let y=v.ay;y<v.by;y++) for(let x=v.ax;x<v.bx;x++) for(let sy=0;sy<SUB;sy++) for(let sx=0;sx<SUB;sx++){
    const w=subWorld(x,y,sx,sy);
    const hw=CW/SUB/2, hh=CH/SUB/2;
    if(w.cx-hw<b.x||w.cx+hw>b.x+b.w||w.cy-hh<b.y||w.cy+hh>b.y+b.h) continue;
    if(explicit.has([x,y,sx,sy].join(','))) continue;
    const f=subFeature(gk,x,y,sx,sy), K=FEATURE_KIND[f.k], tf=u*1.6;
    if(occ.has([x,y,sx,sy].join(','))){
      s+='<rect x="'+(w.cx-CW/SUB/2).toFixed(1)+'" y="'+(w.cy-CH/SUB/2).toFixed(1)+
         '" width="'+(CW/SUB).toFixed(1)+'" height="'+(CH/SUB).toFixed(1)+
         '" fill="#0b1c16" opacity=".38" stroke="#3b5a48" stroke-width="0.6"/>';
      s+='<text x="'+w.cx.toFixed(1)+'" y="'+(w.cy-20*tf).toFixed(1)+'" text-anchor="middle" font-size="'+
         (9*tf).toFixed(2)+'" fill="#8fae9f" opacity=".95">'+esc(f.dir)+' · '+f.elev+'m</text>';
      continue;
    }
    /* 四行子格卡片：方位+高程 / 要点符号 / 要点名 / 攻防效应，行距大于字号 */
    s+='<text x="'+w.cx.toFixed(1)+'" y="'+(w.cy-20*tf).toFixed(1)+'" text-anchor="middle" font-size="'+
       (9*tf).toFixed(2)+'" fill="#8fae9f" opacity=".95">'+esc(f.dir)+' · '+f.elev+'m</text>';
    s+='<g opacity=".9">'+featureSymbol(f.k,w.cx,w.cy-3*tf,4*tf,K.c)+'</g>';
    s+='<text x="'+w.cx.toFixed(1)+'" y="'+(w.cy+9*tf).toFixed(1)+'" text-anchor="middle" font-size="'+
       (8*tf).toFixed(2)+'" fill="'+K.c+'">'+esc(K.n)+'</text>';
    s+='<text x="'+w.cx.toFixed(1)+'" y="'+(w.cy+19*tf).toFixed(1)+'" text-anchor="middle" font-size="'+
       (7.5*tf).toFixed(2)+'" fill="#a9c0b3">防'+(f.eff.def>=0?'+':'')+Math.round(f.eff.def*100)+
       '% 攻'+(f.eff.att>=0?'+':'')+Math.round(f.eff.att*100)+'%</text>';
  }
  return s+'</g>';
}

/* ============================================================
   v0.6 · 下级单位地图渲染与微格热区
   ============================================================ */
function occupiedSubCells(){
  const out=new Set();
  for(const id in S.subs){ const s=S.subs[id];
    if(!s.alive||!s.placed||s.level==='squad') continue;
    out.add([s.placed.x,s.placed.y,s.placed.sx,s.placed.sy].join(','));
  }
  return out;
}
function subAt(x,y,sx,sy,mx,my){
  const list=[];
  for(const id in S.subs){ const s=S.subs[id];
    if(!s.alive||!s.placed||s.detached) continue;
    const p=s.placed;
    if(p.x!==x||p.y!==y||p.sx!==sx||p.sy!==sy) continue;
    if(s.level==='battalion'){ list.push({s,pri:1}); continue; }
    if(mx===undefined||my===undefined){ list.push({s,pri:s.level==='company'?2:3}); continue; }
    if(p.mx===mx&&p.my===my) list.push({s,pri:s.level==='company'?2:3});
  }
  list.sort((a,b)=>a.pri-b.pri);
  return list.length?list[0].s:null;
}
function subColor(sub){
  if(sub.level==='battalion') return BTASKS[sub.task]?BTASKS[sub.task].c:'#8fa79c';
  if(sub.level==='company'){
    const b=parentOf(sub); return b&&BTASKS[b.task]?BTASKS[b.task].c:'#8fc4d8';
  }
  return '#a9c47a';
}
function subShort(sub){ return sub.name.slice(-2); }
/* 层级符号：营=方框，连=圆，班=三角；任务色描边，选中加外环 */
function subUnitSymbol(sub,cx,cy,u,z){
  const col=subColor(sub), sel=(S.treeSel===sub.id||S.deployTarget===sub.id);
  const label=subShort(sub);
  const line2=sub.level==='battalion'?(BTASKS[sub.task].n+' · '+sub.men+'人'):
              sub.level==='company'?(sub.men+'人 · '+((CACTS[sub.lastAct]||{}).n||'待命')):'';
  const rm=/^r(\d+)/.exec(sub.id), rn=rm?+rm[1]-1:0;
  return unitBadge({cx,cy,u,level:sub.level,foe:false,color:col,label,sub:line2,
    selected:sel,dead:!sub.alive||sub.men<=0,compact:false,
    corner:String(rn+1),cornerColor:REG_COLOR[rn%REG_COLOR.length]});
}
/* 按比例尺解聚：Z1 只显示团；Z2 显示全部营；Z3 显示营 + 焦点营的连 / 已展开的班 */
function renderSubUnits(z,u){
  if(z===0) return '';
  const b=visibleBox(), pad=(z>=2?6*u:24*u);
  let s='';
  const focus=S.focusSub||null;
  for(const id in S.subs){
    const sub=S.subs[id];
    if(!sub.alive||sub.detached||!sub.placed) continue;
    if(z===1 && sub.level!=='battalion') continue;
    if(z>=2 && sub.level==='company'){
      const b2=parentOf(sub);
      if(focus && b2 && b2.id!==focus) continue;
    }
    if(z>=2 && sub.level==='battalion' && focus && sub.id!==focus){
      const pp=subPos(sub);
      if(!pp||pp.cx<b.x||pp.cx>b.x+b.w||pp.cy<b.y||pp.cy>b.y+b.h) continue;
    }
    if(z>=2 && sub.level==='squad'){
      if(!S.expanded.has(sub.parent)) continue;
      const c=parentOf(sub), b2=c?parentOf(c):null;
      if(focus && b2 && b2.id!==focus) continue;
    }
    const p=subPos(sub); if(!p) continue;
    const cx=p.cx+(sub.placed.dx||0)*(CW/SUB/SUB), cy=p.cy+(sub.placed.dy||0)*(CH/SUB/SUB);
    if(cx<b.x-pad||cx>b.x+b.w+pad||cy<b.y-pad||cy>b.y+b.h+pad) continue;
    s+=subUnitSymbol(sub,cx,cy,u,z);
  }
  return s;
}
/* 微格热区：营连级把子格再分 3×3，使连 / 班有可点击的部署位置 */
function renderMicroHit(z,u){
  if(z<2) return '';
  const v=visibleCells(), b=visibleBox(), sw=CW/SUB/SUB, sh=CH/SUB/SUB;
  let s='';
  for(let y=v.ay;y<v.by;y++) for(let x=v.ax;x<v.bx;x++) for(let sy=0;sy<SUB;sy++) for(let sx=0;sx<SUB;sx++){
    const bx=x*CW+sx*CW/SUB, by=y*CH+sy*CH/SUB;
    if(bx<b.x||bx+CW/SUB>b.x+b.w||by<b.y||by+CH/SUB>b.y+b.h) continue;
    for(let my=0;my<SUB;my++) for(let mx=0;mx<SUB;mx++){
      const px=bx+mx*sw, py=by+my*sh;
      s+='<rect class="tile" data-x="'+x+'" data-y="'+y+'" data-sx="'+sx+'" data-sy="'+sy+
         '" data-mx="'+mx+'" data-my="'+my+'" x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+
         '" width="'+sw.toFixed(1)+'" height="'+sh.toFixed(1)+'"><title>'+
         esc(microTip(x,y,sx,sy,mx,my))+'</title></rect>';
    }
  }
  return s;
}
function microTip(x,y,sx,sy,mx,my){

/* ============================================================
   v0.7 · 局部视图的敌我方位感
   9 倍视口仅约 2 格宽，敌我初始常相距数格。借鉴军用态势图的
   "视界外目标指示"：边缘方向标 + 一键定位，避免放大后迷失敌我。
   ============================================================ */
function focusEnemy(){
  const b=visibleBox(), ccx=b.x+b.w/2, ccy=b.y+b.h/2;
  let best=null,bd=1e9;
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeSeen(e)) continue;    // 只定位已侦知的敌情
    const rp=foeReportPos(e);
    const d=Math.abs((rp.x+0.5)*CW-ccx)+Math.abs((rp.y+0.5)*CH-ccy);
    if(d<bd){bd=d;best=rp;}
  }
  if(!best){ log('【定位敌情】无已确认敌情，请先组织侦察（侦察连 / 连级侦察动作 / 忍耐待机 / 群众通报）。','warn'); return; }
  const z=S.view.z===0?1:S.view.z;
  zoomSet(z,(best.x+0.5)*CW,(best.y+0.5)*CH);
  log('【定位敌情】视口已对准最后确认位置'+(best.stale?'（情报已过 '+best.stale+' 时段）':'')+'。','');
}

function focusContact(){
  let best=null,bd=99;
  for(const r of S.pieces.filter(p=>p.kind==='regiment'&&p.alive))
    for(const e of S.enemies.filter(v=>v.alive&&v.active&&foeSeen(v))){
      const rp=foeReportPos(e);
      const d=Math.abs(r.x-rp.x)+Math.abs(r.y-rp.y);
      if(d<bd){bd=d;best={r,x:rp.x,y:rp.y,name:e.name,stale:rp.stale};}
    }
  if(!best){ log('【定位接触带】暂无已确认敌情；先以侦察确认敌位置，或等待敌我接触。','warn'); return; }
  const z=bd<=1?2:1;
  zoomSet(z,((best.r.x+best.x)/2+0.5)*CW,((best.r.y+best.y)/2+0.5)*CH);
  log('【定位接触带】按最后确认位置估算 '+best.r.name+' 与 '+best.name+' 相距约 '+bd+' 格'+
      (best.stale?'（情报已过 '+best.stale+' 时段）':'')+'，已切到'+esc(ZOOMS[z].name)+'视图。','');
}

function renderEdgeCues(z,u){
  if(z===0) return '';
  const b=visibleBox(), ccx=b.x+b.w/2, ccy=b.y+b.h/2, out=[];
  const add=(x,y,foe,name)=>{
    const wx=(x+0.5)*CW, wy=(y+0.5)*CH;
    if(wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h) return;
    const d=Math.max(Math.abs(wx-ccx)/CW,Math.abs(wy-ccy)/CH);
    out.push({wx,wy,foe,name,d});
  };
  for(const e of S.enemies){                          // 未侦知敌不进入方位指示
    if(!e.alive||!e.active||!foeSeen(e)) continue;
    const rp=foeReportPos(e);
    add(rp.x,rp.y,true,foeShortName(e)+(rp.stale?'('+rp.stale+'时段前)':''));
  }
  for(const r of S.pieces.filter(p=>p.kind==='regiment'&&p.alive))
    add(r.x,r.y,false,r.name.replace('第 ',''));
  const near=(foe)=>out.filter(o=>o.foe===foe).sort((a,b)=>a.d-b.d)[0];
  const pick=[near(true),near(false)].filter(Boolean);
  let s='<g pointer-events="none">';
  pick.forEach((o,i)=>{
    const col=o.foe?FOE_FRAME:OUR_FRAME, bg=o.foe?FOE_BG:OUR_BG;
    const cx=clamp(o.wx,b.x+36*u,b.x+b.w-36*u);
    const cy=clamp(o.wy,b.y+9*u+i*15*u,b.y+b.h-9*u);
    const w=68*u, h=13*u, x=cx-w/2, y=cy-h/2;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+
       '" height="'+h.toFixed(1)+'" rx="'+(2*u).toFixed(1)+'" fill="'+bg+'" stroke="'+col+
       '" stroke-width="'+(1.2*u).toFixed(2)+'" opacity=".94"/>';
    let ax,ay,rot;
    if(o.wx<b.x){ ax=x+3*u; ay=cy; rot='M0 -3 L-5 0 L0 3 Z'; }
    else if(o.wx>b.x+b.w){ ax=x+w-3*u; ay=cy; rot='M0 -3 L5 0 L0 3 Z'; }
    else if(o.wy<b.y){ ax=cx; ay=y+2*u; rot='M-3 0 L0 -5 L3 0 Z'; }
    else { ax=cx; ay=y+h-2*u; rot='M-3 0 L0 5 L3 0 Z'; }
    s+='<path d="'+rot+'" transform="translate('+ax.toFixed(1)+' '+ay.toFixed(1)+')" fill="'+col+'" opacity=".9"/>';
    s+='<text x="'+cx.toFixed(1)+'" y="'+(cy+3.2*u).toFixed(1)+'" text-anchor="middle" font-size="'+
       (9*u).toFixed(2)+'" fill="'+col+'">'+esc((o.foe?'敌 ':'我 ')+o.name.slice(0,3)+' · '+o.d.toFixed(0)+'格')+'</text>';
  });
  return s+'</g>';
}

const SHEET_TARGET={left:'.left',right:'.right',info:'.center > .panel:last-child',more:'.top'};
function applySheet(){
  const body=document.body||null; if(!body||!S) return;
  if(body.setAttribute){
    if(S.sheet) body.setAttribute('data-sheet',S.sheet);
    else if(body.removeAttribute) body.removeAttribute('data-sheet');
  }
  if(body.classList){ if(S.sheet) body.classList.add('sheet-open'); else body.classList.remove('sheet-open'); }
  if(!document.querySelectorAll||!document.querySelector) return;
  const all=document.querySelectorAll('.msheet-open');
  if(all&&all.forEach) all.forEach(el=>{ if(el.classList) el.classList.remove('msheet-open'); });
  if(S.sheet&&SHEET_TARGET[S.sheet]){
    const el=document.querySelector(SHEET_TARGET[S.sheet]);
    if(el&&el.classList) el.classList.add('msheet-open');
  }
  const bar=document.getElementById('mbar');
  if(bar&&bar.querySelectorAll){
    const bs=bar.querySelectorAll('button[data-sheet]');
    if(bs&&bs.forEach) bs.forEach(b=>{
      if(!b.classList) return;
      if(b.getAttribute&&b.getAttribute('data-sheet')===S.sheet) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}
function toggleSheet(name){
  if(!S) return null;
  S.sheet=(S.sheet===name)?null:name;
  applySheet(); return S.sheet;
}

function toggleFullscreenMap(){

function pickCellAt(clientX,clientY,m){
  const b=visibleBox();
  const r=(m&&m.getBoundingClientRect)?m.getBoundingClientRect():{left:0,top:0,width:VW,height:VH};
  const wx=b.x+(clientX-(r.left||0))/Math.max(1,r.width||VW)*b.w;
  const wy=b.y+(clientY-(r.top||0))/Math.max(1,r.height||VH)*b.h;
  const x=clamp(Math.floor(wx/CW),0,W-1), y=clamp(Math.floor(wy/CH),0,H-1);
  const out={x,y}, z=S.view.z;
  if(z>=1){
    const fx=(wx-x*CW)/(CW/SUB), fy=(wy-y*CH)/(CH/SUB);
    out.sx=clamp(Math.floor(fx),0,SUB-1); out.sy=clamp(Math.floor(fy),0,SUB-1);
    if(z>=2){
      out.mx=clamp(Math.floor((fx-out.sx)*SUB),0,SUB-1);
      out.my=clamp(Math.floor((fy-out.sy)*SUB),0,SUB-1);
    }
  }
  return out;
}

/* ============================================================
   v1.4 · 现代战略游戏地图交互
   1) 右键上下文命令：按目标（空格 / 已侦知敌 / 我方阵位）给出可执行命令

function foeAtCell(x,y){
  for(const e of S.enemies){
    if(!e.alive||!e.active||!foeSighted(e)) continue;

function closeCtxMenu(){
